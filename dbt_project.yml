name: postgres_bug_analysis
version: "1.0.0"
profile: postgres_bug_analysis

flags:
  send_anonymous_usage_stats: false

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: target
clean-targets: [target]

# Project variables live in vars.yml (dbt auto-parses it before this file).

# One schema per layer (generate_schema_name.sql uses these names verbatim).
models:
  postgres_bug_analysis:
    raw_git:
      # Python models reading .cache/postgres.git directly at build time
      # — the git side has no CSV landing layer; the clone is the raw store.
      +materialized: table
      +schema: raw
    raw_mail:
      # Python models decoding .cache/mbox mboxes at build time — the
      # mail side has no CSV landing layer; the mbox cache is the raw store.
      +materialized: table
      +schema: raw
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      # Typed tables — the interface the faces read (dct queries this
      # .duckdb file read-only via the `warehouse` source), and what dbt
      # tests query, so types survive end to end with no sniffing. The
      # on-run-end hook below exports each mart to data/derived/*.csv:
      # a write-only, line-diffable audit artifact that is committed and
      # reviewed but never read back by anything.
      +materialized: table
      +schema: marts

seeds:
  postgres_bug_analysis:
    +schema: seeds

# Export every successfully built mart to its diffable CSV twin.
on-run-end:
  - "{{ export_marts_csv(results) }}"
  # sweep tables/views left behind by renamed or deleted models (dbt never drops
  # a departed model's relation). Sources are never touched; disable with
  # var('drop_orphaned_relations', false). See macros/drop_orphaned_relations.sql.
  - "{{ drop_orphaned_relations() }}"
