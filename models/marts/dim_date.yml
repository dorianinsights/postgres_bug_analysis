version: 2

models:
  - name: dim_date
    description: >
      Calendar dimension -> data/derived/dim_date.csv: one row per day across
      the release calendar's span (the start of int_release_calendar's first
      year through its last scheduled release), plus two sentinel rows just
      outside it -- past_eternity (1900-01-01) and future_eternity (9999-01-01)
      -- so an unknown / not-applicable date reference can point at a real row
      instead of NULL. Facts store the calendar DATE and join on date_day; there
      is no separate integer date key. The relationships tests to date_day on
      the source-side date columns and every mart date column are the sanity
      check for a date outside the corpus (a skewed client Date header).
      Grain = date_day.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        tests: [not_null, unique]
      - name: is_weekday
        tests: [not_null]
      - name: is_synthetic_row
        description: >
          True for the two eternity sentinels (past_eternity / future_eternity,
          dim_date's equivalents of the special members), false for every real
          calendar day. The reliable flag for excluding the synthetic rows from
          analytics.
        tests: [not_null]
