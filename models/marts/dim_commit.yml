version: 2

models:
  - name: dim_commit
    description: >
      Commit dimension: one row per git commit -- the single home for commit-level
      attributes and the conformed keys resolved once per commit. Replaces the
      retired commit-grain fact; a commit's measures (churn, file count) are
      aggregates of its file rows in fct_commit_files, so only descriptors and FKs
      live here. Conforms to dim_person (author + committer), dim_date (commit_dt),
      dim_release (the release it shipped in, or the OPEN release for a released
      major's not-yet-tagged stable-branch commits -- the pending fix stream),
      dim_version, dim_major. The fix-commit spine rides here: fix_key (the
      normalized subject, the identity of a fix across its backpatches),
      is_housekeeping (stamps / translations / notes drafting -- not fixes) and
      is_documented / documented_item_ord (the release-notes item citing the
      commit). NO special members (deliberate
      exception): the only referencing fact, fct_commit_files, is built from this
      spine, so its dim_commit_key never misses. Too many rows for a derived CSV
      twin (over var(derived_csv_max_rows)); query it in the warehouse.
      Grain = commit_hash.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [commit_hash]
    columns:
      - name: dim_commit_key
        tests: [not_null, unique]
      - name: commit_hash
        tests: [not_null, unique]
      - name: author_dim_person_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_person')
                field: dim_person_key
      - name: committer_dim_person_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_person')
                field: dim_person_key
      - name: dim_release_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_release')
                field: dim_release_key
      - name: dim_version_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_version')
                field: dim_version_key
      - name: dim_major_key
        tests:
          - not_null
          - not_unknown_member
          - relationships:
              arguments:
                to: ref('dim_major')
                field: dim_major_key
      - name: commit_dt
        description: The commit's UTC calendar day; conforms to dim_date.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: commit_ts
        tests: [not_null]
      - name: branch_scope
        description: >
          The commit's own lifecycle scope for churn views: trunk (master), beta
          (a major's pre-GA stabilization on its stable branch -- every major's,
          not only the in-progress one), stable (the backpatch stream: shipped
          in, or pending for, a minor), other.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [trunk, stable, beta, other]
      - name: origin
        tests: [not_null]
      - name: has_ai_involvement
        description: >
          Disclosed AI involvement in this commit's fix (int_commit_ai_labels,
          per fix_key): a vendor AND at least one work role. The roles ai_found /
          ai_analyzed / ai_authored / ai_tooling are independent flags;
          ai_mentioned_only is a reference without involvement.
        tests: [not_null]
      - name: ai_found
        tests: [not_null]
      - name: ai_analyzed
        tests: [not_null]
      - name: ai_authored
        tests: [not_null]
      - name: ai_tooling
        tests: [not_null]
      - name: ai_mentioned_only
        tests: [not_null]
      - name: ai_vendor
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [anthropic, openai, google, microsoft, other, unspecified, none]
      - name: ai_disclosure_form
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [trailer, prose, disclaimer, none]
      - name: ai_label_source
        description: review (hand-verified) / model / unclassified (cached-only build).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [review, model, unclassified]
      - name: dominant_subsystem
        description: The area this commit mostly touched -- a weighted vote over its files (int_commit_files).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - core_server
                  - client_tools
                  - extensions_contrib
                  - replication_recovery
                  - planner
                  - tests
                  - docs
                  - build_platform
                  - other
      - name: subject
        tests: [not_null]
      - name: fix_key
        description: The normalized subject (int_git_commits); COUNT(DISTINCT fix_key) is "distinct fix commits".
        tests:
          - not_null
          # exactly one representative commit per backpatched fix
          - unique:
              config:
                where: is_representative_commit
      - name: is_housekeeping
        description: Release mechanics (version stamps, translation refreshes, release-notes drafting, tz data, pgindent), excluded from every fix count.
        tests: [not_null]
      - name: is_representative_commit
        description: >
          One commit per backpatched fix: within the stable (backpatch) scope,
          the fix_key's largest backpatch by total churn (newest major, then
          newest commit, as tiebreaks). Sum churn over these to measure work
          per fix rather than per backpatch, since the number of stable
          branches in the corpus grew from one to five. False outside the
          backpatch stream.
        tests:
          - not_null
          # only the backpatch stream has representatives ...
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= false OR branch_scope = 'stable'"
      - name: is_documented
        description: Whether a release-notes item cites this commit (int_fix_commits, inverted).
        tests: [not_null]
      - name: documented_item_ord
        description: The citing item's fct_fixes.item_ord; NULL when no item cites the commit (an attribute, not an FK).
        tests:
          - relationships:
              arguments:
                to: ref('fct_fixes')
                field: item_ord
      - name: is_synthetic_row
        description: >
          Always false here: dim_commit carries no Kimball special members (it is
          built from the commit spine), so every row is a real commit. The column
          exists for uniformity across all dimensions so dashboards can filter on
          it unconditionally.
        tests: [not_null]
