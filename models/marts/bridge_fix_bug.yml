version: 2

models:
  - name: bridge_fix_bug
    description: >
      Fix<->bug bridge -> data/derived/bridge_fix_bug.csv: one row per
      (fix, bug report), through the fix's implementing commits
      (int_fix_commits) and their commit -> bug links (int_commit_bug_links);
      the dim_bug join restricts it to corpus-window reports. fct_fixes rolls
      it up for bug_link_cnt and the primary bug. Grain = (item_ord, dim_bug_key).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [item_ord, dim_bug_key]
    columns:
      - name: item_ord
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_fixes')
                field: item_ord
      - name: dim_bug_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_bug')
                field: dim_bug_key
