version: 2

models:
  - name: int_git_commits
    description: >
      Commit grain with the derived analysis attributes: fix_key (the normalized
      subject -- the identity of a committed fix across its backpatches),
      is_housekeeping (stamps, translation refreshes, release-notes drafting and
      the like: commits that are not fixes), and the real patch author from the
      Author: trailer. Every downstream commit reader starts here, not at
      stg_git_commits. Grain = commit_hash (a hash lives on exactly one
      branch, asserted on stg_git_commits).
    columns:
      - name: branch
        tests: [not_null]
      - name: commit_hash
        tests: [not_null, unique]
      - name: commit_ts
        tests: [not_null]
      - name: subject
        tests: [not_null]
      - name: fix_key
        description: LOWER(TRIM(subject)) with internal whitespace collapsed; the single dedup key for "distinct fix commits".
        tests: [not_null]
      - name: is_housekeeping
        tests: [not_null]
