version: 2

models:
  - name: int_git_commits
    description: >
      Commit grain with the derived analysis attributes. fix_key: the normalized
      subject (lowercased, whitespace collapsed) -- the identity of a committed
      fix, since PostgreSQL backpatches by cherry-pick and the same fix on N
      branches is N hashes but one subject; every distinct-fix count on the
      commit side is COUNT(DISTINCT fix_key). is_housekeeping: release mechanics
      that are commits but not fixes (version stamps, translation refreshes,
      release-notes drafting, time-zone data, copyright bumps, pgindent runs),
      excluded from every fix count. patch_author_*: the REAL patch author --
      PostgreSQL sets the git author to the committer and credits the
      contributor in the body's "Author: Name <email>" trailer (about 42% of
      commits), so it is that trailer when present, else the committer.
      bug_refs / discussion_refs: the body's "Bug: #NNNNN" numbers and its
      Discussion: trailer message ids (both URL spellings, percent-decoded to
      the bare id), each a sorted distinct list or NULL -- every parse of the
      commit body lives here, and int_commit_bug_links / int_commit_discussions
      just unnest them. Every downstream commit reader starts here, not at
      stg_git_commits. Grain = commit_hash (a hash lives on exactly one branch,
      asserted on stg_git_commits).
    tests:
      - dbt_utils.expression_is_true:
          config:
            where: "bug_refs IS NOT NULL"
          arguments:
            expression: >-
              LEN(bug_refs) >= 1
              AND bug_refs = LIST_SORT(LIST_DISTINCT(bug_refs))
              AND LEN(LIST_FILTER(bug_refs, num -> num < 1)) = 0
      - dbt_utils.expression_is_true:
          config:
            where: "discussion_refs IS NOT NULL"
          arguments:
            expression: >-
              LEN(discussion_refs) >= 1
              AND discussion_refs = LIST_SORT(LIST_DISTINCT(discussion_refs))
              AND LEN(LIST_FILTER(discussion_refs, msg -> msg = '' OR msg LIKE '%<%' OR msg LIKE '%>%')) = 0
    columns:
      - name: branch
        tests: [not_null]
      - name: commit_hash
        tests: [not_null, unique]
      - name: commit_ts
        tests: [not_null]
      - name: subject
        tests: [not_null]
      - name: body_author_name
        description: The name in the body's "Author:" trailer; NULL when the committer wrote the patch.
      - name: body_author_email
        description: The email in the body's "Author:" trailer; NULL when the committer wrote the patch.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "IS NOT NULL = (body_author_name IS NOT NULL)"
      - name: patch_author_name
        description: body_author_name, else committer_name.
        tests: [not_null]
      - name: patch_author_email
        description: body_author_email, else committer_email.
        tests: [not_null]
      - name: fix_key
        description: LOWER(TRIM(subject)) with internal whitespace collapsed; the single dedup key for "distinct fix commits".
        tests: [not_null]
      - name: is_housekeeping
        tests: [not_null]
      - name: backpatch_through_major
        description: >
          The oldest major the fix was applied to, from the body's
          "Backpatch-through: N" trailer (9.x majors included, so it can name a
          branch below the corpus floor; the in-development major on a
          master-only fix). Standard on backpatched fixes since 2025, on about
          a third before; NULL when absent or non-numeric.
        tests:
          # a stated major and an explicit "master" are mutually exclusive
          - dbt_utils.expression_is_true:
              arguments:
                expression: IS NULL OR NOT is_backpatch_declared_none
      - name: is_backpatch_declared_none
        description: 'True when the trailer reads "Backpatch-through: master" (or head / none), an explicit "not backpatched".'
        tests: [not_null]
