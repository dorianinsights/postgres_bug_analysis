version: 2

models:
  - name: int_release_calendar
    description: >
      The release schedule: one row per date PostgreSQL is scheduled to release
      a minor version, computed from the rule (the second Thursday of each
      var(release_months) month) rather than from tags, with the Monday of that
      week as the wrap day (the content cutoff). Unlike int_versions, which
      lists the tags that exist, this covers dates with no tag yet: the open and
      future releases, and the cycle before the corpus's first release. It runs
      from the year before the earliest corpus release tag through
      var(release_calendar_horizon_months) past today, so it moves with
      FIRST_MAJOR and has no date literal; dim_date spans it. Emergency
      re-releases are not on the schedule and are deliberately absent. The
      assert_release_calendar_matches_observed_wraps test checks the computed
      wrap days against the real tags where both exist.
      Grain = scheduled_release_dt.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: ISODOW(scheduled_release_dt) = 4
      - dbt_utils.expression_is_true:
          arguments:
            expression: ISODOW(wrap_dt) = 1
    columns:
      - name: scheduled_release_dt
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: wrap_dt
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
