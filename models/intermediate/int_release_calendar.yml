version: 2

models:
  - name: int_release_calendar
    description: >
      Scheduled minor releases (second Thursday of Feb/May/Aug/Nov) and
      their wrap Mondays (release - 3 days, the content cutoff), computed
      from the rule so it extends one release past today. The grid is
      anchored on the corpus (February of the year before the earliest
      corpus release tag in stg_git_tags), not on a date literal, so it moves
      with FIRST_MAJOR. Out-of-band releases are deliberately absent.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: ISODOW(scheduled_release_dt) = 4
      - dbt_utils.expression_is_true:
          arguments:
            expression: ISODOW(wrap_dt) = 1
      - dbt_utils.expression_is_true:
          arguments:
            expression: MONTH(scheduled_release_dt) IN (2, 5, 8, 11)
    columns:
      # both dates conform to dim_date: the calendar is generated from 2016-08
      # through six months past today, so if either relationships test fails the
      # fixed calendar spine no longer covers the schedule — widen
      # date_spine_start / date_spine_end in vars.yml and rebuild
      - name: scheduled_release_dt
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: wrap_dt
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
