version: 2

models:
  - name: int_release_calendar
    description: >
      Scheduled minor releases (the second Thursday of each var(release_months)
      month) and their wrap Mondays (the Monday of release week, the content
      cutoff), computed from the rule from the year before the earliest corpus
      release tag through var(release_calendar_horizon_months) past today. No
      date literal: the grid moves with FIRST_MAJOR, and dim_date's spine is
      this calendar's span. The assert_release_calendar_matches_observed_wraps
      test pins the computed wraps to the observed tags where both exist.
      Out-of-band releases are deliberately absent.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: ISODOW(scheduled_release_dt) = 4
      - dbt_utils.expression_is_true:
          arguments:
            expression: ISODOW(wrap_dt) = 1
    columns:
      - name: scheduled_release_dt
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: wrap_dt
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
