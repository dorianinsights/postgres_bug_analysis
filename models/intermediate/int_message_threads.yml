version: 2

models:
  - name: int_message_threads
    description: >
      The message-grain model: every archived message with its sender, its
      thread resolved TRANSITIVELY (the direct parent -- In-Reply-To, else the
      last References id -- and the thread root, the topmost archived ancestor
      reached by climbing the parent chain within the list), whether it starts
      a thread (no parent header), whether it is its thread's root (the
      earliest archived message), whether its thread was eventually cited by a
      commit Discussion: trailer, plus the pgsql-bugs report tag parsed in
      staging (bug_number) and is_bug_report, the report itself: the earliest
      bare "BUG #NNNNN:" message of its bug number, exactly one per bug (a
      re-post can repeat the subject). The body stays in stg_list_messages.
      Grain = (list_name, message_id).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [list_name, message_id]
      # a new thread's start is its own root
      - dbt_utils.expression_is_true:
          arguments:
            expression: NOT is_thread_start OR is_thread_root
      # the root is a message of this thread
      - dbt_utils.expression_is_true:
          arguments:
            expression: NOT is_thread_root OR root_id = message_id
    columns:
      - name: message_id
        tests: [not_null]
      - name: sent_dt
        tests: [not_null]
      - name: parent_id
        description: The direct parent's message id (in_reply_to, else the last References id); NULL when the message carries no reply header.
      - name: root_id
        description: The thread root's message id -- always an archived message on the same list.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_message_threads')
                field: message_id
      - name: is_thread_start
        tests: [not_null]
      - name: is_thread_root
        tests: [not_null]
      - name: is_fix_linked
        tests: [not_null]
      - name: bug_number
        description: The numbered pgsql-bugs report the subject names; NULL for free-form posts and other lists.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
          # exactly one report message per bug
          - unique:
              config:
                where: "is_bug_report"
      - name: form_reporter_name
        description: From staging; the web form's "Logged by:" name, NULL when the body isn't the form.
      - name: form_reporter_email
        description: From staging; the web form's "Email address:", NULL when the body isn't the form.
      - name: is_bug_report
        description: The one message that IS the numbered report (int_bug_reports' grain); false for replies, re-posts, free-form posts and other lists.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= false OR bug_number IS NOT NULL"
      - name: earliest_ship_release_dt
        description: >
          First scheduled minor whose wrap falls strictly after the send
          date — the earliest release a fix for this message could ship
          in.
        tests: [not_null]
