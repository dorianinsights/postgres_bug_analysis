version: 2

models:
  - name: int_fix_profile
    description: >
      Per-fix rollup of its implementing commits (int_fix_commits): annotation
      coverage, the representative commit's change profile (int_commit_profile
      -- the master commit when there is one, else the newest match; NULL when
      no annotated commit matched the corpus or it touched no files), and the
      origin resolved from every matched commit (resolve_fix_origin; a fix with
      no matched commit has no public trail and splits by its CVE mention).
      fct_fixes and fct_fix_origins_agg read it. Grain = item_ord.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: matched_commit_cnt <= annotated_commit_cnt
      - dbt_utils.expression_is_true:
          arguments:
            expression: matched_commit_cnt = 0 OR dominant_subsystem IS NOT NULL
    columns:
      - name: item_ord
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_fix_reps')
                field: item_ord
      - name: dominant_subsystem
        tests:
          - accepted_values:
              arguments:
                values:
                  - tests
                  - docs
                  - planner
                  - replication_recovery
                  - client_tools
                  - extensions_contrib
                  - build_platform
                  - core_server
                  - other
      - name: origin
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - pgsql-bugs
                  - pgsql-hackers
                  - unknown_or_internal_security
                  - unknown_or_internal_not_security
