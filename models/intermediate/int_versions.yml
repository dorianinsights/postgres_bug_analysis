version: 2

models:
  - name: int_versions
    description: >
      Release registry sourced from git release tags (REL_MAJOR_MINOR) rather
      than the SGML release notes -- one row per release. release_dt is the
      announced release day (always a Thursday), derived by snapping the tag's
      wrap date forward to the first Thursday on/after it; it reproduces the
      former SGML-sourced stg_releases.release_dt exactly. Grain = version.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: ISODOW(release_dt) = 4
    columns:
      - name: version
        tests:
          - not_null
          - unique
          # the tag registry and the SGML notes must agree: every tagged
          # release has changelog items (the converse, items without a tag, is
          # stg_release_items.version -> int_versions). A failure means a
          # release was tagged but not yet in the notes, or a corpus/tag-pattern
          # mismatch.
          - relationships:
              arguments:
                to: ref('stg_release_items')
                field: version
      - name: major
        tests:
          - not_null
          # one .0 per major line
          - unique:
              config:
                where: "is_major_release"
      - name: minor
        tests: [not_null]
      - name: is_major_release
        description: The .0 that opens a major line (minor = 0); false for its minors. Readers filter on this, not on minor arithmetic.
        tests: [not_null]
      - name: stable_branch
        description: The git branch every version of this major lives on (REL_M_STABLE).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^REL_\d+_STABLE$'
      - name: wrap_dt
        tests: [not_null]
      - name: release_dt
        tests: [not_null]
      - name: item_cnt
        description: Parsed changelog items for the version (stg_release_items); int_releases' out-of-band rule and dim_version read it.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
