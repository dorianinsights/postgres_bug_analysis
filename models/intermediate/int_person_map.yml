version: 2

models:
  - name: int_person_map
    description: >
      Identity resolution map: each (email, name) node_id from
      int_person_identities to its resolved person_key (connected component over
      shared email OR name). Grain = node_id.
    columns:
      - name: node_id
        tests: [not_null, unique]
      - name: person_key
        tests: [not_null]
