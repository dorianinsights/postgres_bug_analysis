version: 2

models:
  - name: int_commit_files
    description: >
      Every file touched by every commit, classified two ways: by directory into
      a subsystem (subsystem_rules, lowest match_order wins, 'other' fallback --
      where the change lives) and by extension into a file_class
      (file_class_rules -- what kind of file it is). int_commit_profile rolls it
      up per commit and fct_commit_files is built on it. Line counts are NULL
      for binary files (git numstat emits '-'), so binary churn is never
      counted. Grain = (commit_hash, file_path).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [commit_hash, file_path]
    columns:
      - name: commit_hash
        tests: [not_null]
      - name: file_path
        tests: [not_null]
      - name: subsystem
        description: The directory-based area (subsystem_rules; 'other' when no rule matches).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - core_server
                  - client_tools
                  - extensions_contrib
                  - replication_recovery
                  - planner
                  - tests
                  - docs
                  - build_platform
                  - other
      - name: file_class
        description: The extension-based file kind (file_class_rules; 'other' for extensionless/long-tail).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - source_c
                  - header
                  - sql
                  - perl
                  - python
                  - grammar
                  - docs
                  - embedded_sql
                  - catalog_data
                  - translations
                  - test_fixtures
                  - build
                  - other
      - name: lines_added
        description: Lines added to this file by this commit; NULL for binary files.
      - name: lines_deleted
        description: Lines deleted from this file by this commit; NULL for binary files.
