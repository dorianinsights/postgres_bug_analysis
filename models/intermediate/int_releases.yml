version: 2

models:
  - name: int_releases
    description: >
      The release registry -- one row per PostgreSQL release (shipped, open, or
      future), with the surrogate key minted once here so dim_release and
      dim_version both conform to the same dim_release_key. The open release is
      the first scheduled one after the latest TAGGED release (the registry, not
      the clock), so a release day is never both shipped and open; is_announced
      says whether a shipped release's day has arrived. Grain = dim_release_key.
    tests:
      # a scheduled release IS its own cycle's ship day; only out-of-band
      # releases fold forward
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(cycle_ships_at_dt = release_dt) = (NOT is_out_of_band)"
    columns:
      - name: dim_release_key
        tests: [not_null, unique]
      - name: release_dt
        tests:
          - unique
          - not_null
          # spans shipped through the last scheduled future release
          - dbt_utils.accepted_range:
              arguments:
                min_value: "{{ var('test_floor_release_dt') }}"
                max_value: "'{{ var('date_spine_end') }}'"
      - name: status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [shipped, open, future]
      - name: wrap_dt
        description: The tarball wrap day; NULL for out-of-band releases (not on the calendar).
      - name: versions
        tests: [not_null]
      - name: release_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: is_out_of_band
        tests: [not_null]
      - name: is_partial_window
        tests: [not_null]
      - name: is_announced
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= false OR status = 'shipped'"
      - name: cycle_ships_at_dt
        description: >
          The scheduled release day this release's cycle ships at: itself for a
          scheduled/open/future release, the next scheduled release for an
          out-of-band re-release. Cycle-grain measures fold releases by it.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_release_calendar')
                field: scheduled_release_dt

unit_tests:
  - name: int_releases_wrap_window_has_one_row_per_release_day
    description: >
      The Tuesday after a wrap Monday: the just-tagged release is already
      shipped (not yet announced), the OPEN release is the next quarter's, and
      no release day appears twice. This is the three-day window in which
      keying "open" on CURRENT_DATE produced a duplicate release_dt.
    model: int_releases
    overrides:
      vars:
        as_of_date: "2026-08-11"
        scheduled_release_min_items: 1
    given:
      - input: ref('int_versions')
        rows:
          - {version: "17.5", major: 17, minor: 5, wrap_dt: 2026-05-11, release_dt: 2026-05-14, item_cnt: 1}
          - {version: "17.6", major: 17, minor: 6, wrap_dt: 2026-08-10, release_dt: 2026-08-13, item_cnt: 1}
      - input: ref('int_release_calendar')
        rows:
          - {scheduled_release_dt: 2026-05-14, wrap_dt: 2026-05-11}
          - {scheduled_release_dt: 2026-08-13, wrap_dt: 2026-08-10}
          - {scheduled_release_dt: 2026-11-12, wrap_dt: 2026-11-09}
          - {scheduled_release_dt: 2027-02-11, wrap_dt: 2027-02-08}
    expect:
      rows:
        - {release_dt: 2026-05-14, status: shipped, is_announced: true, versions: "17.5"}
        - {release_dt: 2026-08-13, status: shipped, is_announced: false, versions: "17.6"}
        - {release_dt: 2026-11-12, status: open, is_announced: false, versions: "17.7"}
        - {release_dt: 2027-02-11, status: future, is_announced: false, versions: "17.8"}
