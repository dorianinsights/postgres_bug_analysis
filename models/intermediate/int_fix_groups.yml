version: 2

models:
  - name: int_fix_groups
    description: >
      item_ord -> group_ord (the component's lowest item_ord): the cross-branch
      dedup of release-notes items as connected components (the shared
      connected_components macro). Two items of one release are the same fix
      when EITHER their text_key or their hash_key matches, transitively -- the
      two signals cover each other's blind spots (wording drifts between branch
      files; a branch's block carries an extra follow-up commit). The hash key is
      the identical full hash set, since a mere hash overlap would merge
      different fixes that share a combined backpatch commit. Every fix item
      appears exactly once. Grain = item_ord.
    tests:
      # group_ord is the MIN item_ord of the component, so it can never
      # exceed any member's own ordinal.
      - dbt_utils.expression_is_true:
          arguments:
            expression: group_ord <= item_ord
    columns:
      - name: item_ord
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_fix_items')
                field: item_ord
      - name: group_ord
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_fix_items')
                field: item_ord
