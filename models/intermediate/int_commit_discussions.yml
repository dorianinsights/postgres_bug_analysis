version: 2

models:
  - name: int_commit_discussions
    description: >
      (commit_hash, message_id) from Discussion: trailers in commit bodies
      — the connection between fixes to mailing-list threads, unnested
      from int_git_commits.discussion_refs (where the body is parsed). source_list
      is the archive that claims the cited id: a cross-posted message (about
      1,400 ids sit on both lists) defaults to pgsql-bugs, since a citation of
      a BUG thread means the work traces to a filed report; NULL when the id is
      not in the archive (pre-corpus, or a list we don't ingest). Reads
      stg_list_messages rather than int_message_threads because the thread
      model depends on this one. Grain = (commit_hash, message_id).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [commit_hash, message_id]
    columns:
      - name: commit_hash
        tests: [not_null]
      - name: message_id
        tests: [not_null]
      - name: source_list
        tests:
          - accepted_values:
              arguments:
                values: [pgsql-bugs, pgsql-hackers]
      - name: bug_number
        description: The numbered pgsql-bugs report the cited message belongs to; NULL for hackers threads, free-form bug posts and unarchived ids.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "IS NULL OR source_list = 'pgsql-bugs'"
