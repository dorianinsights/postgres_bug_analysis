version: 2

models:
  - name: int_release_cycles
    description: >
      What happened early in each release cycle, measured the same way for every
      cycle so the open one can be compared with the past ones. A cycle runs
      from one wrap Monday (cycle_start_dt) to the next scheduled release day
      (ships_at_dt). window_days is how old the open cycle is today; the
      early_* counts are the bug reports, list messages and distinct committed
      fixes that had arrived within that many days of each cycle's start, and
      full_fix_cnt is the cycle's eventual total, so early versus full is the
      pace comparison fct_fix_projections uses. first_window_fix_cnt is the
      same fix count over a fixed var(seasonality_window_days) so it does not
      move as the open cycle ages. Because window_days changes daily, every row
      changes daily. Fixes are assigned to cycles through
      int_releases.cycle_ships_at_dt, so an emergency re-release counts toward
      the cycle it came from. Only started cycles that ship a corpus release
      (or are still open) are kept; dim_release folds these columns onto the
      matching release row. Grain = ships_at_dt.
    columns:
      - name: ships_at_dt
        tests: [not_null, unique]
      - name: cycle_start_dt
        tests: [not_null]
      - name: window_days
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: early_report_cnt
        tests: [not_null]
      - name: early_message_cnt
        tests: [not_null]
      - name: early_fix_cnt
        tests: [not_null]
      - name: full_fix_cnt
        tests: [not_null]
      - name: first_window_fix_cnt
        tests: [not_null]
