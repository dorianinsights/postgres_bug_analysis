version: 2

models:
  - name: int_fix_origins
    description: >
      One row per distinct fix (dedup-group grain) with the origin its
      annotated commits resolve to. A fix whose annotated hashes match no
      corpus commit is absent — consumers COALESCE to
      unknown_or_internal.
    columns:
      - name: group_ord
        tests: [unique, not_null]
      - name: origin
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - pgsql-bugs
                  - pgsql-hackers
                  - unknown_or_internal_security
                  - unknown_or_internal_not_security
