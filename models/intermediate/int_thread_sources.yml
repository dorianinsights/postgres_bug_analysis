version: 2

models:
  - name: int_thread_sources
    description: >
      One row per distinct archived message id -> the mailing list that
      claims it. Cross-posts appear in several archives under one id;
      pgsql-bugs wins the tie because a citation of a BUG thread means the
      work traces back to a filed report. Grain = message_id.
    columns:
      - name: message_id
        tests: [unique, not_null]
      - name: source_list
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [pgsql-bugs, pgsql-hackers]
