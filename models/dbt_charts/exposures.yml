# Generated by `dct exposures` from the boards under charts/.
# Do not edit: change the board and re-run `dct exposures`.
exposures:
- name: 1_fix_analysis
  type: dashboard
  owner:
    name: Josh Andrews
    email: josh.andrews@dorianinsights.com
  label: PostgreSQL Fix Analysis
  description: 'Source attribution for fixes and development activity: each fix and
    master-branch commit is traced through its Discussion: trailers to pgsql-bugs
    (or a Bug: # trailer), pgsql-hackers, or unknown/other/internal when there is
    no public trail. Built to ground projections of how bug-report volume translates
    into fix volume. Data from the transform/ dbt project (fct_fix_origins_agg --
    documented and committed fixes per release by origin, the open release''s committed-so-far
    count included -- and fct_origin_activity_monthly_agg). The lists themselves are
    on the Email List Analysis face.

    '
  depends_on:
  - ref('fct_fix_origins_agg')
  - ref('fct_origin_activity_monthly_agg')
  config:
    meta:
      dbt_charts:
        board: charts/1_fix_analysis.yml
        queries:
          ai_commits:
          - ref('fct_origin_activity_monthly_agg')
          fix_commit_origins:
          - ref('fct_fix_origins_agg')
          fix_count:
          - ref('fct_fix_origins_agg')
          fix_cve_pct:
          - ref('fct_fix_origins_agg')
          fix_cve_split:
          - ref('fct_fix_origins_agg')
          fix_hardening_pct:
          - ref('fct_fix_origins_agg')
          fix_hardening_split:
          - ref('fct_fix_origins_agg')
          fix_origin_shares:
          - ref('fct_fix_origins_agg')
          fix_origins_count:
          - ref('fct_fix_origins_agg')
