- name: git_activity
  type: dashboard
  owner:
    name: Josh Andrews
    email: josh.andrews@dorianinsights.com
  label: PostgreSQL Fix Velocity — Git Commits
  description: 'Commit-level view of PostgreSQL''s released majors'' stable branches
    plus master, straight from the git history: backpatch commit volume per quarter,
    AI-tool- credited commits, and the pace of the open release cycle. IMPORTANT:
    every count here is GIT COMMITS (deduplicated by dim_commit.fix_key, the normalized
    subject, with housekeeping commits -- stamps, translation refreshes, release-notes
    drafting -- excluded), NOT the curated, user-facing fixes documented in the release
    notes — for those see the Changelog and Fix Origins dashboards. Only about half
    of fix commits ever become a documented release-note item (dim_release.documentation_rate),
    so these numbers run roughly 2x the Changelog''s per-release fix counts (they
    are also binned by calendar quarter here, not by release). Parsed from the postgres.git
    clone at build time by the transform/ dbt project (sources.git).

    '
  depends_on:
  - ref('dim_commit')
  - ref('dim_major')
  - ref('dim_release')
  - ref('dim_version')
  - ref('fct_branch_size_weekly')
