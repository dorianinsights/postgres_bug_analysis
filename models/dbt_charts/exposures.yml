- name: projected_fixes
  type: dashboard
  owner:
    name: Josh Andrews
    email: josh.andrews@dorianinsights.com
  label: Projected Upcoming Fix Counts
  description: 'How many fixes to expect in the next scheduled minor release: live
    accrual counters since the last wrap (the content cutoff), four signal estimates
    (three early signals times their historical median shipped-per-early ratios, plus
    the per-origin committed scaling, from every closed cycle replayed at today''s
    cycle age), the ratio history that shows how stable each scaling factor has been,
    and a backtest: every method replayed for every shipped release from the releases
    before it, against what that release actually shipped. Demand-side estimators
    (reports, messages) assume the historical signal-to-fix conversion; the supply-side
    ones (committed pace, by origin) react to the commit stream. Everything here is
    measured at the open cycle''s CURRENT age, so the estimates, the backtest and
    the scorecard all move day by day -- read the scorecard as "how each method would
    have done at this point in the cycle", not as a fixed ranking.

    '
  depends_on:
  - ref('dim_bug')
  - ref('dim_release')
  - ref('fct_fix_projections')
  - ref('fct_messages')
  config:
    meta:
      dbt_charts:
        board: charts/projected_fixes.yml
        queries:
          backtest:
          - ref('dim_release')
          - ref('fct_fix_projections')
          blended_estimate:
          - ref('dim_release')
          - ref('fct_fix_projections')
          estimates:
          - ref('dim_release')
          - ref('fct_fix_projections')
          method_scorecard:
          - ref('dim_release')
          - ref('fct_fix_projections')
          next_minor_fixes:
          - ref('dim_release')
          next_minor_messages:
          - ref('fct_messages')
          next_minor_reports:
          - ref('dim_bug')
          next_wrap:
          - ref('dim_release')
          pace_history:
          - ref('dim_release')
          ratio_history:
          - ref('dim_release')
