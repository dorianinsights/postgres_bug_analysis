- name: bug_reports
  type: dashboard
  owner:
    name: Josh Andrews
    email: josh.andrews@dorianinsights.com
  label: PostgreSQL Bug Reports
  description: 'What arrives on the pgsql-bugs mailing list and what happens to it:
    monthly report volume (every new pgsql-bugs thread, form or free-form), how many
    get acted upon (linked to a fix commit via the thread''s Discussion: trailer or,
    for form reports, a Bug: #NNNNN mention), and how fast -- every chart on one definition
    of a report: a new pgsql-bugs thread (fct_threads), form or free-form. Data files
    are produced by mailing_list_sync.py + the transform/ dbt project. Acted-upon
    is a LOWER BOUND (only exact links count), and recent months are right-censored
    — fixes for fresh reports haven''t landed yet.

    '
  depends_on:
  - ref('dim_release')
  - ref('fct_threads')
  config:
    meta:
      dbt_charts:
        board: charts/bug_reports.yml
        queries:
          fix_latency:
