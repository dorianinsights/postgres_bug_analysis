version: 2

models:
  - name: stg_list_messages
    description: >
      One archived mailing-list message, typed from the mbox-decoded raw
      layer: bare message id (transport angle brackets dropped -- the canonical
      identity commit Discussion trailers use), TIMESTAMPTZ sent_ts from the
      Date header (strict cast), author name/email split, threading headers
      (in_reply_to as the first bare id; reference_ids as the VARCHAR[] of the
      References header's ids, ancestors oldest first), full text body, and for
      pgsql-bugs
      the numbered report the subject names (bug_number; has_bug_report_subject
      marks a bare "BUG #NNNNN:" subject with no Re: -- a shape, not an
      identity, since a re-post can repeat it; int_message_threads picks the
      report). Empty strings and empty lists become NULL.
      Grain = (list_name, message_id).
    tests:
      - dbt_utils.expression_is_true:
          config:
            where: "reference_ids IS NOT NULL"
          arguments:
            expression: "LEN(reference_ids) >= 1 AND LEN(LIST_FILTER(reference_ids, ref -> ref = '')) = 0"
      # a bug tag only ever comes from pgsql-bugs, and a bug root carries one
      - dbt_utils.expression_is_true:
          arguments:
            expression: (bug_number IS NULL OR list_name = 'pgsql-bugs') AND (NOT has_bug_report_subject OR bug_number IS NOT NULL)
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [list_name, message_id]
    columns:
      - name: list_name
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [pgsql-bugs, pgsql-hackers]
      - name: message_id
        tests:
          - not_null
          # every archived message reaches the message-grain fact
          - relationships:
              arguments:
                to: ref('fct_messages')
                field: message_id
      - name: sent_ts
        description: >
          The sender's own Date header — client clocks can be skewed, so
          the accepted range is a loose sanity bound, not the archive
          window.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "'2000-01-01'"
                max_value: current_date + 2
      - name: sent_dt
        description: >
          sent_ts truncated to its UTC calendar day — the day-grain grouping key
          consumers use in place of re-truncating the instant. Conforms to
          dim_date; the relationships test fails on a skewed client Date header
          outside the corpus span.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: subject
        description: >
          NULL for the rare message sent with no Subject header (2 in the
          corpus) — sender-controlled, so not tested not_null.
      - name: in_reply_to
        description: The In-Reply-To header's first bare id; NULL when absent.
      - name: bug_number
        description: The numbered pgsql-bugs report the subject names; NULL for free-form posts and other lists.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: has_bug_report_subject
        tests: [not_null]
      - name: form_reporter_name
        description: The "Logged by:" name in a pgsql-bugs web-form body; NULL off that list or when the body isn't the form.
      - name: form_reporter_email
        description: The "Email address:" in a pgsql-bugs web-form body; NULL off that list or when the body isn't the form.
      - name: body_text
        description: >
          NULL for the rare message with no text part (1 in the corpus) —
          sender-controlled, so not tested not_null.
