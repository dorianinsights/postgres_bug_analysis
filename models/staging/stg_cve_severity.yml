version: 2

models:
  - name: stg_cve_severity
    description: >
      Typed view over data/raw/cve_severity.csv (pg-cve-scrape): one published
      PostgreSQL CVE per row with its CVSS v3 base score, vector, affected
      component, and its band from the cvss_severity_bands seed (range join on
      the score; the seed owns the thresholds). The score is DECIMAL(3,1), not
      a float: CVSS base scores are exact one-decimal values, so the band join
      compares them exactly. Grain = cve_id.
    columns:
      - name: cve_id
        tests:
          - not_null
          - unique
          - dbt_utils.not_empty_string
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^CVE-\d{4}-\d+$'
      - name: cvss_base_score
        description: >
          CVSS v3 base score, DECIMAL(3,1). Every CVE the security page lists
          carries one; a row without it means the page changed shape and the
          scrape needs a look, so this fails rather than passing NULL through.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 10
      - name: severity_band
        description: The score's band from the cvss_severity_bands seed.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('cvss_severity_bands')
                field: severity_band
      - name: severity_band_order
        description: The band's display order from the same seed row.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('cvss_severity_bands')
                field: severity_band_order
