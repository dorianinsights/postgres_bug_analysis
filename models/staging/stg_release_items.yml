version: 2

models:
  - name: stg_release_items
    description: One changelog item, typed. Grain = (version, item_index).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [version, item_index]
    columns:
      - name: version
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_versions')
                field: version
      - name: major
        tests:
          - not_null
      - name: release_dt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                max_value: current_date
      - name: item_index
        description: >
          The item's zero-based position in its release's "Changes" list,
          assigned by the SGML parser (not recorded by PostgreSQL). Restarts per
          version, so it is only meaningful paired with version; it is the key
          that ties stg_item_commits' annotations back to their item.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: summary
        tests: [not_null]
      - name: full_text
        tests: [not_null]
