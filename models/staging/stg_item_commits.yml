version: 2

models:
  - name: stg_item_commits
    description: >
      One (item, branch-commit) annotation from the SGML comment blocks.
      Grain = (version, item_index, branch, commit_hash) — an item can fold
      several commits, including more than one on the same branch
      (follow-up fixes).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [version, item_index, branch, commit_hash]
      # Every annotation hash is currently exactly 9 chars, and
      # int_fix_commits joins on LEFT(full_hash, 9). If git starts
      # abbreviating longer this fails — update that join key with it.
      - dbt_utils.expression_is_true:
          arguments:
            expression: LENGTH(commit_hash) = 9
    columns:
      - name: version
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_versions')
                field: version
      - name: item_index
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: author_name
        tests: [not_null]
      - name: author_email
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^\S+@\S+$'
      - name: branch
        tests:
          - not_null
          # Annotations reach back to pre-PG10 branches, whose naming had no
          # underscore after REL (REL9_6_STABLE vs REL_15_STABLE).
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^(master|REL_\d+_STABLE|REL\d+_\d+_STABLE)$'
      - name: commit_hash
        tests:
          - not_null
          # Abbreviated hex hashes; length grows with the repo, so 7-40.
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^[0-9a-f]{7,40}$'
      - name: commit_ts
        tests:
          - not_null
          # A true TIMESTAMP WITH TIME ZONE (STRPTIME raises on malformed
          # input, so a format break fails the build, not this test).
          - dbt_utils.accepted_range:
              arguments:
                min_value: "{{ var('test_floor_git_ts') }}"
                max_value: current_date + 2
