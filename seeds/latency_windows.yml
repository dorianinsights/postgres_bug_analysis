version: 2

seeds:
  - name: latency_windows
    description: >
      Report-to-first-commit latency buckets for days_to_commit_window in
      bug_report_outcomes — bounds and label defined together so they
      cannot drift apart. Contiguous, non-overlapping day ranges;
      max_days NULL = unbounded. The numeric label prefix makes a lexical
      sort the intended display order.
    config:
      column_types:
        label: VARCHAR
        min_days: INTEGER
        max_days: INTEGER
    tests:
      # the buckets tile the day line: inclusive integer ranges, so the
      # exclusive upper bound is max_days + 1 and must equal the next min_days
      # (the open-ended top bucket gets a one-day span so it is never empty)
      - dbt_utils.mutually_exclusive_ranges:
          arguments:
            lower_bound_column: min_days
            upper_bound_column: "COALESCE(max_days, min_days) + 1"
            gaps: not_allowed
    columns:
      - name: label
        tests: [unique, not_null]
      - name: min_days
        tests: [unique, not_null]
      - name: max_days
        tests: [unique]
