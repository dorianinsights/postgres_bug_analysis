# pgsql-bugs report volume and outcomes.
#
# The monthly volume chart is an area, not a bar: bars on a temporal axis
# label every bar (60 monthly labels collide into mush), while line/area
# charts get sparse auto time ticks. Categorical bar charts are unaffected.
title: "PostgreSQL Bug Reports"
description: >
  What arrives on the pgsql-bugs mailing list and what happens to it:
  monthly report volume (every new pgsql-bugs thread, form or free-form),
  how many of the BUG # form reports get acted upon (linked to a fix
  commit via the thread's Discussion: trailer or a Bug: #NNNNN mention),
  and how fast. Data files are produced by mailing_list_sync.py + the
  transform/ dbt project. Acted-upon is a LOWER BOUND (only exact links
  count), and recent months are right-censored — fixes for fresh reports
  haven't landed yet.

queries:
  monthly_reports:
    description: >
      Bug reports opened per month, where a report is a NEW THREAD on
      pgsql-bugs (fct_threads: its root has no reply header), split into the
      BUG #NNNNN web-form submissions and the free-form emails -- about a third
      of all reports, and cited by fix commits at a similar rate -- which the
      form-only count (dim_bug / fct_bug_reports_monthly_agg) never sees.
    source: warehouse
    sql: |
      SELECT
        DATE_TRUNC('month', started_dt)::DATE AS report_month,
        CASE WHEN is_form_report THEN 'BUG # form reports' ELSE 'free-form reports' END AS series,
        COUNT(*) AS report_cnt
      FROM fct_threads
      WHERE list_name = 'pgsql-bugs' AND is_new_thread
      GROUP BY 1, 2
      ORDER BY 1, 2

  monthly_trend:
    # false positive: AVG over the monthly COUNT is exactly what a rolling average is
    ignore: ["WARN-REAGGREGATION"]
    description: Six-month centered moving average of ALL reports (form + free-form).
    source: warehouse
    sql: |
      WITH monthly AS (
        SELECT DATE_TRUNC('month', started_dt)::DATE AS report_month, COUNT(*) AS report_cnt
        FROM fct_threads
        WHERE list_name = 'pgsql-bugs' AND is_new_thread
        GROUP BY 1
      )
      SELECT
        report_month,
        '6-month average' AS series,
        AVG(report_cnt) OVER (
          ORDER BY report_month ROWS BETWEEN 3 PRECEDING AND 2 FOLLOWING
        ) AS avg_reports
      FROM monthly
      ORDER BY 1

  weekly_reports:
    description: >
      BUG #NNNNN reports opened per COMPLETE week over the last three
      rolling months: the window starts at the first full week on or
      after (today - 3 months) and ends with the last finished week, so
      no partial week distorts the series. The week spine is generated so
      a zero-report week still plots as 0.
    source: warehouse
    sql: |
      SELECT
        gsr.wk::DATE AS report_week,
        'bug reports' AS series,
        COUNT(bro.bug_number) AS report_cnt
      FROM GENERATE_SERIES(
        DATE_TRUNC('week', CURRENT_DATE - INTERVAL 3 MONTH) + INTERVAL 7 DAY,
        DATE_TRUNC('week', CURRENT_DATE) - INTERVAL 7 DAY,
        INTERVAL 7 DAY
      ) AS gsr (wk)
      LEFT JOIN dim_bug AS bro
        ON DATE_TRUNC('week', bro.reported_dt) = gsr.wk
      GROUP BY 1
      ORDER BY 1

  weekly_trend:
    # both diagnostics are false positives here: the spine LEFT JOIN is
    # aggregated to week grain, and AVG over the weekly COUNT is exactly
    # what a rolling average is
    ignore: ["WARN-FANOUT-RISK", "WARN-REAGGREGATION"]
    description: >
      Trailing 3-week average of complete-week report volume. The
      underlying series starts two weeks before the displayed window so
      every displayed point averages three real complete weeks.
    source: warehouse
    sql: |
      WITH weekly AS (
        SELECT
          gsr.wk::DATE AS report_week,
          COUNT(bro.bug_number) AS report_cnt
        FROM GENERATE_SERIES(
          DATE_TRUNC('week', CURRENT_DATE - INTERVAL 3 MONTH) - INTERVAL 7 DAY,
          DATE_TRUNC('week', CURRENT_DATE) - INTERVAL 7 DAY,
          INTERVAL 7 DAY
        ) AS gsr (wk)
        LEFT JOIN dim_bug AS bro
          ON DATE_TRUNC('week', bro.reported_dt) = gsr.wk
        GROUP BY 1
      )

      SELECT
        report_week,
        '3-week average' AS series,
        AVG(report_cnt) OVER (
          ORDER BY report_week ROWS BETWEEN 2 PRECEDING AND CURRENT ROW
        ) AS avg_reports
      FROM weekly
      QUALIFY report_week >= (DATE_TRUNC('week', CURRENT_DATE - INTERVAL 3 MONTH) + INTERVAL 7 DAY)::DATE
      ORDER BY 1

  monthly_acted_data:
    description: >
      Per month: reports fixed (count, the bars), the acted-upon share and its
      3-month trailing average (the two right-axis lines). The two share columns
      are emitted as FRACTIONS (0-1), not percentage points, so the chart's
      per-layer axis_y.label.format ".1%" renders them as real percentages on the
      right axis AND in the tooltip (d3's % type multiplies by 100). Wide (one row
      per month) so a hover shows all three at once. Trailing months sag because
      their fixes haven't landed yet.
    source: warehouse
    sql: |
      SELECT
        report_month_dt AS report_month,
        acted_upon_cnt AS "reports fixed",
        acted_upon_pct / 100.0 AS "acted upon (%)",
        AVG(acted_upon_pct / 100.0) OVER (
          ORDER BY report_month_dt ROWS BETWEEN 2 PRECEDING AND CURRENT ROW
        ) AS "3-month rolling average"
      FROM fct_bug_reports_monthly_agg
      ORDER BY 1

  seasonality_counts:
    description: >
      Distinct backpatched fixes per release cycle, averaged by release quarter:
      the fixed first-N-day window after the wrap vs the full cycle.
    source: warehouse
    sql: |
      WITH cyc AS (
        SELECT STRFTIME(release_dt, '%b') AS release_month, QUARTER(release_dt) AS release_quarter,
               first_window_fix_cnt, full_fix_cnt
        FROM dim_release
        WHERE cycle_start_dt IS NOT NULL AND status = 'shipped'
          AND NOT is_out_of_band AND NOT is_partial_window
      )
      SELECT release_month, release_quarter, 'first 20 days' AS series, ROUND(AVG(first_window_fix_cnt), 1) AS patches
      FROM cyc
      GROUP BY release_month, release_quarter
      UNION ALL
      SELECT release_month, release_quarter, 'full cycle' AS series, ROUND(AVG(full_fix_cnt), 1) AS patches
      FROM cyc
      GROUP BY release_month, release_quarter
      ORDER BY release_quarter, series

  seasonality_share:
    description: >
      Front-loading by release quarter: the share of a cycle's backpatched fixes
      that land in the first N days after the wrap.
    source: warehouse
    sql: |
      SELECT STRFTIME(release_dt, '%b') AS release_month, QUARTER(release_dt) AS release_quarter,
             ROUND(AVG(early_fix_share), 4) AS early_share
      FROM dim_release
      WHERE cycle_start_dt IS NOT NULL AND status = 'shipped'
        AND NOT is_out_of_band AND NOT is_partial_window
      GROUP BY release_month, release_quarter
      ORDER BY release_quarter

  yearly_outcomes:
    description: >
      Reports vs acted-upon reports per calendar year. Excludes dim_bug's
      synthetic rows (its two Kimball special members, reported_dt =
      past_eternity) via is_synthetic_row — real reports only, else the 1900
      placeholder year blows the x-axis out to a 126-year span and the real
      bars vanish.
    source: warehouse
    sql: |
      SELECT
        CAST(YEAR(reported_dt) AS VARCHAR) AS report_year,
        outcome,
        COUNT(*) AS reports
      FROM dim_bug
      WHERE NOT is_synthetic_row
      GROUP BY 1, 2
      ORDER BY 1, 2

  fix_latency:
    description: >
      Report-to-first-commit latency for acted-upon reports, using the
      mart's days_to_commit_window buckets.
    source: warehouse
    sql: |
      SELECT
        days_to_commit_window,
        'acted-upon reports' AS series,
        COUNT(*) AS reports
      FROM dim_bug
      WHERE is_acted_upon
      GROUP BY 1
      ORDER BY 1

  yearly_latency:
    description: Median days from report to first linked commit, per year.
    source: warehouse
    sql: |
      SELECT
        CAST(YEAR(reported_dt) AS VARCHAR) AS report_year,
        'median days to commit' AS series,
        MEDIAN(days_to_commit) AS median_days
      FROM dim_bug
      WHERE is_acted_upon
      GROUP BY 1
      ORDER BY 1

  thread_size:
    description: >
      How much discussion a report draws, split by outcome — acted-upon
      reports have longer threads. Real reports only (NOT is_synthetic_row):
      dim_bug's two special members have a NULL thread_size_window and a
      placeholder outcome that would otherwise show as a stray null bucket.
    source: warehouse
    sql: |
      SELECT
        thread_size_window,
        outcome,
        COUNT(*) AS reports
      FROM dim_bug
      WHERE NOT is_synthetic_row
      GROUP BY 1, 2
      ORDER BY 1, 2

  most_discussed:
    description: The 15 most-discussed bug reports in the corpus.
    source: warehouse
    sql: |
      SELECT
        reported_dt AS reported,
        thread_message_cnt AS messages,
        CASE WHEN is_acted_upon THEN 'fixed' ELSE '-' END AS outcome,
        days_to_commit AS days_to_fix,
        SUBSTR(subject, 1, 90) AS subject
      FROM dim_bug
      WHERE NOT is_synthetic_row
      -- bug_number (the tiebreak) is not in the select list, so it stays named
      ORDER BY 2 DESC, bug_number
      LIMIT 15

charts:
  monthly_reports:
    type: area
    query: monthly_reports
    title: "Bug reports per month"
    subtitle: "One new pgsql-bugs thread per report: BUG # web-form submissions stacked with free-form emails (about a third of reports); line = 6-month average of both"
    x: report_month
    y: report_cnt
    color: series
    # stacked, so the top edge is all reports and the trend line sits on the total
    style: { stack: zero }
    height: 380
    layers:
      - type: line
        query: monthly_trend
        x: report_month
        y: avg_reports
        color: series

  weekly_reports:
    type: bar
    query: weekly_reports
    title: "Bug reports per week"
    subtitle: "Complete weeks only, last three rolling months, with a trailing 3-week average"
    x: report_week
    y: report_cnt
    color: series
    height: 300
    layers:
      - type: line
        query: weekly_trend
        x: report_week
        y: avg_reports
        color: series

  monthly_acted:
    type: bar
    query: monthly_acted_data
    title: "Bug reports acted upon, by month"
    subtitle: "Bars: reports later linked to a fix (count, left axis). Lines: acted-upon share (%, right axis) with its 3-month rolling average. Lower bound (exact links only); trailing months right-censored."
    x: report_month
    y: "reports fixed"
    height: 340
    # the two % lines are distinct columns (so a hover reads both, plus the bar);
    # both share the same right axis, pinned to [0, 0.5] (the data is fractions)
    # with a per-layer axis_y.label.format ".1%" -- that scopes the percent
    # formatting to THIS axis and its tooltip entries only, leaving the left
    # count axis untouched. NOTE the key is `label` (singular) on a layer; the
    # chart-wide equivalent is `axis_y.labels.format` (plural).
    layers:
      - type: line
        x: report_month
        y: "acted upon (%)"
        axis_y:
          position: right
          title: "acted upon (%)"
          scale: { domain: [0, 0.5] }
          label: { format: ".1%" }
      - type: line
        x: report_month
        y: "3-month rolling average"
        axis_y:
          position: right
          title: "acted upon (%)"
          scale: { domain: [0, 0.5] }
          label: { format: ".1%" }
        style: { marks: { line: { stroke: { color: "#8a8a8a", dasharray: "6 5", width: 1.5 } } } }

  seasonality_counts:
    type: bar
    query: seasonality_counts
    title: "Fix submission by release quarter: first 20 days vs full cycle"
    subtitle: "Avg distinct backpatched fixes per cycle — full-cycle totals are ~flat; the early window is not"
    x: release_month
    y: patches
    color: series
    sort: { by: release_quarter, order: asc }
    style: { stack: none, orientation: vertical }
    height: 320

  seasonality_share:
    type: bar
    query: seasonality_share
    title: "Front-loading by release quarter"
    subtitle: "Share of the cycle's fixes committed in the first 20 days — Feb/May front-load, Aug/Nov back-load"
    x: release_month
    y: early_share
    sort: { by: release_quarter, order: asc }
    style: { orientation: vertical, axis_y: { labels: { format: ".1%" } } }
    height: 320

  yearly_outcomes:
    type: bar
    query: yearly_outcomes
    title: "Report outcomes per year"
    subtitle: "Roughly one in four reports ends up linked to a fix commit"
    x: report_year
    y: reports
    color: outcome
    height: 340

  fix_latency:
    type: bar
    query: fix_latency
    title: "How fast fixes land"
    subtitle: "Days from report to its first linked commit; most fixes land within a week"
    x: days_to_commit_window
    y: reports
    color: series
    height: 340

  yearly_latency:
    type: bar
    query: yearly_latency
    title: "Median report-to-fix latency per year"
    subtitle: "Acted-upon reports only"
    x: report_year
    y: median_days
    color: series
    height: 340

  thread_size:
    type: bar
    query: thread_size
    title: "Discussion volume by outcome"
    subtitle: "Reports that get fixed draw longer threads"
    x: thread_size_window
    y: reports
    color: outcome
    style: { stack: none }
    height: 340

  most_discussed:
    type: table
    query: most_discussed
    title: "Most-discussed bug reports"

rows:
  - monthly_reports
  - weekly_reports
  - monthly_acted
  - cols: [seasonality_counts, seasonality_share]
  - cols: [yearly_outcomes, yearly_latency]
  - cols: [fix_latency, thread_size]
  - most_discussed
