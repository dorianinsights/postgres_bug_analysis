# Where PostgreSQL's fixes and development discussions actually come
# from: filed pgsql-bugs reports vs pgsql-hackers threads vs work with no
# public trail (embargoed security, uningested lists, no trailer).
#
# Release bars use short "Mon YY" labels on a categorical axis with an
# explicit chronological sort key (temporal bar axes label every bar with
# wide two-line labels that collide at narrow widths). Monthly series use
# areas — bars would label all ~58 months.
title: "PostgreSQL Fix Origins"
description: >
  Source attribution for fixes and development activity: each fix and
  master-branch commit is traced through its Discussion: trailers to
  pgsql-bugs (or a Bug: # trailer), pgsql-hackers, or
  unknown/other/internal when there is no public trail. Built to ground
  projections of how bug-report volume translates into fix volume. Data
  from the transform/ dbt project (fct_fix_origins_agg -- documented and
  committed fixes per release by origin, the open release's committed-so-far
  count included -- and fct_origin_activity_monthly_agg).

queries:

  fix_origins:
    description: >
      DOCUMENTED fixes per shipped release by origin: a fix is one release-notes
      item, deduplicated across the branches it was backpatched to (fct_fixes).
      Shipped releases only -- the open release has no notes yet (its committed
      fixes are the fix_commit_origins chart below). Every release carries all
      four origins (zero-filled upstream) so the categorical sort (which SUMS
      release_seq per release) stays chronological. Out-of-band emergency
      releases excluded. committed_fix_cnt and rate ride along for the hover:
      the commits behind each bar and the share of them the notes documented.
    source: warehouse
    sql: |
      SELECT
        STRFTIME(release_dt, '%b %y') AS release,
        EPOCH(release_dt)::BIGINT AS release_seq,
        CASE origin
          WHEN 'unknown_or_internal_security' THEN 'embargoed security'
          WHEN 'unknown_or_internal_not_security' THEN 'unsourced'
          ELSE origin
        END AS origin,
        fix_cnt,
        committed_fix_cnt,
        documentation_rate AS rate
      FROM fct_fix_origins_agg
      WHERE status = 'shipped' AND NOT is_out_of_band
      ORDER BY 2, 3

  fix_commit_origins:
    description: >
      COMMITTED fixes per release by origin, the same measure for every bar: a
      fix is one distinct non-housekeeping stable-branch commit subject,
      deduplicated across the branches it was backpatched to
      (dim_commit.fix_key -> int_committed_fixes), counted in the release it
      shipped in by git tag ancestry. The open release counts the fixes landed
      since the wrap SO FAR (same rule, not yet tagged) -- right-censored, and
      with no security yet because embargoed work reaches git only on wrap day.
      Roughly twice the documented chart above: the notes fold several commits
      into one item and document only 40-60% of subjects. The ORDER BY IS the
      x-axis order: the chart carries a dashed overlay layer, and dct 0.5 drops
      an explicit `sort:` key once a chart has layers, but keeps the query's row
      order when `sort:` is omitted.
    source: warehouse
    sql: |
      SELECT
        STRFTIME(release_dt, '%b %y') || CASE WHEN status = 'open' THEN ' (so far)' ELSE '' END AS release,
        EPOCH(release_dt)::BIGINT AS release_seq,
        CASE origin
          WHEN 'unknown_or_internal_security' THEN 'embargoed security'
          WHEN 'unknown_or_internal_not_security' THEN 'unsourced'
          ELSE origin
        END AS origin,
        -- named for the y-axis title, which dct composes from the base and layer y columns
        committed_fix_cnt AS fix_commits,
        -- the open release's value again, NULL elsewhere: the dashed overlay layer's y
        CASE WHEN status = 'open' THEN committed_fix_cnt END AS so_far,
        fix_cnt AS documented_fix_cnt,
        documentation_rate AS rate
      FROM fct_fix_origins_agg
      WHERE NOT is_out_of_band
      ORDER BY 2, 3

  fix_origin_shares:
    description: >
      True per-release origin shares of the documented fixes (fractions summing
      to 1) so the percent format is honest in the axis AND the tooltip's
      value/Total rows — feeding counts through stack:normalize left the
      tooltip's raw rows percent-formatted ("2000%"). Shipped releases only,
      like fix_origins.
    source: warehouse
    sql: |
      SELECT
        STRFTIME(release_dt, '%b %y') AS release,
        EPOCH(release_dt)::BIGINT AS release_seq,
        CASE origin
          WHEN 'unknown_or_internal_security' THEN 'embargoed security'
          WHEN 'unknown_or_internal_not_security' THEN 'unsourced'
          ELSE origin
        END AS origin,
        ROUND(COALESCE(fix_share, 0), 4) AS fix_share
      FROM fct_fix_origins_agg
      WHERE status = 'shipped' AND NOT is_out_of_band
      ORDER BY 2, 3

  cited_threads:
    description: Distinct discussion threads cited by master commits, per month by source.
    source: warehouse
    sql: |
      SELECT
        month_dt,
        CASE origin
          WHEN 'unknown_or_internal_security' THEN 'embargoed security'
          WHEN 'unknown_or_internal_not_security' THEN 'unsourced'
          ELSE origin
        END AS origin,
        cited_thread_cnt
      FROM fct_origin_activity_monthly_agg
      ORDER BY 1, 2

  ai_commits:
    description: AI-flagged master commits per month by origin.
    source: warehouse
    sql: |
      SELECT
        month_dt,
        CASE origin
          WHEN 'unknown_or_internal_security' THEN 'embargoed security'
          WHEN 'unknown_or_internal_not_security' THEN 'unsourced'
          ELSE origin
        END AS origin,
        ai_commit_cnt
      FROM fct_origin_activity_monthly_agg
      WHERE month_dt >= DATE '2026-01-01'
      ORDER BY 1, 2

  monthly_traffic:
    description: >
      Monthly messages per list over the whole archive, split into all
      traffic vs the fix-linked subset (messages whose thread a commit
      eventually cites). Complete months only.
    source: warehouse
    sql: |
      WITH monthly AS (
        SELECT
          DATE_TRUNC('month', sent_dt)::DATE AS month_dt,
          list_name,
          COUNT(*) AS message_cnt,
          COUNT(*) FILTER (WHERE is_fix_linked) AS fix_linked_message_cnt
        FROM fct_messages
        GROUP BY ALL
      )
      SELECT month_dt, list_name || ' (all)' AS series, message_cnt AS messages
      FROM monthly
      WHERE month_dt < DATE_TRUNC('month', CURRENT_DATE)
      UNION ALL
      SELECT month_dt, list_name || ' (fix-linked)' AS series, fix_linked_message_cnt
      FROM monthly
      WHERE month_dt < DATE_TRUNC('month', CURRENT_DATE)
      ORDER BY 1, 2

  monthly_traffic_partial_tail:
    description: >
      The dashed "still filling" tail for monthly_traffic: two points per
      series — the last COMPLETE month and the in-progress CURRENT month
      (only a few days in, so its level is not yet comparable). Overlaid as a
      dashed segment so the current month reads as provisional, not absent or
      a traffic collapse.
    source: warehouse
    sql: |
      WITH monthly AS (
        SELECT
          DATE_TRUNC('month', sent_dt)::DATE AS month_dt,
          list_name,
          COUNT(*) AS message_cnt,
          COUNT(*) FILTER (WHERE is_fix_linked) AS fix_linked_message_cnt
        FROM fct_messages
        WHERE sent_dt >= DATE_TRUNC('month', CURRENT_DATE) - INTERVAL 1 MONTH
        GROUP BY ALL
      )
      SELECT month_dt, list_name || ' (all)' AS series, message_cnt AS messages
      FROM monthly
      UNION ALL
      SELECT month_dt, list_name || ' (fix-linked)' AS series, fix_linked_message_cnt
      FROM monthly
      ORDER BY 1, 2

  monthly_linked_share:
    description: >
      Share of each month's messages that belong to commit-cited threads.
      The sag in recent months is right-censoring, not less fix work —
      their threads haven't been cited YET. Computed by MetricFlow from the
      atomic message grain (the fix_linked_share ratio metric) -- a non-additive
      ratio, correct at whatever grain is asked, not a stored per-row value.
    source: metrics
    type: metricflow
    metrics: [fix_linked_share]
    dimensions: [message__list_name]
    time_grain: month
    where: ["metric_time__month < date_trunc('month', current_date)"]

  recent_weekly_traffic:
    description: >
      The same traffic split per week over the last three rolling months,
      complete weeks only — the near-term zoom of monthly_traffic.
    source: warehouse
    sql: |
      WITH weekly AS (
        SELECT
          DATE_TRUNC('week', sent_dt)::DATE AS week_dt,
          list_name,
          COUNT(*) AS message_cnt,
          COUNT(*) FILTER (WHERE is_fix_linked) AS fix_linked_message_cnt
        FROM fct_messages
        GROUP BY ALL
      )
      SELECT week_dt, list_name || ' (all)' AS series, message_cnt AS messages
      FROM weekly
      WHERE week_dt >= DATE_TRUNC('week', CURRENT_DATE - INTERVAL 3 MONTH) + INTERVAL 7 DAY
        AND week_dt < DATE_TRUNC('week', CURRENT_DATE)
      UNION ALL
      SELECT week_dt, list_name || ' (fix-linked)' AS series, fix_linked_message_cnt
      FROM weekly
      WHERE week_dt >= DATE_TRUNC('week', CURRENT_DATE - INTERVAL 3 MONTH) + INTERVAL 7 DAY
        AND week_dt < DATE_TRUNC('week', CURRENT_DATE)
      ORDER BY 1, 2

  recent_weekly_traffic_partial_tail:
    description: >
      The dashed "still filling" tail for recent_weekly_traffic: two points
      per series — the last COMPLETE week and the in-progress CURRENT week.
      Overlaid dashed so the current week reads as provisional.
    source: warehouse
    sql: |
      WITH weekly AS (
        SELECT
          DATE_TRUNC('week', sent_dt)::DATE AS week_dt,
          list_name,
          COUNT(*) AS message_cnt,
          COUNT(*) FILTER (WHERE is_fix_linked) AS fix_linked_message_cnt
        FROM fct_messages
        WHERE sent_dt >= DATE_TRUNC('week', CURRENT_DATE) - INTERVAL 7 DAY
        GROUP BY ALL
      )
      SELECT week_dt, list_name || ' (all)' AS series, message_cnt AS messages
      FROM weekly
      UNION ALL
      SELECT week_dt, list_name || ' (fix-linked)' AS series, fix_linked_message_cnt
      FROM weekly
      ORDER BY 1, 2

  recent_weekly_share:
    description: >
      Fix-linked share per week over the last three rolling months.
      Heavily right-censored — these threads have had little time to be
      cited by commits. Computed by MetricFlow from the atomic message grain
      (the fix_linked_share ratio metric).
    source: metrics
    type: metricflow
    metrics: [fix_linked_share]
    dimensions: [message__list_name]
    time_grain: week
    where:
      - "metric_time__week >= date_trunc('week', current_date - interval 3 month) + interval 7 day"
      - "metric_time__week < date_trunc('week', current_date)"

charts:

  fix_origin_counts:
    type: bar
    query: fix_origins
    title: "Fix origins per release"
    subtitle: "Documented fixes by source: a fix = one release-notes item, deduplicated across backpatched branches. Shipped releases only; out-of-band releases excluded"
    x: release
    y: fix_cnt
    color: origin
    sort: { by: release_seq, order: asc }
    # string x would auto-flip horizontal; these are time series, keep vertical
    style: { stack: zero, orientation: vertical }
    height: 360

  fix_commit_origins:
    type: bar
    query: fix_commit_origins
    title: "Fix commits per release"
    subtitle: "Committed fixes by source: a fix = one distinct fix-commit subject, deduplicated across backpatched branches, in the release it shipped in. Dashed bar = the next release so far (no security until wrap)"
    x: release
    y: fix_commits
    color: origin
    # NO sort: key -- with layers present dct 0.5 ignores it and falls back to
    # alphabetical; the query's ORDER BY release_seq is what orders the axis
    style: { stack: zero, orientation: vertical }
    height: 360
    # the open release's bar is the same measure, still accumulating: mark it
    # with a dashed outline -- a bar layer on the same query whose y (so_far)
    # is NULL on every shipped row, so it draws only that bar (bar charts take
    # no per-row opacity encoding)
    layers:
      - type: bar
        y: so_far
        color: origin
        style:
          marks:
            bar:
              border: { color: "#333333", width: 2, dash_array: [6, 4] }

  fix_origin_share:
    type: bar
    query: fix_origin_shares
    title: "Fix origin share per release"
    subtitle: "Same documented fixes as shares; shipped releases only, out-of-band excluded — pgsql-bugs supplies a quarter to a third"
    x: release
    y: fix_share
    color: origin
    sort: { by: release_seq, order: asc }
    style:
      orientation: vertical
      # true fractions stacked to 1.0 (NOT stack:normalize over counts,
      # which percent-formats the tooltip's raw rows)
      stack: zero
      axis_y:
        labels:
          format: ".1%"
    height: 360

  cited_threads:
    type: area
    query: cited_threads
    title: "Cited discussion threads per month, by source"
    subtitle: "Distinct threads referenced by master commits' Discussion: trailers (UTC months)"
    x: month_dt
    y: cited_thread_cnt
    color: origin
    height: 340

  ai_commits:
    type: area
    query: ai_commits
    title: "AI-flagged commits per month, by origin"
    subtitle: "Master commits crediting an AI tool; stacked, so the top edge is the monthly total"
    x: month_dt
    y: ai_commit_cnt
    color: origin
    # stacked (not the overlapping default) so the upper contour reads as
    # the total AI-flagged count per month
    style: { stack: zero }
    height: 340

  monthly_traffic:
    type: line
    query: monthly_traffic
    title: "Monthly list traffic vs fix-linked traffic"
    subtitle: "Messages per month, whole archive; fix-linked = the thread is eventually cited by a commit (recent months right-censored). Dashed tail = the current month, still filling — a partial count, not a drop"
    x: month_dt
    y: messages
    color: series
    height: 380
    # Solid line covers complete months only; this overlay draws a dashed
    # segment from the last complete month into the in-progress current month
    # so it reads as provisional rather than absent. Same series names => the
    # dashes inherit each line's color.
    layers:
      - type: line
        query: monthly_traffic_partial_tail
        x: month_dt
        y: messages
        color: series
        style:
          marks:
            line:
              stroke:
                dasharray: "5 3"

  monthly_linked_share:
    type: line
    query: monthly_linked_share
    title: "Fix-linked share of monthly traffic"
    subtitle: "Percent of each month's messages in commit-cited threads; the recent sag is right-censoring, not less fix work"
    x: metric_time__month
    y: fix_linked_share
    color: message__list_name
    style:
      axis_y:
        labels:
          format: ".1%"
    height: 340

  recent_weekly_traffic:
    type: line
    query: recent_weekly_traffic
    title: "Weekly list traffic, last three months"
    subtitle: "Near-term zoom: messages per complete week vs the fix-linked subset. Dashed tail = the current week, still filling (partial)"
    x: week_dt
    y: messages
    color: series
    height: 340
    layers:
      - type: line
        query: recent_weekly_traffic_partial_tail
        x: week_dt
        y: messages
        color: series
        style:
          marks:
            line:
              stroke:
                dasharray: "5 3"

  recent_weekly_share:
    type: line
    query: recent_weekly_share
    title: "Fix-linked share of weekly traffic, last three months"
    subtitle: "Heavily right-censored — recent threads have had little time to be cited"
    x: metric_time__week
    y: fix_linked_share
    color: message__list_name
    style:
      axis_y:
        labels:
          format: ".1%"
    height: 340

rows:
  - fix_origin_counts
  - fix_commit_origins
  - fix_origin_share
  - monthly_traffic
  - monthly_linked_share
  - recent_weekly_traffic
  - recent_weekly_share
  - cited_threads
  - ai_commits
