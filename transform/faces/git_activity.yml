title: "PostgreSQL Fix Velocity — Git Commits"
description: >
  Commit-level view of PostgreSQL's stable branches (majors 14-18) plus master,
  straight from the git history: backpatch commit volume per quarter, AI-tool-
  credited commits, and the pace of the open release cycle. IMPORTANT: every
  count here is GIT COMMITS (deduplicated by commit subject), NOT the curated,
  user-facing fixes documented in the release notes — for those see the Changelog
  and Fix Origins dashboards. Only about half of fix commits ever become a
  documented release-note item, so these numbers run roughly 2x the Changelog's
  per-release fix counts (they are also binned by calendar quarter here, not by
  release). Parsed from the postgres.git clone at build time by the transform/
  dbt project (sources.git).

queries:
  quarterly_distinct:
    description: >
      Distinct fix COMMITS on the stable branches per calendar quarter (subjects
      deduplicated across branches, so a fix backpatched across every stable
      major counts once; release plumbing excluded). A git-history count — roughly 2x
      the Changelog's documented per-release fixes, since only ~half of fix
      commits become a release-note item. The current quarter is partial.
    source: warehouse
    sql: |
      SELECT
        DATE_TRUNC('quarter', fc.commit_dt)::DATE AS quarter,
        'distinct fix commits' AS series,
        COUNT(DISTINCT LOWER(TRIM(fc.subject))) AS distinct_fix_cnt
      FROM fct_commits AS fc
      INNER JOIN dim_major AS dm ON fc.dim_major_key = dm.dim_major_key
      WHERE dm.is_released AND NOT fc.is_plumbing
      GROUP BY 1
      ORDER BY 1

  quarterly_by_branch:
    ignore: ["WARN-FANOUT-RISK"]  # fc -> dim_major is N:1 (dim_major_key is its PK); COUNT not inflated
    description: >
      Fix commits per stable branch per quarter (each branch counts its own
      backpatches; plumbing excluded).
    source: warehouse
    sql: |
      SELECT
        DATE_TRUNC('quarter', fc.commit_dt)::DATE AS quarter,
        dm.stable_branch AS branch,
        COUNT(*) AS fix_commits
      FROM fct_commits AS fc
      INNER JOIN dim_major AS dm ON fc.dim_major_key = dm.dim_major_key
      WHERE dm.is_released AND NOT fc.is_plumbing
      GROUP BY 1, 2
      ORDER BY 1, 2

  commits_per_version:
    ignore: ["WARN-FANOUT-RISK"]  # fc -> dim_version is N:1 (one version per commit); COUNTs verified to reconcile
    description: >
      Non-plumbing stable-branch fix commits binned by the exact minor release
      they shipped in, via fct_commits.dim_version_key — REL_15_STABLE commits in
      the Feb 2026 release are 15.16, and so on. Shipped releases only; a fix
      backpatched to several majors shows once under each. This is the
      release-binned counterpart of the per-quarter commit chart above.
    source: warehouse
    sql: |
      SELECT
        STRFTIME(dv.release_dt, '%b %y') AS release,
        EPOCH(dv.release_dt)::BIGINT AS release_seq,
        dm.major_label AS major,
        COUNT(*)::BIGINT AS commit_cnt
      FROM fct_commits AS fc
      INNER JOIN dim_version AS dv ON fc.dim_version_key = dv.dim_version_key
      INNER JOIN dim_major AS dm ON fc.dim_major_key = dm.dim_major_key
      WHERE NOT fc.is_plumbing AND dv.minor > 0
      GROUP BY ALL
      ORDER BY release_seq, major

  codebase_size:
    description: >
      Absolute codebase size — total source lines (.c/.h/.y/.l/.pl/.pm/.py/.sql/
      .sgml/.pgc) in each stable branch's tree, sampled WEEKLY by git grep at the
      branch HEAD (fct_branch_size_weekly). One line per major, a smooth growth
      curve. NOT summed across majors — they are parallel near-copies of the same
      tree, so size is read within a major and stepped across majors, never added.
    source: warehouse
    sql: |
      SELECT
        bsz.week_start AS week_dt,
        dm.major_label AS major,
        bsz.code_lines AS code_lines
      FROM fct_branch_size_weekly AS bsz
      INNER JOIN dim_major AS dm ON bsz.dim_major_key = dm.dim_major_key
      ORDER BY bsz.week_start

  churn_by_quarter:
    description: >
      Lines of code churned per calendar quarter on the stable branches (fix
      commits, plumbing excluded), as three series: total churn (adds +
      deletes), additions, and deletions. Backpatches count per branch (like the
      per-branch commit chart), so a fix landed on several majors contributes its
      churn once per branch. The current quarter is partial.
    source: warehouse
    sql: |
      WITH q AS (
        SELECT
          DATE_TRUNC('quarter', fc.commit_dt)::DATE AS quarter,
          SUM(fc.lines_added_sum)::BIGINT AS adds,
          SUM(fc.lines_deleted_sum)::BIGINT AS deletes
        FROM fct_commits AS fc
        INNER JOIN dim_major AS dm ON fc.dim_major_key = dm.dim_major_key
        WHERE dm.is_released AND NOT fc.is_plumbing
        GROUP BY 1
      )

      SELECT q.quarter, 'total churn (adds + deletes)' AS series, q.adds + q.deletes AS lines FROM q
      UNION ALL
      SELECT q.quarter, 'lines added' AS series, q.adds FROM q
      UNION ALL
      SELECT q.quarter, 'lines deleted' AS series, q.deletes FROM q
      ORDER BY 1, 2

  ai_credited:
    description: >
      Distinct commits whose message credits an AI tool (Claude, ChatGPT,
      Copilot, ...), per quarter, across stable branches and master.
    source: warehouse
    sql: |
      SELECT
        DATE_TRUNC('quarter', commit_dt)::DATE AS quarter,
        'AI-credited commits' AS series,
        COUNT(DISTINCT LOWER(TRIM(subject))) AS ai_credited_commits
      FROM fct_commits
      WHERE ai_credit IS NOT NULL
      GROUP BY 1
      ORDER BY 1

  ai_credit_lines:
    description: The AI-credited fix commits with their credit lines, newest first.
    source: warehouse
    sql: |
      SELECT
        MIN(commit_dt) AS commit_dt,
        subject,
        MIN(ai_credit) AS credit_line
      FROM fct_commits
      WHERE ai_credit IS NOT NULL
      GROUP BY 2
      ORDER BY 1 DESC

  cycle_pace:
    description: >
      Like-for-like release-cycle pace, in COMMITS: distinct stable-branch fix
      commits in the first N days after each scheduled wrap (N = the age of the
      open cycle) next to each closed cycle's full-cycle commit total. Binned per
      release cycle (not calendar quarter) — this full-cycle total is the
      commit-level counterpart of the Changelog's documented per-release fix count.
    source: warehouse
    sql: |
      -- compact "Aug 22" label + numeric cycle_seq for the chart's sort. dct
      -- SUMS the sort key per label, so every cycle needs the SAME row count --
      -- hence the zero 'full cycle' row for the still-open cycle (its full total
      -- isn't in yet). The long ISO "wrap" labels crammed the axis when 17
      -- cycles share a half-width chart.
      SELECT STRFTIME(cycle_start_dt, '%b %y') AS cycle, EPOCH(cycle_start_dt)::BIGINT AS cycle_seq, 'first ' || window_days || ' days' AS pace_window, early_fix_cnt AS fixes
      FROM dim_release
      WHERE cycle_start_dt IS NOT NULL
      UNION ALL
      SELECT STRFTIME(cycle_start_dt, '%b %y') AS cycle, EPOCH(cycle_start_dt)::BIGINT AS cycle_seq, 'full cycle' AS pace_window, full_fix_cnt AS fixes
      FROM dim_release
      WHERE cycle_start_dt IS NOT NULL AND status <> 'open'
      UNION ALL
      SELECT STRFTIME(cycle_start_dt, '%b %y') AS cycle, EPOCH(cycle_start_dt)::BIGINT AS cycle_seq, 'full cycle' AS pace_window, 0 AS fixes
      FROM dim_release
      WHERE status = 'open'
      ORDER BY cycle_seq, pace_window

charts:
  quarterly_distinct:
    type: bar
    query: quarterly_distinct
    title: "Distinct fix commits per quarter"
    subtitle: >
      Git commits on REL_14..18_STABLE, deduplicated by subject across branches —
      a superset of the Changelog's documented fixes (~2x); calendar quarters,
      current one partial
    x: quarter
    y: distinct_fix_cnt
    y_label: "distinct fix commits"
    color: series
    height: 380

  quarterly_by_branch:
    type: line
    query: quarterly_by_branch
    title: "Fix commits per stable branch per quarter"
    subtitle: "Each branch counts its own backpatch, so one fix landed on every stable major is one commit per branch here; newer branches carry more; every branch jumps in Q3 2026"
    x: quarter
    y: fix_commits
    y_label: "fix commits"
    color: branch
    height: 380

  commits_per_version:
    type: bar
    query: commits_per_version
    title: "Fix commits per released version"
    subtitle: "Stable-branch fix commits binned by the release they shipped in (fct_commits.dim_release_key), split by major; shipped releases only"
    x: release
    y: commit_cnt
    y_label: "fix commits"
    color: major
    sort: { by: release_seq, order: asc }
    style: { stack: zero }
    height: 380

  codebase_size:
    type: line
    query: codebase_size
    title: "Codebase size over time, by major"
    subtitle: "Total source lines per stable branch, sampled weekly (git grep at the branch HEAD); one line per major — never summed across majors (parallel copies of the same tree)"
    x: week_dt
    y: code_lines
    y_label: "source lines"
    color: major
    height: 380

  churn_by_quarter:
    type: line
    query: churn_by_quarter
    title: "Lines of code churned per quarter"
    subtitle: "Stable-branch fix commits (plumbing excluded); total churn, additions, and deletions; backpatches counted per branch; current quarter partial"
    x: quarter
    y: lines
    y_label: "lines changed"
    color: series
    height: 380

  ai_credited:
    type: bar
    query: ai_credited
    title: "Commits crediting an AI tool"
    subtitle: "Zero before 2026; accelerating since the Aug 2026 wrap"
    x: quarter
    y: ai_credited_commits
    color: series
    height: 340

  cycle_pace:
    type: bar
    query: cycle_pace
    title: "Release-cycle pace, like for like"
    subtitle: "Distinct stable-branch fix COMMITS queued in each cycle's first N days (N = the open cycle's age) vs its full-cycle total — per release cycle"
    x: cycle
    y: fixes
    y_label: "distinct fix commits"
    color: pace_window
    sort: { by: cycle_seq, order: asc }
    style: { stack: none, orientation: vertical }
    height: 340

  ai_credit_table:
    type: table
    query: ai_credit_lines
    title: "AI-credited fix commits"

rows:
  - quarterly_distinct
  - quarterly_by_branch
  - commits_per_version
  - codebase_size
  - churn_by_quarter
  - cols: [ai_credited, cycle_pace]
  - ai_credit_table
