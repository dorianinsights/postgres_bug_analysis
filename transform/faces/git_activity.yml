_schema_version: "0.6.0"  # written automatically by dct migrate
title: "PostgreSQL Fix Velocity — Git Commits"
notes: >
  Commit-level view of PostgreSQL's released majors' stable branches plus master,
  straight from the git history: backpatch commit volume per quarter, AI-tool-
  credited commits, and the pace of the open release cycle. IMPORTANT: every
  count here is GIT COMMITS (deduplicated by dim_commit.fix_key, the normalized
  subject, with housekeeping commits -- stamps, translation refreshes,
  release-notes drafting -- excluded), NOT the curated, user-facing fixes
  documented in the release notes — for those see the Changelog and Fix Origins
  dashboards. Only about half of fix commits ever become a documented
  release-note item (dim_release.documentation_rate), so these numbers run
  roughly 2x the Changelog's per-release fix counts (they are also binned by
  calendar quarter here, not by release). Parsed from the postgres.git clone at
  build time by the transform/ dbt project (sources.git).

# One file-class dropdown per line-count chart (dct variables are a single
# board-level strip, so per-chart control = one variable each). Every dropdown
# lists the file classes and defaults to the hand-written source set; add
# translation catalogs / regression fixtures on a chart to include them, remove a
# class to drop it -- each chart is independent. multiselect (not single select)
# because a chart sums several source classes at once.
variables:
  size_classes:
    input: multiselect
    label: "Codebase size — file classes"
    options:
      static: [source_c, header, sql, perl, python, grammar, docs, embedded_sql, translations, test_fixtures]
    default: [source_c, header, sql, perl, python, grammar, docs, embedded_sql]
  composition_classes:
    input: multiselect
    label: "Composition — file classes"
    options:
      static: [source_c, header, sql, perl, python, grammar, docs, embedded_sql, translations, test_fixtures]
    default: [source_c, header, sql, perl, python, grammar, docs, embedded_sql]
  stable_churn_classes:
    input: multiselect
    label: "Stable churn — file classes"
    options:
      static: [source_c, header, sql, perl, python, grammar, docs, embedded_sql, translations, test_fixtures]
    default: [source_c, header, sql, perl, python, grammar, docs, embedded_sql]
  trunk_churn_classes:
    input: multiselect
    label: "Trunk churn — file classes"
    options:
      static: [source_c, header, sql, perl, python, grammar, docs, embedded_sql, translations, test_fixtures]
    default: [source_c, header, sql, perl, python, grammar, docs, embedded_sql]

queries:
  quarterly_distinct:
    notes: >
      Distinct fix COMMITS on the stable branches per calendar quarter
      (dim_commit.fix_key deduplicates across branches, so a fix backpatched
      across every stable major counts once; housekeeping commits excluded). A
      git-history count — roughly 2x the Changelog's documented per-release
      fixes, since only ~half of fix commits become a release-note item. The
      current quarter is partial.
    source: warehouse
    sql: |
      SELECT
        DATE_TRUNC('quarter', fc.commit_dt)::DATE AS quarter,
        'distinct fix commits' AS series,
        COUNT(DISTINCT fc.fix_key) AS distinct_fix_cnt
      FROM {{ ref('dim_commit') }} AS fc
      INNER JOIN {{ ref('dim_major') }} AS dm ON fc.dim_major_key = dm.dim_major_key
      -- the backpatch stream only (branch_scope): a released major's branch also
      -- carries its own pre-GA beta work, which is development, not fixes
      WHERE dm.is_released AND fc.branch_scope = 'stable' AND NOT fc.is_housekeeping
      GROUP BY 1
      ORDER BY 1

  quarterly_by_branch:
    ignore: ["WARN-FANOUT-RISK"]  # fc -> dim_major is N:1 (dim_major_key is its PK); COUNT not inflated
    notes: >
      Fix commits per non-master branch per quarter (each branch counts its own
      backpatches; housekeeping commits excluded). Released majors' branches count
      their backpatch stream (branch_scope = stable); the in-progress major's
      branch counts its beta stabilization, so the newest line starts at its fork.
      (Every released major has its own beta period on its branch too -- drop the
      branch_scope condition to include those.)
    source: warehouse
    sql: |
      SELECT
        DATE_TRUNC('quarter', fc.commit_dt)::DATE AS quarter,
        dm.stable_branch AS branch,
        COUNT(*) AS fix_commits
      FROM {{ ref('dim_commit') }} AS fc
      INNER JOIN {{ ref('dim_major') }} AS dm ON fc.dim_major_key = dm.dim_major_key
      WHERE
        (fc.branch_scope = 'stable' OR (fc.branch_scope = 'beta' AND dm.lifecycle = 'beta'))
        AND NOT fc.is_housekeeping
      GROUP BY 1, 2
      ORDER BY 1, 2

  commits_per_version:
    ignore: ["WARN-FANOUT-RISK"]  # fc -> dim_version is N:1 (one version per commit); COUNTs verified to reconcile
    notes: >
      Stable-branch fix commits binned by the minor release they
      shipped in (via dim_commit.dim_version_key, resolved by exact git tag
      ancestry) — REL_15_STABLE commits in the Feb 2026 release are 15.16, and so
      on. Grouped by release month + major, so an out-of-band re-release folds into
      its month's scheduled bar. Shipped releases only; a fix backpatched to
      several majors shows once under each. The release-binned counterpart of the
      per-quarter commit chart above.
    source: warehouse
    sql: |
      SELECT
        STRFTIME(dv.release_dt, '%b %y') AS release,
        MIN(EPOCH(dv.release_dt))::BIGINT AS release_seq,
        dm.major_label AS major,
        COUNT(*)::BIGINT AS commit_cnt
      FROM {{ ref('dim_commit') }} AS fc
      INNER JOIN {{ ref('dim_version') }} AS dv ON fc.dim_version_key = dv.dim_version_key
      INNER JOIN {{ ref('dim_major') }} AS dm ON fc.dim_major_key = dm.dim_major_key
      WHERE dv.minor > 0 AND NOT fc.is_housekeeping
      -- by month + major: an out-of-band re-release shares its calendar month with
      -- the scheduled release (e.g. 18.2 and OOB 18.3 both "Feb 26"), so fold them
      -- into one bar rather than colliding on the (release, major) key.
      GROUP BY 1, 3
      ORDER BY release_seq, major

  codebase_size:
    notes: >
      Absolute codebase size — source lines in each stable branch's tree, sampled
      WEEKLY by git grep at the branch HEAD (fct_branch_size_weekly, summed over
      its slices). One line per major, a smooth growth curve. NOT summed across
      majors — they are parallel near-copies of the same tree, so size is read
      within a major and stepped across majors, never added. Hand-written source
      only: the generated classes (translation catalogs .po, regression fixtures
      .out) and non-code files are excluded.
    source: warehouse
    sql: |
      SELECT
        bsz.week_start AS week_dt,
        dm.major_label AS major,
        SUM(bsz.code_lines) AS code_lines
      FROM {{ ref('fct_branch_size_weekly') }} AS bsz
      INNER JOIN {{ ref('dim_major') }} AS dm ON bsz.dim_major_key = dm.dim_major_key
      -- file classes chosen by the per-chart dropdown (defaults to hand-written
      -- source; add translations / test_fixtures to include them here)
      WHERE {{ filter('bsz.file_class', size_classes) }}
      GROUP BY bsz.week_start, dm.major_label
      ORDER BY bsz.week_start

  codebase_composition:
    notes: >
      The LATEST weekly snapshot of each major's tree, broken into subsystems
      (fct_branch_size_weekly, the shared subsystem_rules taxonomy) — a stacked
      bar per major so each version's total size AND where the lines live are
      visible at once. The step up from one major to the next (e.g. PG18 -> PG19's
      ~112k lines) resolves into which areas grew: core server, tests, new contrib
      extensions, docs. Absolute lines, so taller bars are genuinely bigger trees.
    source: warehouse
    sql: |
      WITH latest AS (
        SELECT
          dim_major_key,
          MAX(week_start) AS week_start
        FROM {{ ref('fct_branch_size_weekly') }}
        GROUP BY dim_major_key
      )
      SELECT
        dm.major_label AS major,
        bsz.subsystem AS subsystem,
        SUM(bsz.code_lines) AS code_lines
      FROM {{ ref('fct_branch_size_weekly') }} AS bsz
      INNER JOIN latest AS lst
        ON bsz.dim_major_key = lst.dim_major_key AND bsz.week_start = lst.week_start
      INNER JOIN {{ ref('dim_major') }} AS dm ON bsz.dim_major_key = dm.dim_major_key
      -- file classes chosen by the per-chart dropdown (defaults to hand-written source)
      WHERE {{ filter('bsz.file_class', composition_classes) }}
      GROUP BY dm.major_label, bsz.subsystem
      ORDER BY dm.major_label, bsz.subsystem

  churn_by_quarter:
    notes: >
      Lines of code churned per calendar quarter by backpatched fixes, as three
      series: total churn (adds + deletes), additions, and deletions. ONE commit
      per fix (dim_commit.is_representative_commit: the fix's largest backpatch
      by churn, since an older branch's version can carry extra
      conflict-resolution lines), so a fix landed on five majors counts its
      churn once. Summing every backpatch instead would inflate the series with the
      corpus, not the work: the number of stable branches inside the corpus
      grew from one in 2021 to five since mid-2025 (see the backpatch-breadth
      chart below). Generated file classes (translation catalogs .po,
      regression fixtures .out) are excluded -- source churn only -- and so are
      housekeeping commits (the release-notes SGML drafts are the largest single
      churn items of a cycle and scale with the fix count, not with the work).
      The current quarter is partial.
    source: warehouse
    sql: |
      WITH q AS (
        SELECT
          DATE_TRUNC('quarter', cf.commit_dt)::DATE AS quarter,
          SUM(COALESCE(cf.lines_added, 0))::BIGINT AS adds,
          SUM(COALESCE(cf.lines_deleted, 0))::BIGINT AS deletes
        FROM {{ ref('fct_commit_files') }} AS cf
        INNER JOIN {{ ref('dim_commit') }} AS dc ON cf.dim_commit_key = dc.dim_commit_key
        -- churn in the file classes chosen by the per-chart dropdown
        -- (defaults to hand-written source).
        WHERE dc.is_representative_commit
          AND NOT dc.is_housekeeping
          AND {{ filter('cf.file_class', stable_churn_classes) }}
        GROUP BY 1
      )

      SELECT q.quarter, 'total churn (adds + deletes)' AS series, q.adds + q.deletes AS lines FROM q
      UNION ALL
      SELECT q.quarter, 'lines added' AS series, q.adds FROM q
      UNION ALL
      SELECT q.quarter, 'lines deleted' AS series, q.deletes FROM q
      ORDER BY 1, 2

  backpatch_breadth:
    notes: >
      How many stable branches each backpatched fix landed on, per quarter:
      stable-branch fix commits divided by distinct fixes (fix_key). This is
      the multiplier the per-branch charts carry. It climbs with the corpus,
      not the project -- one branch in 2021 (only REL_14 is inside the corpus
      floor), five since mid-2025 -- which is why churn is summed per fix
      above and why the per-branch charts are comparable only from Q3 2025 on.
      The current quarter is partial.
    source: warehouse
    sql: |
      SELECT
        DATE_TRUNC('quarter', fc.commit_dt)::DATE AS quarter,
        'branches per fix' AS series,
        ROUND(COUNT(*) * 1.0 / COUNT(DISTINCT fc.fix_key), 2) AS branches_per_fix
      FROM {{ ref('dim_commit') }} AS fc
      WHERE fc.branch_scope = 'stable' AND NOT fc.is_housekeeping
      GROUP BY 1
      ORDER BY 1

  trunk_churn_by_subsystem:
    notes: >
      Lines churned per quarter on the development trunk (master), split by
      subsystem (fct_commit_files aggregated on the fly, branch_scope = trunk) — where
      feature work is happening over time, per file so a cross-area commit splits
      across its areas. Master only, so no backpatch multiplication (the
      released-branch backpatch churn is the chart above). Generated file classes
      (.po, .out) are excluded -- source churn only -- as are housekeeping commits.
      The current quarter is partial.
    source: warehouse
    sql: |
      SELECT
        DATE_TRUNC('quarter', cf.commit_dt)::DATE AS quarter,
        cf.subsystem AS subsystem,
        SUM(COALESCE(cf.lines_added, 0) + COALESCE(cf.lines_deleted, 0))::BIGINT AS churn
      FROM {{ ref('fct_commit_files') }} AS cf
      INNER JOIN {{ ref('dim_commit') }} AS dc ON cf.dim_commit_key = dc.dim_commit_key
      -- churn in the file classes chosen by the per-chart dropdown
      -- (defaults to hand-written source)
      WHERE dc.branch_scope = 'trunk'
        AND NOT dc.is_housekeeping
        AND {{ filter('cf.file_class', trunk_churn_classes) }}
      GROUP BY DATE_TRUNC('quarter', cf.commit_dt), cf.subsystem
      ORDER BY quarter, cf.subsystem

  ai_involved:
    notes: >
      Distinct fix commits whose message discloses AI involvement (a vendor and
      a work role, reviewed local-LLM labels on dim_commit), per quarter, across
      stable branches and master.
    source: warehouse
    sql: |
      SELECT
        DATE_TRUNC('quarter', commit_dt)::DATE AS quarter,
        'AI-involved fix commits' AS series,
        COUNT(DISTINCT fix_key) AS fixes
      FROM {{ ref('dim_commit') }}
      WHERE has_ai_involvement AND NOT is_housekeeping
      GROUP BY 1
      ORDER BY 1

  ai_roles:
    notes: >
      The same commits split by what the AI did; a fix with two roles counts in
      both, so the stack's top edge is role-mentions, not fixes.
    source: warehouse
    sql: |
      WITH roles AS (
        SELECT commit_dt, fix_key, 'found the bug' AS role FROM {{ ref('dim_commit') }} WHERE has_ai_involvement AND ai_found
        UNION ALL
        SELECT commit_dt, fix_key, 'analyzed it' FROM {{ ref('dim_commit') }} WHERE has_ai_involvement AND ai_analyzed
        UNION ALL
        SELECT commit_dt, fix_key, 'wrote the code' FROM {{ ref('dim_commit') }} WHERE has_ai_involvement AND ai_authored
        UNION ALL
        SELECT commit_dt, fix_key, 'built a tool' FROM {{ ref('dim_commit') }} WHERE has_ai_involvement AND ai_tooling
      )
      SELECT
        DATE_TRUNC('quarter', commit_dt)::DATE AS quarter,
        role,
        COUNT(DISTINCT fix_key) AS fixes
      FROM roles
      GROUP BY 1, 2
      ORDER BY 1, 2

  ai_involved_lines:
    notes: The AI-involved fix commits with their roles, vendor and the model's evidence, newest first.
    source: warehouse
    sql: |
      SELECT
        MIN(commit_dt) AS commit_dt,
        subject,
        CONCAT_WS(' + ',
          CASE WHEN BOOL_OR(ai_found) THEN 'found' END,
          CASE WHEN BOOL_OR(ai_analyzed) THEN 'analyzed' END,
          CASE WHEN BOOL_OR(ai_authored) THEN 'authored' END,
          CASE WHEN BOOL_OR(ai_tooling) THEN 'tooling' END) AS roles,
        MIN(ai_vendor) AS vendor,
        MIN(ai_disclosure_form) AS form,
        MIN(ai_label_source) AS label_source,
        MIN(ai_rationale) AS evidence
      FROM {{ ref('dim_commit') }}
      WHERE has_ai_involvement
      GROUP BY 2
      ORDER BY 1 DESC

  cycle_pace:
    notes: >
      Like-for-like release-cycle pace, in COMMITS: distinct stable-branch fix
      commits in the first N days after each scheduled wrap (N = the age of the
      open cycle) next to each closed cycle's full-cycle commit total. Binned per
      release cycle (not calendar quarter) — this full-cycle total is the
      commit-level counterpart of the Changelog's documented per-release fix count.
    source: warehouse
    sql: |
      -- compact "Aug 22" label + numeric cycle_seq for the chart's sort. dct
      -- SUMS the sort key per label, so every cycle needs the SAME row count --
      -- hence the zero 'full cycle' row for the still-open cycle (its full total
      -- isn't in yet). The long ISO "wrap" labels crammed the axis when 17
      -- cycles share a half-width chart.
      SELECT STRFTIME(cycle_start_dt, '%b %y') AS cycle, EPOCH(cycle_start_dt)::BIGINT AS cycle_seq, 'first ' || window_days || ' days' AS pace_window, early_fix_cnt AS fixes
      FROM {{ ref('dim_release') }}
      WHERE cycle_start_dt IS NOT NULL
      UNION ALL
      SELECT STRFTIME(cycle_start_dt, '%b %y') AS cycle, EPOCH(cycle_start_dt)::BIGINT AS cycle_seq, 'full cycle' AS pace_window, full_fix_cnt AS fixes
      FROM {{ ref('dim_release') }}
      WHERE cycle_start_dt IS NOT NULL AND status <> 'open'
      UNION ALL
      SELECT STRFTIME(cycle_start_dt, '%b %y') AS cycle, EPOCH(cycle_start_dt)::BIGINT AS cycle_seq, 'full cycle' AS pace_window, 0 AS fixes
      FROM {{ ref('dim_release') }}
      WHERE status = 'open'
      ORDER BY cycle_seq, pace_window

  commits_by_hour:
    notes: >
      Distribution of commits across the hour of the UTC day (0-23), by committer
      timestamp -- when in the day commits actually land. All commits in
      dim_commit. A round-the-clock shape from a global contributor base with a
      broad afternoon-UTC peak (US morning + Europe afternoon).
    source: warehouse
    sql: |
      SELECT
        EXTRACT(year FROM commit_ts AT TIME ZONE 'UTC')::INTEGER AS year_utc,
        EXTRACT(hour FROM commit_ts AT TIME ZONE 'UTC')::INTEGER AS hour_utc,
        COUNT(*)::BIGINT AS commit_cnt
      FROM {{ ref('dim_commit') }}
      GROUP BY 1, 2
      ORDER BY 1, 2

  commit_hour_stats:
    notes: The mean and median commit time of day (UTC), as HH:MM, over all commits.
    source: warehouse
    sql: |
      WITH minutes AS (
        SELECT EXTRACT(hour FROM commit_ts AT TIME ZONE 'UTC') * 60
          + EXTRACT(minute FROM commit_ts AT TIME ZONE 'UTC') AS minute_of_day
        FROM {{ ref('dim_commit') }}
      ),

      stats AS (
        SELECT
          ROUND(AVG(minute_of_day))::BIGINT AS mean_min,
          ROUND(MEDIAN(minute_of_day))::BIGINT AS median_min
        FROM minutes
      )

      SELECT
        LPAD((mean_min // 60)::VARCHAR, 2, '0') || ':' || LPAD((mean_min % 60)::VARCHAR, 2, '0') AS mean_hhmm,
        LPAD((median_min // 60)::VARCHAR, 2, '0') || ':' || LPAD((median_min % 60)::VARCHAR, 2, '0') AS median_hhmm
      FROM stats

charts:
  quarterly_distinct:
    type: bar
    query: quarterly_distinct
    title: "Distinct fix commits per quarter"
    subtitle: >
      Git commits on the released majors' stable branches, deduplicated by
      subject across branches (housekeeping excluded) — a superset of the
      Changelog's documented fixes (~2x); calendar quarters, current one partial
    x: quarter
    y: distinct_fix_cnt
    y_label: "distinct fix commits"
    color: series
    height: 380

  quarterly_by_branch:
    type: line
    query: quarterly_by_branch
    title: "Fix commits per non-master branch per quarter"
    subtitle: "Each branch counts its own backpatches, so one fix landed on every stable major is one commit per branch here. Read each line on its own, not their sum: branches enter the corpus as majors ship, so all five are present only from Q3 2025"
    x: quarter
    y: fix_commits
    y_label: "fix commits"
    color: branch
    height: 380

  commits_per_version:
    type: bar
    query: commits_per_version
    title: "Fix commits per released version"
    subtitle: "Stable-branch fix commits (housekeeping excluded) binned by the release they shipped in, split by major; shipped releases only. Bar height grows a layer per major entering the corpus -- comparable from Nov 2025 (five majors) on"
    x: release
    y: commit_cnt
    y_label: "fix commits"
    color: major
    sort: { by: release_seq, order: asc }
    style: { stack: zero }
    height: 380

  codebase_size:
    type: line
    query: codebase_size
    title: "Codebase size over time, by major"
    subtitle: "Total source lines per stable branch, sampled weekly (git grep at the branch HEAD); one line per major — never summed across majors (parallel copies of the same tree)"
    x: week_dt
    y: code_lines
    y_label: "source lines"
    color: major
    height: 380

  codebase_composition:
    type: bar
    query: codebase_composition
    title: "Codebase composition by subsystem"
    subtitle: "Latest weekly snapshot of each major's tree, split into subsystems (subsystem_rules); the step up between majors resolves into which areas grew — core server, tests, new contrib extensions, docs"
    x: major
    y: code_lines
    y_label: "source lines"
    color: subsystem
    style: { stack: zero }
    height: 380

  churn_by_quarter:
    type: line
    query: churn_by_quarter
    title: "Lines of code churned per quarter"
    subtitle: "One backpatch per fix, its largest (housekeeping excluded); total churn, additions, and deletions -- work per fix, not per branch; current quarter partial"
    x: quarter
    y: lines
    y_label: "lines changed"
    color: series
    height: 380

  backpatch_breadth:
    type: line
    query: backpatch_breadth
    title: "Backpatch breadth per quarter"
    subtitle: "Stable-branch fix commits per distinct fix. Rises with the corpus (one branch in 2021, five since mid-2025), not the project -- the multiplier behind per-branch counts; current quarter partial"
    x: quarter
    y: branches_per_fix
    y_label: "branches per fix"
    color: series
    height: 300

  trunk_churn_by_subsystem:
    type: bar
    query: trunk_churn_by_subsystem
    title: "Trunk churn by subsystem per quarter"
    subtitle: "Lines churned on master (feature development), split by subsystem — where the work is happening; master only so no backpatch multiplication; current quarter partial"
    x: quarter
    y: churn
    y_label: "lines changed"
    color: subsystem
    style: { stack: zero }
    height: 380

  ai_involved:
    type: bar
    query: ai_involved
    title: "Fix commits disclosing AI involvement"
    subtitle: "A vendor and a work role, reviewed by hand; zero before 2026, accelerating since the Aug 2026 wrap"
    x: quarter
    y: fixes
    color: series
    height: 340

  ai_roles:
    type: bar
    query: ai_roles
    title: "What the AI did, per quarter"
    subtitle: "Role mentions per fix commit: found / analyzed / wrote the code / built a tool (a fix can carry several)"
    x: quarter
    y: fixes
    color: role
    style: { stack: zero }
    height: 340

  cycle_pace:
    type: bar
    query: cycle_pace
    title: "Release-cycle pace, like for like"
    subtitle: "Distinct stable-branch fix COMMITS queued in each cycle's first N days (N = the open cycle's age) vs its full-cycle total — per release cycle"
    x: cycle
    y: fixes
    y_label: "distinct fix commits"
    color: pace_window
    sort: { by: cycle_seq, order: asc }
    style: { stack: none, orientation: vertical }
    height: 340

  ai_involved_table:
    type: table
    query: ai_involved_lines
    title: "AI-involved fix commits"

  commits_by_hour:
    type: bar
    query: commits_by_hour
    title: "Commits by hour of day (UTC)"
    subtitle: "When commits land across the 24h UTC day (committer timestamp, all commits) — round-the-clock from a global contributor base, peaking mid/late-afternoon UTC"
    x: hour_utc
    y: commit_cnt
    x_label: "hour of day (UTC)"
    # no y_label: each facet panel repeats it rotated and wraps it; the title
    # says commits. One panel per year shares the height, so it grows with the
    # corpus (~110px per year keeps the bars and y ticks readable)
    height: 770
    multiples:
      rows: year_utc

  mean_commit_hour:
    type: kpi
    query: commit_hour_stats
    label: "Mean commit time (UTC)"
    value: mean_hhmm

  median_commit_hour:
    type: kpi
    query: commit_hour_stats
    label: "Median commit time (UTC)"
    value: median_hhmm

rows:
  - quarterly_distinct
  - quarterly_by_branch
  - commits_per_version
  - codebase_size
  - codebase_composition
  - churn_by_quarter
  - backpatch_breadth
  - trunk_churn_by_subsystem
  - cols: [ai_involved, ai_roles]
  - cycle_pace
  - ai_involved_table
  - cols: [commits_by_hour, { rows: [mean_commit_hour, median_commit_hour] }]
