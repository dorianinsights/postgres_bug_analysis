title: "PostgreSQL Fix Velocity — Git Commits"
description: >
  Commit-level view of PostgreSQL's stable branches (majors 14-18) plus master,
  straight from the git history: backpatch commit volume per quarter, AI-tool-
  credited commits, and the pace of the open release cycle. IMPORTANT: every
  count here is GIT COMMITS (deduplicated by commit subject), NOT the curated,
  user-facing fixes documented in the release notes — for those see the Changelog
  and Fix Origins dashboards. Only about half of fix commits ever become a
  documented release-note item, so these numbers run roughly 2x the Changelog's
  per-release fix counts (they are also binned by calendar quarter here, not by
  release). Parsed from the postgres.git clone at build time by the transform/
  dbt project (sources.git).

variables:
  include_translations:
    input: checkbox
    label: "Include translation catalogs (.po)"
    description: >
      Off by default: generated GNU gettext message catalogs are not
      hand-written code. On, this adds all .po churn — mostly large mechanical
      (plumbing) catalog refreshes, so it moves the total a lot.
    default: false
  include_test_fixtures:
    input: checkbox
    label: "Include regression test fixtures (.out)"
    description: "Off by default: expected-output fixtures are generated, not source."
    default: false

queries:
  quarterly_distinct:
    description: >
      Distinct fix COMMITS on the stable branches per calendar quarter (subjects
      deduplicated across branches, so a fix backpatched across every stable
      major counts once; release plumbing excluded). A git-history count — roughly 2x
      the Changelog's documented per-release fixes, since only ~half of fix
      commits become a release-note item. The current quarter is partial.
    source: warehouse
    sql: |
      SELECT
        DATE_TRUNC('quarter', fc.commit_dt)::DATE AS quarter,
        'distinct fix commits' AS series,
        COUNT(DISTINCT LOWER(TRIM(fc.subject))) AS distinct_fix_cnt
      FROM fct_commits AS fc
      INNER JOIN dim_major AS dm ON fc.dim_major_key = dm.dim_major_key
      WHERE dm.is_released AND NOT fc.is_plumbing
      GROUP BY 1
      ORDER BY 1

  quarterly_by_branch:
    ignore: ["WARN-FANOUT-RISK"]  # fc -> dim_major is N:1 (dim_major_key is its PK); COUNT not inflated
    description: >
      Fix commits per stable branch per quarter (each branch counts its own
      backpatches; plumbing excluded).
    source: warehouse
    sql: |
      SELECT
        DATE_TRUNC('quarter', fc.commit_dt)::DATE AS quarter,
        dm.stable_branch AS branch,
        COUNT(*) AS fix_commits
      FROM fct_commits AS fc
      INNER JOIN dim_major AS dm ON fc.dim_major_key = dm.dim_major_key
      WHERE dm.is_released AND NOT fc.is_plumbing
      GROUP BY 1, 2
      ORDER BY 1, 2

  commits_per_version:
    ignore: ["WARN-FANOUT-RISK"]  # fc -> dim_version is N:1 (one version per commit); COUNTs verified to reconcile
    description: >
      Non-plumbing stable-branch fix commits binned by the minor release they
      shipped in (via fct_commits.dim_version_key, resolved by exact git tag
      ancestry) — REL_15_STABLE commits in the Feb 2026 release are 15.16, and so
      on. Grouped by release month + major, so an out-of-band re-release folds into
      its month's scheduled bar. Shipped releases only; a fix backpatched to
      several majors shows once under each. The release-binned counterpart of the
      per-quarter commit chart above.
    source: warehouse
    sql: |
      SELECT
        STRFTIME(dv.release_dt, '%b %y') AS release,
        MIN(EPOCH(dv.release_dt))::BIGINT AS release_seq,
        dm.major_label AS major,
        COUNT(*)::BIGINT AS commit_cnt
      FROM fct_commits AS fc
      INNER JOIN dim_version AS dv ON fc.dim_version_key = dv.dim_version_key
      INNER JOIN dim_major AS dm ON fc.dim_major_key = dm.dim_major_key
      WHERE NOT fc.is_plumbing AND dv.minor > 0
      -- by month + major: an out-of-band re-release shares its calendar month with
      -- the scheduled release (e.g. 18.2 and OOB 18.3 both "Feb 26"), so fold them
      -- into one bar rather than colliding on the (release, major) key.
      GROUP BY 1, 3
      ORDER BY release_seq, major

  codebase_size:
    description: >
      Absolute codebase size — source lines in each stable branch's tree, sampled
      WEEKLY by git grep at the branch HEAD (fct_branch_size_weekly, summed over
      its slices). One line per major, a smooth growth curve. NOT summed across
      majors — they are parallel near-copies of the same tree, so size is read
      within a major and stepped across majors, never added. Hand-written source
      by default; the generated classes (translation catalogs .po, regression
      fixtures .out) are excluded unless their toggle is on.
    source: warehouse
    sql: |
      SELECT
        bsz.week_start AS week_dt,
        dm.major_label AS major,
        SUM(bsz.code_lines) AS code_lines
      FROM fct_branch_size_weekly AS bsz
      INNER JOIN dim_major AS dm ON bsz.dim_major_key = dm.dim_major_key
      WHERE
        bsz.file_class IN ('source_c', 'header', 'sql', 'perl', 'python', 'grammar', 'docs', 'embedded_sql')
        OR ({{ include_translations }} AND bsz.file_class = 'translations')
        OR ({{ include_test_fixtures }} AND bsz.file_class = 'test_fixtures')
      GROUP BY bsz.week_start, dm.major_label
      ORDER BY bsz.week_start

  codebase_composition:
    description: >
      The LATEST weekly snapshot of each major's tree, broken into subsystems
      (fct_branch_size_weekly, the shared subsystem_rules taxonomy) — a stacked
      bar per major so each version's total size AND where the lines live are
      visible at once. The step up from one major to the next (e.g. PG18 -> PG19's
      ~112k lines) resolves into which areas grew: core server, tests, new contrib
      extensions, docs. Absolute lines, so taller bars are genuinely bigger trees.
    source: warehouse
    sql: |
      WITH latest AS (
        SELECT
          dim_major_key,
          MAX(week_start) AS week_start
        FROM fct_branch_size_weekly
        GROUP BY dim_major_key
      )
      SELECT
        dm.major_label AS major,
        bsz.subsystem AS subsystem,
        SUM(bsz.code_lines) AS code_lines
      FROM fct_branch_size_weekly AS bsz
      INNER JOIN latest AS lst
        ON bsz.dim_major_key = lst.dim_major_key AND bsz.week_start = lst.week_start
      INNER JOIN dim_major AS dm ON bsz.dim_major_key = dm.dim_major_key
      WHERE
        bsz.file_class IN ('source_c', 'header', 'sql', 'perl', 'python', 'grammar', 'docs', 'embedded_sql')
        OR ({{ include_translations }} AND bsz.file_class = 'translations')
        OR ({{ include_test_fixtures }} AND bsz.file_class = 'test_fixtures')
      GROUP BY dm.major_label, bsz.subsystem
      ORDER BY dm.major_label, bsz.subsystem

  churn_by_quarter:
    description: >
      Lines of code churned per calendar quarter on the stable branches (fix
      commits, plumbing excluded), as three series: total churn (adds +
      deletes), additions, and deletions. Backpatches count per branch (like the
      per-branch commit chart), so a fix landed on several majors contributes its
      churn once per branch. Generated file classes (translation catalogs .po,
      regression fixtures .out) are excluded by default -- toggle them back with
      the controls above. The current quarter is partial.
    source: warehouse
    sql: |
      WITH q AS (
        SELECT
          ca.quarter_dt AS quarter,
          SUM(ca.lines_added_sum)::BIGINT AS adds,
          SUM(ca.lines_deleted_sum)::BIGINT AS deletes
        FROM fct_commit_churn_by_area_agg AS ca
        WHERE ca.branch_scope = 'stable'
          AND (
            -- default: substantive (non-plumbing) source; each toggle adds that
            -- generated class back INCLUDING its plumbing commits (translation
            -- churn is almost all plumbing, so this is what makes it show up)
            (NOT ca.is_plumbing AND ca.file_class NOT IN ('translations', 'test_fixtures'))
            OR ({{ include_translations }} AND ca.file_class = 'translations')
            OR ({{ include_test_fixtures }} AND ca.file_class = 'test_fixtures')
          )
        GROUP BY 1
      )

      SELECT q.quarter, 'total churn (adds + deletes)' AS series, q.adds + q.deletes AS lines FROM q
      UNION ALL
      SELECT q.quarter, 'lines added' AS series, q.adds FROM q
      UNION ALL
      SELECT q.quarter, 'lines deleted' AS series, q.deletes FROM q
      ORDER BY 1, 2

  trunk_churn_by_subsystem:
    description: >
      Lines churned per quarter on the development trunk (master), split by
      subsystem (fct_commit_churn_by_area_agg, branch_scope = trunk) — where
      feature work is happening over time, per file so a cross-area commit splits
      across its areas. Master only, so no backpatch multiplication (the
      released-branch backpatch churn is the chart above). Generated file classes
      (.po, .out) excluded by default — toggle them back with the controls above.
      The current quarter is partial.
    source: warehouse
    sql: |
      SELECT
        ca.quarter_dt AS quarter,
        ca.subsystem AS subsystem,
        SUM(ca.churn)::BIGINT AS churn
      FROM fct_commit_churn_by_area_agg AS ca
      WHERE ca.branch_scope = 'trunk'
        AND (
          -- default: substantive (non-plumbing) source; each toggle adds that
          -- generated class back INCLUDING its plumbing commits
          (NOT ca.is_plumbing AND ca.file_class NOT IN ('translations', 'test_fixtures'))
          OR ({{ include_translations }} AND ca.file_class = 'translations')
          OR ({{ include_test_fixtures }} AND ca.file_class = 'test_fixtures')
        )
      GROUP BY ca.quarter_dt, ca.subsystem
      ORDER BY ca.quarter_dt, ca.subsystem

  ai_credited:
    description: >
      Distinct commits whose message credits an AI tool (Claude, ChatGPT,
      Copilot, ...), per quarter, across stable branches and master.
    source: warehouse
    sql: |
      SELECT
        DATE_TRUNC('quarter', commit_dt)::DATE AS quarter,
        'AI-credited commits' AS series,
        COUNT(DISTINCT LOWER(TRIM(subject))) AS ai_credited_commits
      FROM fct_commits
      WHERE ai_credit IS NOT NULL
      GROUP BY 1
      ORDER BY 1

  ai_credit_lines:
    description: The AI-credited fix commits with their credit lines, newest first.
    source: warehouse
    sql: |
      SELECT
        MIN(commit_dt) AS commit_dt,
        subject,
        MIN(ai_credit) AS credit_line
      FROM fct_commits
      WHERE ai_credit IS NOT NULL
      GROUP BY 2
      ORDER BY 1 DESC

  cycle_pace:
    description: >
      Like-for-like release-cycle pace, in COMMITS: distinct stable-branch fix
      commits in the first N days after each scheduled wrap (N = the age of the
      open cycle) next to each closed cycle's full-cycle commit total. Binned per
      release cycle (not calendar quarter) — this full-cycle total is the
      commit-level counterpart of the Changelog's documented per-release fix count.
    source: warehouse
    sql: |
      -- compact "Aug 22" label + numeric cycle_seq for the chart's sort. dct
      -- SUMS the sort key per label, so every cycle needs the SAME row count --
      -- hence the zero 'full cycle' row for the still-open cycle (its full total
      -- isn't in yet). The long ISO "wrap" labels crammed the axis when 17
      -- cycles share a half-width chart.
      SELECT STRFTIME(cycle_start_dt, '%b %y') AS cycle, EPOCH(cycle_start_dt)::BIGINT AS cycle_seq, 'first ' || window_days || ' days' AS pace_window, early_fix_cnt AS fixes
      FROM dim_release
      WHERE cycle_start_dt IS NOT NULL
      UNION ALL
      SELECT STRFTIME(cycle_start_dt, '%b %y') AS cycle, EPOCH(cycle_start_dt)::BIGINT AS cycle_seq, 'full cycle' AS pace_window, full_fix_cnt AS fixes
      FROM dim_release
      WHERE cycle_start_dt IS NOT NULL AND status <> 'open'
      UNION ALL
      SELECT STRFTIME(cycle_start_dt, '%b %y') AS cycle, EPOCH(cycle_start_dt)::BIGINT AS cycle_seq, 'full cycle' AS pace_window, 0 AS fixes
      FROM dim_release
      WHERE status = 'open'
      ORDER BY cycle_seq, pace_window

charts:
  quarterly_distinct:
    type: bar
    query: quarterly_distinct
    title: "Distinct fix commits per quarter"
    subtitle: >
      Git commits on REL_14..18_STABLE, deduplicated by subject across branches —
      a superset of the Changelog's documented fixes (~2x); calendar quarters,
      current one partial
    x: quarter
    y: distinct_fix_cnt
    y_label: "distinct fix commits"
    color: series
    height: 380

  quarterly_by_branch:
    type: line
    query: quarterly_by_branch
    title: "Fix commits per stable branch per quarter"
    subtitle: "Each branch counts its own backpatch, so one fix landed on every stable major is one commit per branch here; newer branches carry more; every branch jumps in Q3 2026"
    x: quarter
    y: fix_commits
    y_label: "fix commits"
    color: branch
    height: 380

  commits_per_version:
    type: bar
    query: commits_per_version
    title: "Fix commits per released version"
    subtitle: "Stable-branch fix commits binned by the release they shipped in (fct_commits.dim_release_key), split by major; shipped releases only"
    x: release
    y: commit_cnt
    y_label: "fix commits"
    color: major
    sort: { by: release_seq, order: asc }
    style: { stack: zero }
    height: 380

  codebase_size:
    type: line
    query: codebase_size
    title: "Codebase size over time, by major"
    subtitle: "Total source lines per stable branch, sampled weekly (git grep at the branch HEAD); one line per major — never summed across majors (parallel copies of the same tree)"
    x: week_dt
    y: code_lines
    y_label: "source lines"
    color: major
    height: 380

  codebase_composition:
    type: bar
    query: codebase_composition
    title: "Codebase composition by subsystem"
    subtitle: "Latest weekly snapshot of each major's tree, split into subsystems (subsystem_rules); the step up between majors resolves into which areas grew — core server, tests, new contrib extensions, docs"
    x: major
    y: code_lines
    y_label: "source lines"
    color: subsystem
    style: { stack: zero }
    height: 380

  churn_by_quarter:
    type: line
    query: churn_by_quarter
    title: "Lines of code churned per quarter"
    subtitle: "Stable-branch fix commits (plumbing excluded); total churn, additions, and deletions; backpatches counted per branch; current quarter partial"
    x: quarter
    y: lines
    y_label: "lines changed"
    color: series
    height: 380

  trunk_churn_by_subsystem:
    type: bar
    query: trunk_churn_by_subsystem
    title: "Trunk churn by subsystem per quarter"
    subtitle: "Lines churned on master (feature development), split by subsystem — where the work is happening; master only so no backpatch multiplication; current quarter partial"
    x: quarter
    y: churn
    y_label: "lines changed"
    color: subsystem
    style: { stack: zero }
    height: 380

  ai_credited:
    type: bar
    query: ai_credited
    title: "Commits crediting an AI tool"
    subtitle: "Zero before 2026; accelerating since the Aug 2026 wrap"
    x: quarter
    y: ai_credited_commits
    color: series
    height: 340

  cycle_pace:
    type: bar
    query: cycle_pace
    title: "Release-cycle pace, like for like"
    subtitle: "Distinct stable-branch fix COMMITS queued in each cycle's first N days (N = the open cycle's age) vs its full-cycle total — per release cycle"
    x: cycle
    y: fixes
    y_label: "distinct fix commits"
    color: pace_window
    sort: { by: cycle_seq, order: asc }
    style: { stack: none, orientation: vertical }
    height: 340

  ai_credit_table:
    type: table
    query: ai_credit_lines
    title: "AI-credited fix commits"

rows:
  - quarterly_distinct
  - quarterly_by_branch
  - commits_per_version
  - codebase_size
  - codebase_composition
  - churn_by_quarter
  - trunk_churn_by_subsystem
  - cols: [ai_credited, cycle_pace]
  - ai_credit_table
