_schema_version: "0.6.0"  # written automatically by dct migrate
# How big and how severe each fix was, and whether that shows up in the
# outcomes — time to fix, backpatch breadth, emergency handling. Size comes
# from the representative commit's diff (files + line churn); severity from
# the CVSS v3 base score PostgreSQL publishes for each CVE. Data from the
# transform/ dbt project (fct_fixes, which joins int_fix_changes +
# int_fix_severity + the bug-report latency link).
#
# Caveat worth stating up front: security fixes are reported through the
# private security@ list and embargoed, so they almost never carry a public
# pgsql-bugs report — the severity-vs-latency view is therefore sparse by
# nature, and the load-bearing severity correlations are size and backpatch
# breadth (both fully populated for every CVE fix).
title: "PostgreSQL Fix Impact & Severity"
notes: >
  Rating past fixes by size (files touched, lines added/removed from the
  representative commit) and, for security fixes, CVE severity (CVSS v3
  base score from postgresql.org/support/security), then correlating both
  against outcomes: report-to-fix latency, backpatch breadth, and
  out-of-band emergency releases.

queries:

  headline:
    notes: Corpus-wide impact counts, including the embargo gap in CVE latency coverage.
    source: warehouse
    sql: |
      SELECT
        COUNT(*)::BIGINT AS fix_cnt,
        COUNT(*) FILTER (WHERE severity_band IS NOT null)::BIGINT AS cve_fix_cnt,
        COUNT(*) FILTER (WHERE days_to_fix_min IS NOT null)::BIGINT AS latency_cnt,
        COUNT(*) FILTER (
          WHERE severity_band IS NOT null AND days_to_fix_min IS NOT null
        )::BIGINT AS cve_latency_cnt,
        ROUND(MEDIAN(churn_sum) FILTER (WHERE severity_band IS NOT null), 0) AS cve_churn_median,
        ROUND(MEDIAN(churn_sum) FILTER (WHERE severity_band IS null), 0) AS other_churn_median
      FROM {{ ref('fct_fixes') }}

  severity_distribution:
    notes: CVE-bearing fixes by CVSS v3 severity band.
    source: warehouse
    sql: |
      SELECT
        severity_band,
        severity_band_order,
        COUNT(*)::BIGINT AS fix_cnt
      FROM {{ ref('fct_fixes') }}
      WHERE severity_band IS NOT null
      GROUP BY ALL
      ORDER BY 2

  churn_by_severity:
    notes: Median line churn (added + deleted) of the representative commit, by severity band.
    source: warehouse
    sql: |
      SELECT
        severity_band,
        severity_band_order,
        ROUND(MEDIAN(churn_sum), 0) AS churn_median,
        COUNT(*)::BIGINT AS fix_cnt
      FROM {{ ref('fct_fixes') }}
      WHERE severity_band IS NOT null AND churn_sum IS NOT null
      GROUP BY ALL
      ORDER BY 2

  breadth_by_severity:
    notes: >
      Median backpatch breadth (how many stable branches the fix landed on)
      by severity band — do more severe fixes get carried to more releases?
    source: warehouse
    sql: |
      SELECT
        severity_band,
        severity_band_order,
        ROUND(MEDIAN(branch_item_cnt), 1) AS breadth_median,
        COUNT(*)::BIGINT AS fix_cnt
      FROM {{ ref('fct_fixes') }}
      WHERE severity_band IS NOT null
      GROUP BY ALL
      ORDER BY 2

  size_vs_latency:
    notes: >
      Every bug-linked fix: change size (line churn) vs report-to-fix days,
      colored by category. The cloud is mostly non-security work — security
      fixes rarely have a public report to measure latency from.
    source: warehouse
    sql: |
      SELECT
        churn_sum,
        days_to_fix_min,
        category
      FROM {{ ref('fct_fixes') }}
      WHERE days_to_fix_min IS NOT null
        AND days_to_fix_min >= 0
        AND churn_sum IS NOT null
      ORDER BY 1

  size_latency_trend:
    ignore: ["WARN-MISSING-JOIN-PREDICATE"]  # the single-row fit is a deliberate cross join
    notes: >
      Power-law (log-log OLS) trend of report-to-fix days on fix size, as a
      fitted curve over the churn range. The fit is essentially flat
      (R^2 ~ 0.007): size explains almost none of the latency. days = churn+1
      shifts avoid log(0).
    source: warehouse
    sql: |
      WITH pts AS (
        SELECT
          churn_sum,
          LOG10(churn_sum) AS lx,
          LOG10(days_to_fix_min + 1) AS ly
        FROM {{ ref('fct_fixes') }}
        WHERE days_to_fix_min IS NOT null
          AND days_to_fix_min >= 0
          AND churn_sum IS NOT null
      ),

      fit AS (
        SELECT
          REGR_SLOPE(pts.ly, pts.lx) AS b,
          REGR_INTERCEPT(pts.ly, pts.lx) AS a
        FROM pts
      )

      SELECT DISTINCT
        pts.churn_sum AS churn_sum,
        POWER(10, fit.a + fit.b * pts.lx) - 1 AS days_trend
      FROM pts
      CROSS JOIN fit
      ORDER BY 1

  latency_by_size:
    notes: >
      Median report-to-fix latency by fix-size bucket (line churn) — does a
      bigger change take longer to land? Bug-linked fixes only.
    source: warehouse
    sql: |
      SELECT
        CASE
          WHEN churn_sum < 20 THEN 'small (<20 lines)'
          WHEN churn_sum < 100 THEN 'medium (20-99)'
          ELSE 'large (100+)'
        END AS size_bucket,
        CASE
          WHEN churn_sum < 20 THEN 0
          WHEN churn_sum < 100 THEN 1
          ELSE 2
        END AS bucket_order,
        ROUND(MEDIAN(days_to_fix_min), 1) AS days_median,
        COUNT(*)::BIGINT AS fix_cnt
      FROM {{ ref('fct_fixes') }}
      WHERE days_to_fix_min IS NOT null AND days_to_fix_min >= 0 AND churn_sum IS NOT null
      GROUP BY ALL
      ORDER BY 2

charts:

  kpi_fixes:
    type: kpi
    query: headline
    value: fix_cnt
    label: "Distinct fixes profiled"

  kpi_cve:
    type: kpi
    query: headline
    value: cve_fix_cnt
    label: "CVE-bearing fixes (with CVSS severity)"
    support:
      value: cve_latency_cnt
      label: "of them with a public bug-report latency (the rest embargoed)"

  kpi_churn:
    type: kpi
    query: headline
    value: cve_churn_median
    label: "Median line churn, CVE fixes"
    support:
      value: other_churn_median
      label: "median churn, everything else"

  kpi_latency:
    type: kpi
    query: headline
    value: latency_cnt
    label: "Fixes with a linked report-to-fix latency"

  severity_distribution:
    type: bar
    query: severity_distribution
    title: "Security fixes by CVSS v3 severity"
    subtitle: "Distinct CVE-bearing fixes per base-score band (postgresql.org/support/security)"
    x: severity_band
    y: fix_cnt
    color: severity_band
    sort: { by: severity_band_order, order: asc }
    style: { orientation: vertical }
    height: 320

  churn_by_severity:
    type: bar
    query: churn_by_severity
    title: "Fix size by severity"
    subtitle: "Median line churn (added + deleted) of the representative commit; higher-severity CVEs are not necessarily larger changes"
    x: severity_band
    y: churn_median
    color: severity_band
    sort: { by: severity_band_order, order: asc }
    style: { orientation: vertical }
    height: 320

  breadth_by_severity:
    type: bar
    query: breadth_by_severity
    title: "Backpatch breadth by severity"
    subtitle: "Median number of stable branches a fix landed on, by severity band — 'inclusion across releases'"
    x: severity_band
    y: breadth_median
    color: severity_band
    sort: { by: severity_band_order, order: asc }
    style: { orientation: vertical }
    height: 320

  size_vs_latency:
    type: scatter
    query: size_vs_latency
    title: "Fix size vs time to fix"
    subtitle: >
      Each bug-linked fix: line churn (x, log) vs report-to-fix days (y, symlog
      so same-day fixes still show). The power-law fit is nearly flat — size
      explains ~0.7% of the variance (R² = 0.007), so bigger changes don't take
      longer to land.
    x: churn_sum
    y: days_to_fix_min
    y_label: "days, report → commit"
    color: category
    height: 440
    style:
      # Both quantities are heavily right-skewed; log x + symlog y spread the
      # cluster into a readable cloud. symlog (not log) keeps the 44 same-day
      # (0-day) fixes, which a log scale would drop.
      axis_x:
        scale: { continuous: { type: log, zero: false } }
      axis_y:
        scale: { continuous: { type: symlog } }
    layers:
      - type: line
        query: size_latency_trend
        x: churn_sum
        y: days_trend
        label: "power-law fit (R² = 0.007)"
        style: { marks: { line: { stroke: { color: "#8a8a8a", dasharray: "6 5", width: 1.5 } } } }

  latency_by_size:
    type: bar
    query: latency_by_size
    title: "Time to fix by change size"
    subtitle: "Median report-to-fix latency per size bucket (bug-linked fixes) — does a bigger change take longer to land?"
    x: size_bucket
    y: days_median
    sort: { by: bucket_order, order: asc }
    style: { orientation: vertical }
    height: 320

rows:
  - cols: [kpi_fixes, kpi_cve, kpi_churn, kpi_latency]
  - severity_distribution
  - churn_by_severity
  - breadth_by_severity
  - latency_by_size
  - size_vs_latency
