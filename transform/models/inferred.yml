version: 2

sources:
  - name: inferred
    description: >
      LLM-inferred raw CSVs — neither scraped from a website nor derivable from
      the clone, produced offline by a local model (Ollama) and cached so
      `dbt build` reads a stable, committed artifact (the model is NEVER called
      during a build; re-inference is an explicit, incremental run of
      classify_fixes.py, like re-running a scraper). Currently just
      fix_categories_llm.csv: one content-category label per distinct fix,
      auditing the category_rules regex classifier. Read in place via a
      dbt-duckdb external location; numeric-free auto_type_candidates keep
      confidence a VARCHAR until stg_fix_categories_llm casts it to DECIMAL(3,2).
    meta:
      external_location: "read_csv('../data/raw/{name}.csv', header=true, auto_type_candidates=['BIGINT', 'VARCHAR'])"
    tables:
      - name: fix_categories_llm
