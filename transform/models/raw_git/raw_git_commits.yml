version: 2

models:
  - name: raw_git_commits
    description: >
      One row per commit per branch (corpus stable branches + master since
      the corpus history floor), read verbatim from the postgres.git clone
      at build time: hash, full ISO committer timestamp, author name/email
      (%an/%ae — the patch author) and committer name/email (%cn/%ce — who
      pushed it), subject, body. All strings; typing happens in
      stg_git_commits.
