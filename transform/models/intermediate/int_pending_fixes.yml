version: 2

models:
  - name: int_pending_fixes
    description: >
      Distinct fixes committed toward the next scheduled minor but not yet
      released (backpatched, non-plumbing stable-branch commits since the
      last wrap, deduped by normalized subject), each attributed to an
      origin. Grain = fix_key (normalized subject).
    columns:
      - name: fix_key
        tests: [not_null, unique]
      - name: origin
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [pgsql-bugs, pgsql-hackers, unknown_or_internal]
