version: 2

models:
  - name: int_thread_ai_labels
    description: >
      The final AI-involvement labels per mailing-list thread -- the model's
      answer (int_thread_ai_involvement) overridden by the human review seed
      (ai_involvement_reviews). has_ai_involvement = a vendor AND a work role.
      Grain = (list_name, root_message_id).
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "NOT (ai_mentioned_only AND (ai_found OR ai_analyzed OR ai_authored OR ai_tooling))"
      # the chart flag is exactly "a vendor and a work role"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "has_ai_involvement = (ai_vendor <> 'none' AND (ai_found OR ai_analyzed OR ai_authored OR ai_tooling))"
      # a reviewed row never carries a flag without a vendor (the review seed
      # guarantees it); unreviewed model noise may, and is not involvement
      - dbt_utils.expression_is_true:
          config:
            where: "ai_label_source = 'review'"
          arguments:
            expression: "(ai_vendor = 'none') = NOT (ai_found OR ai_analyzed OR ai_authored OR ai_tooling OR ai_mentioned_only)"
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [list_name, root_message_id]
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
            compare_model: ref('int_thread_ai_involvement')
    columns:
      - name: list_name
        tests: [not_null]
      - name: root_message_id
        tests: [not_null]
      - name: has_ai_involvement
        tests: [not_null]
      - name: ai_found
        tests: [not_null]
      - name: ai_analyzed
        tests: [not_null]
      - name: ai_authored
        tests: [not_null]
      - name: ai_tooling
        tests: [not_null]
      - name: ai_mentioned_only
        tests: [not_null]
      - name: ai_vendor
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [anthropic, openai, google, microsoft, other, unspecified, none]
      - name: ai_disclosure_form
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [trailer, prose, disclaimer, none]
      - name: ai_label_source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [review, model, unclassified]
