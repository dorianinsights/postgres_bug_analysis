version: 2

models:
  - name: int_fix_contributors
    description: >
      One row per (fix, contributor) credited in the fix's release-notes item,
      parsed from the trailing "(Name, Name)" list (extracted from the inline
      wave_contributors logic so the wave rollup and the fix<->contributor bridge
      share one parse). Grain = (item_ord, contributor).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [item_ord, contributor]
    columns:
      - name: item_ord
        tests: [not_null]
      - name: contributor
        tests: [not_null]
