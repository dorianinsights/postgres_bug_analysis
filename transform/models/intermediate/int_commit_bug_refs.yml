version: 2

models:
  - name: int_commit_bug_refs
    description: >
      (commit_hash, bug_number) wherever a commit message mentions a
      numbered pgsql-bugs report.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [commit_hash, bug_number]
    columns:
      - name: bug_number
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
