version: 2

models:
  - name: int_backpatch_fixes
    description: >
      One row per stable-branch, non-plumbing commit (the backpatched-fix
      stream), with commit_dt and the normalized-subject fix_key consumers dedup
      on. Grain = (branch, commit_hash). Reused by git_cycle_pace, the
      fix-projection signals, and int_pending_fixes.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [branch, commit_hash]
    columns:
      - name: commit_dt
        tests: [not_null]
      - name: fix_key
        tests: [not_null]
