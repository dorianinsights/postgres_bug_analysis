version: 2

models:
  - name: int_bug_reporters
    description: >
      The real reporter of each pgsql-bugs report, parsed from the web-form
      root body ("Logged by:" / "Email address:") rather than the generic form
      From header. Grain = bug_number. Feeds dim_bug's reporter and the person
      dimension.
    columns:
      - name: bug_number
        tests: [not_null, unique]
      - name: reporter_name
        tests: [not_null]
      - name: reported_ts
        tests: [not_null]
