version: 2

models:
  - name: int_commit_versions
    description: >
      The commit -> shipped-minor mapping (branch's major x the release window
      containing the commit day). ship_release_dt / version are NULL for master,
      out-of-band, and not-yet-shipped commits. The single source for the
      resolution: fct_commits reads it for dim_release_key/dim_version_key,
      dim_version aggregates it for each version's first/last commit. Grain =
      (branch, commit_hash).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [branch, commit_hash]
    columns:
      - name: branch
        tests: [not_null]
      - name: commit_hash
        tests: [not_null]
      - name: commit_ts
        tests: [not_null]
      - name: commit_dt
        tests: [not_null]
      - name: version
        description: The minor this commit shipped in; NULL for master / out-of-band / not-yet-shipped.
        tests:
          - relationships:
              arguments:
                to: ref('int_versions')
                field: version
