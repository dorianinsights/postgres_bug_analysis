version: 2

models:
  - name: int_git_commits
    description: >
      Commit grain with the derived analysis attributes: fix_key (the normalized
      subject -- the identity of a committed fix across its backpatches),
      is_housekeeping (stamps, translation refreshes, release-notes drafting and
      the like: commits that are not fixes), the real patch author from the
      Author: trailer, and ai_credit (first message line crediting an AI tool,
      NULL when none). Grain = (branch, commit_hash).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [branch, commit_hash]
    columns:
      - name: branch
        tests: [not_null]
      - name: commit_hash
        tests: [not_null]
      - name: commit_ts
        tests: [not_null]
      - name: subject
        tests: [not_null]
      - name: fix_key
        description: LOWER(TRIM(subject)) with internal whitespace collapsed; the single dedup key for "distinct fix commits".
        tests: [not_null]
      - name: is_housekeeping
        tests: [not_null]
      # ai_credit: NULL for the overwhelming majority; when present it is a
      # trimmed message line, at most 200 chars.
      - name: ai_credit
        tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^\S(.{0,198}\S)?$'
