version: 2

models:
  - name: int_waves
    description: One same-day release wave with its flags. Grain = wave_dt.
    columns:
      - name: wave_dt
        tests:
          - unique
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "'2017-10-01'"
                max_value: current_date
      - name: versions
        tests: [not_null]
      - name: release_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: is_out_of_band
        tests: [not_null]
      - name: is_partial_window
        tests: [not_null]
