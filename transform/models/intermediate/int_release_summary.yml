version: 2

models:
  - name: int_release_summary
    description: Release-grain rollup of the deduped fixes. Grain = release_dt.
    tests:
      # Security fixes are a subset of all fixes. (distinct_cve_cnt is NOT
      # bounded by security_fix_cnt: one item can carry several CVEs — the
      # 2025-08-14 release has 5 CVEs across 3 security items.)
      - dbt_utils.expression_is_true:
          arguments:
            expression: security_fix_cnt <= distinct_fix_cnt
    columns:
      - name: release_dt
        tests: [unique, not_null]
      - name: versions
        tests: [not_null]
      - name: release_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: distinct_fix_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: distinct_cve_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: security_fix_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: is_out_of_band
        tests:
          - not_null
      - name: is_partial_window
        tests:
          - not_null
