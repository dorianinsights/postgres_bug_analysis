version: 2

models:
  - name: int_fix_reps
    description: >
      One representative item per distinct fix — its text, CVEs, and keys, with no
      category (assigned downstream by int_fix_content_categories).
      Grain = item_ord (= its group's group_ord).
    columns:
      - name: item_ord
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_fix_groups')
                field: group_ord
      - name: release_dt
        tests: [not_null]
      - name: summary
        tests: [not_null]
      - name: full_text
        tests: [not_null]
