version: 2

models:
  - name: int_fix_reps
    description: >
      One representative item per distinct fix, with its content category and the
      orthogonal is_security_hardening / is_performance flags from the LLM
      classifier. Grain = item_ord (= its group's group_ord).
    columns:
      - name: item_ord
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_fix_groups')
                field: group_ord
      - name: release_dt
        tests: [not_null]
      - name: summary
        tests: [not_null]
      - name: full_text
        tests: [not_null]
      - name: category
        description: The fix's content category (classify_content.py); every fix must be classified.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('content_categories')
                field: category
      - name: is_security_hardening
        tests: [not_null]
      - name: is_performance
        tests: [not_null]
