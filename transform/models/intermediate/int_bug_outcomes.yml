version: 2

models:
  - name: int_bug_outcomes
    description: >
      Per-report outcome: linked to any commit (Discussion trailer or
      bug-number mention), earliest linked commit day, report-to-fix
      latency. Grain = bug_number. Recent reports are right-censored.
    tests:
      # is_acted_upon and the commit date must agree.
      - dbt_utils.expression_is_true:
          arguments:
            expression: is_acted_upon = (first_commit_dt IS NOT NULL)
      - dbt_utils.expression_is_true:
          arguments:
            expression: is_acted_upon = (linked_via IS NOT NULL)
    columns:
      - name: bug_number
        tests: [unique, not_null]
      - name: is_acted_upon
        tests:
          - not_null
      - name: linked_via
        tests:
          - accepted_values:
              arguments:
                values: [both, discussion_link, bug_ref]
