version: 2

models:
  - name: stg_list_messages
    description: >
      One archived mailing-list message, typed from the mbox-decoded raw
      layer: bare message id, TIMESTAMPTZ sent_ts from the Date header,
      author name/email split, threading headers, full text body.
      Grain = (list_name, message_id).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [list_name, message_id]
    columns:
      - name: list_name
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [pgsql-bugs, pgsql-hackers]
      - name: message_id
        tests: [not_null]
      - name: sent_ts
        description: >
          The sender's own Date header — client clocks can be skewed, so
          the accepted range is a loose sanity bound, not the archive
          window.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "'2000-01-01'"
                max_value: current_date + 2
      - name: sent_dt
        description: >
          sent_ts truncated to its UTC calendar day — the day-grain grouping key
          consumers use in place of re-truncating the instant. Conforms to
          dim_date: if the relationships test fails, the archive has outgrown the
          fixed calendar spine (or a skewed client Date header landed outside it)
          — widen date_spine_start / date_spine_end in vars.yml and rebuild.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: subject
        description: >
          NULL for the rare message sent with no Subject header (2 in the
          corpus) — sender-controlled, so not tested not_null.
      - name: body_text
        description: >
          NULL for the rare message with no text part (1 in the corpus) —
          sender-controlled, so not tested not_null.
