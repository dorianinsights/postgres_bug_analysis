version: 2

models:
  - name: stg_major_development
    description: >
      Typed per-major feature-development activity by git tag ancestry (from
      raw_major_development). One row per major (released or in-progress) at/above
      the corpus floor. Grain = major.
    columns:
      - name: major
        tests: [not_null, unique]
      - name: dev_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["released", "beta"]
      - name: dev_commit_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
