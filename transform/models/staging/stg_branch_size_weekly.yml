version: 2

models:
  - name: stg_branch_size_weekly
    description: >
      Typed weekly codebase-size snapshots per stable branch, split by subsystem
      (from raw_branch_size_weekly). code_lines / file_cnt are this subsystem's
      slice of the tree at the week's end; the subsystems of a week sum to the
      branch's total size. A per-branch stock, never summed across majors.
      Grain = (branch, week_start, subsystem).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [branch, week_start, subsystem]
    columns:
      - name: branch
        tests: [not_null]
      - name: week_start
        tests: [not_null]
      - name: commit_hash
        tests: [not_null]
      - name: subsystem
        tests: [not_null]
      - name: code_lines
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: file_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
