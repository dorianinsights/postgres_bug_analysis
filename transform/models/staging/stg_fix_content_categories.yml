version: 2

models:
  - name: stg_fix_content_categories
    description: >
      Typed view over data/raw/fix_content_categories.csv (classify_content.py):
      one content-taxonomy label per distinct fix, with orthogonal
      is_security_hardening / is_performance flags. Grain = item_ord.
    columns:
      - name: item_ord
        tests: [not_null, unique]
      - name: category_content
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('content_categories')
                field: category
      - name: confidence
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: is_security_hardening
        tests: [not_null]
      - name: is_performance
        tests: [not_null]
