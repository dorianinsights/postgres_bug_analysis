version: 2

models:
  - name: stg_git_tags
    description: >
      One minor-release tag (wrap moment). Grain = tag. Raw carries every
      REL_1x_* ref; staging filters out BETA/RC prereleases and derives
      major/minor from the tag name.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [major, minor]
    columns:
      - name: tag
        tests:
          - unique
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^REL_\d+_\d+$'
      - name: major
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "{{ var('test_floor_major') }}"
      - name: minor
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: tag_ts
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "{{ var('test_floor_git_ts') }}"
                max_value: current_date + 2
      - name: tag_dt
        description: tag_ts (the wrap moment) truncated to its UTC calendar day.
        tests: [not_null]
