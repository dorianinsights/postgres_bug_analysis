version: 2

models:
  - name: stg_git_commits
    description: One commit per branch since the corpus history floor.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [branch, commit_hash]
    columns:
      - name: branch
        tests:
          - not_null
          # Only modern branch names here (the scraper reads corpus branches
          # + master), unlike the SGML annotations.
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^(master|REL_\d+_STABLE)$'
      - name: commit_hash
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^[0-9a-f]{40}$'
      - name: commit_ts
        tests:
          - not_null
          # Floor: earliest GIT_HISTORY_SINCE the corpus allows (FIRST_MAJOR
          # >= 10 -> 2016-10-01). Ceiling: committer-local dates can sit up
          # to a calendar day ahead of us, hence the +2 slop.
          - dbt_utils.accepted_range:
              arguments:
                min_value: "{{ var('test_floor_git_ts') }}"
                max_value: current_date + 2
      - name: commit_dt
        description: >
          commit_ts truncated to its UTC calendar day — the day-grain grouping key
          consumers use in place of re-truncating the instant. Conforms to
          dim_date: if the relationships test fails, the git history has outgrown
          the fixed calendar spine — widen date_spine_start / date_spine_end in
          vars.yml and rebuild.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: author_name
        description: The patch author's display name (git %an).
        tests: [not_null]
      - name: author_email
        description: The patch author's email (git %ae) — the person-dim key basis.
        tests: [not_null]
      - name: committer_name
        description: Who pushed the commit (git %cn) — often a core committer, not the author.
        tests: [not_null]
      - name: committer_email
        description: The committer's email (git %ce).
        tests: [not_null]
      - name: subject
        tests: [not_null]
      # body is NULL when the commit message has no body — no not_null
      # test. The derived flags live in int_git_commits.
