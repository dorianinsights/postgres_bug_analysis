version: 2

models:
  - name: dim_bug
    description: >
      Bug-report dimension -> ../data/derived/dim_bug.csv: one row per numbered
      pgsql-bugs report, folding in the outcome/latency/window classification the
      retired bug_report_outcomes mart used to compute, with the reporter
      resolved into dim_person and the report day into dim_date. Grain = dim_bug_key.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: (days_to_commit_window IS NOT NULL) = is_acted_upon
    columns:
      - name: dim_bug_key
        tests: [not_null, unique]
      - name: bug_number
        tests: [not_null, unique]
      - name: reporter_dim_person_key
        description: The real reporter (parsed from the form body), resolved into dim_person.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_person')
                field: dim_person_key
          # an unresolved reporter falls back to dim_person's Unknown member (a
          # data-quality flag); the Unknown bug row is itself exempt
          - not_unknown_member:
              config:
                where: "bug_number NOT IN (-1, -2)"
      - name: reported_dt
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: first_commit_dt
        description: The report's first linked fix-commit day; NULL when never fixed.
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: is_acted_upon
        tests: [not_null]
      - name: outcome
        tests:
          - not_null
          # the two special members carry placeholder outcomes
          - accepted_values:
              config:
                where: "bug_number NOT IN (-1, -2)"
              arguments:
                values: [linked to a fix commit, no linked commit]
      - name: thread_size_window
        tests:
          # NULL for the two special members
          - not_null:
              config:
                where: "bug_number NOT IN (-1, -2)"
          - relationships:
              arguments:
                to: ref('thread_size_windows')
                field: label
      - name: days_to_commit_window
        description: NULL when the report was never linked to a commit.
        tests:
          - relationships:
              arguments:
                to: ref('latency_windows')
                field: label
      - name: earliest_ship_release_dt
        description: >
          First scheduled minor whose wrap falls strictly after reported_dt —
          the earliest release this report's fix could ship in.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: is_synthetic_row
        description: >
          True for the two Kimball special members (Unknown / Not Applicable),
          false for every real numbered report. The reliable flag for excluding
          the synthetic rows from analytics (replaces bug_number-sign tests).
        tests: [not_null]
