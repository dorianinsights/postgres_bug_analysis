version: 2

models:
  - name: release_item_counts
    description: >
      Release-grain mart (one row per minor/major release) pairing the git-tag
      announced date with the SGML changelog item count -- what the retired raw
      releases.csv carried, now a validated warehouse table the changelog faces
      read. release_dt comes from int_releases (tags), item_cnt from the parsed
      SGML items. Grain = version. -> ../data/derived/release_item_counts.csv
    columns:
      - name: version
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('int_releases')
                field: version
      - name: major
        tests: [not_null]
      - name: minor
        tests: [not_null]
      - name: release_dt
        tests: [not_null]
      - name: item_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
