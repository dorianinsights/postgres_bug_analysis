version: 2

models:
  - name: git_commits_enriched
    description: >
      Commit-grain export for the faces -> ../data/derived/
      git_commits_enriched.csv: UTC-day commit_dt plus the derived
      is_plumbing / ai_credit flags. The message body stays in raw/staging.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [branch, commit_hash]
    columns:
      - name: commit_dt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "'2016-10-01'"
                max_value: current_date + 2
      - name: subject
        tests: [not_null]
      - name: is_plumbing
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
