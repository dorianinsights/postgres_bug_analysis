version: 2

models:
  - name: dim_date
    description: >
      Calendar dimension -> ../data/derived/dim_date.csv: one row per day across
      a fixed span (var date_spine_start .. date_spine_end), generated by
      dbt_date.get_base_dates, plus two sentinel rows just outside the spine --
      past_eternity (1900-01-01) and future_eternity (9999-01-01) -- so an
      unknown / not-applicable date reference can point at a real row instead of
      NULL. Facts store the calendar DATE and join on date_day; there is no
      separate integer date key. Grain = date_day.
    columns:
      - name: date_day
        tests:
          - not_null
          - unique
          # the range applies to the real calendar only; the two eternity
          # sentinels are deliberately outside it
          - dbt_utils.accepted_range:
              config:
                where: "date_day NOT IN (DATE '{{ var('past_eternity') }}', DATE '{{ var('future_eternity') }}')"
              arguments:
                min_value: "{{ var('test_floor_release_dt') }}"
                # the spine runs to the fixed date_spine_end, not a window around
                # today (quoted: the var is a bare date for get_base_dates)
                max_value: "'{{ var('date_spine_end') }}'"
      - name: is_weekday
        tests: [not_null]
