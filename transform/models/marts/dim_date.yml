version: 2

models:
  - name: dim_date
    description: >
      Calendar dimension -> ../data/derived/dim_date.csv: one row per day across
      a fixed span (var date_spine_start .. date_spine_end), generated by
      dbt_date.get_base_dates. Facts store the calendar DATE and join on
      date_day; there is no separate integer date key. Grain = date_day.
    columns:
      - name: date_day
        tests:
          - not_null
          - unique
          - dbt_utils.accepted_range:
              arguments:
                min_value: "{{ var('test_floor_release_dt') }}"
                # the spine now runs to the fixed date_spine_end, not a window
                # around today (quoted: the var is a bare date for get_base_dates)
                max_value: "'{{ var('date_spine_end') }}'"
      - name: is_weekday
        tests: [not_null]
