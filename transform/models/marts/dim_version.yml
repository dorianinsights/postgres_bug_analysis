version: 2

models:
  - name: dim_version
    description: >
      Version dimension -> ../data/derived/dim_version.csv. One row per
      individual PostgreSQL release (e.g. 18.6) -- the grain below a release
      release (dim_release). Sourced from the git-tag registry (int_versions).
      Conforms to dim_release via dim_release_key (the release a minor shipped in; NULL
      for the .0 majors that ship alone) and to dim_date on its DATE columns
      (release_dt, wrap_dt). Grain = version.
    tests:
      # the two special members carry placeholder versions with no real release
      - dbt_utils.expression_is_true:
          # the special members and the forward-looking in-development version
          # (future release_dt) are exempt from the Thursday-release invariant
          config:
            where: "version NOT IN ('(unknown)', '(not applicable)') AND release_dt <= CURRENT_DATE"
          arguments:
            expression: ISODOW(release_dt) = 4
    columns:
      - name: dim_version_key
        tests: [not_null, unique]
      - name: version
        tests: [not_null, unique]
      - name: major
        tests:
          - not_null:
              config:
                where: "version NOT IN ('(unknown)', '(not applicable)')"
      - name: dim_major_key
        description: >
          FK to dim_major (this version's major line). major_label,
          stable_branch, and the support window live there now, not folded here.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_major')
                field: dim_major_key
      - name: item_cnt
        description: >
          Parsed changelog-item count for this minor, folded 1:1 onto the
          dimension (the retired fct_version_items_agg was a one-measure fact at
          this exact grain — like dim_release's cycle signals). NULL for the .0
          majors and special members, which have no release-note items.
        tests:
          - dbt_utils.accepted_range:
              config:
                where: "minor > 0"
              arguments:
                min_value: 1
      - name: is_out_of_band
        description: >
          True when this version's release is an out-of-band emergency
          re-release, inherited 1:1 from dim_release (NOT re-derived per version
          from item_cnt, which is wrong -- OOB is a release-group property).
          false for the .0 majors and the special members.
        tests: [not_null]
      - name: first_commit_dt
        description: >
          UTC day of the earliest commit that went into this version. For a minor:
          the earliest stable-branch commit that shipped in it (int_commit_versions,
          OOB re-releases included). For a .0 major: the earliest commit of the
          major's whole feature development (fct_major_development, git tag
          ancestry). NULL only for the special members.
        tests:
          - not_null:
              config:
                where: "minor > 0"
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: first_commit_ts
        description: Full instant of that first commit (TIMESTAMPTZ); non-NULL exactly when first_commit_dt is.
        tests:
          - not_null:
              config:
                where: "minor > 0"
      - name: first_commit_hash
        description: SHA of that first commit; non-NULL exactly when first_commit_dt is.
        tests:
          - not_null:
              config:
                where: "minor > 0"
      - name: last_commit_dt
        description: UTC day of the latest stable-branch commit that shipped in this minor; non-NULL for every shipped minor.
        tests:
          - not_null:
              config:
                where: "minor > 0"
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: last_commit_ts
        description: Full instant of that last commit (TIMESTAMPTZ); non-NULL exactly when last_commit_dt is.
        tests:
          - not_null:
              config:
                where: "minor > 0"
      - name: last_commit_hash
        description: SHA of that last commit; non-NULL exactly when last_commit_dt is.
        tests:
          - not_null:
              config:
                where: "minor > 0"
      - name: minor
        tests:
          - not_null:
              config:
                where: "version NOT IN ('(unknown)', '(not applicable)')"
      - name: is_major_release
        tests: [not_null]
      - name: wrap_dt
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: release_dt
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      # dim_release's Not Applicable member for the .0 majors (they ship alone,
      # not in a minor release)
      - name: dim_release_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_release')
                field: dim_release_key
