version: 2

models:
  - name: wave_summary
    description: >
      One same-day release wave -> ../data/derived/wave_summary.csv. Distinct
      fix count (backpatched duplicates collapsed across branches), CVE
      count, security count, out-of-band + partial-window flags.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: security_fix_cnt <= distinct_fix_cnt
    columns:
      - name: wave_dt
        tests:
          - unique
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "'2017-10-01'"
                max_value: current_date
      - name: versions
        tests: [not_null]
      - name: release_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: distinct_fix_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: distinct_cve_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: security_fix_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: is_out_of_band
        tests:
          - not_null
      - name: is_partial_window
        tests:
          - not_null
