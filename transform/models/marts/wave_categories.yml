version: 2

models:
  - name: wave_categories
    description: >
      Tidy (wave, category) fix counts -> ../data/derived/wave_categories.csv.
      Only categories present in a wave are written, so fix_cnt >= 1.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [wave_dt, category]
    columns:
      - name: wave_dt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "'2017-10-01'"
                max_value: current_date
      - name: category
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('categories')
                field: category
      - name: category_order
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 9
      - name: fix_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: is_out_of_band
        tests:
          - not_null
