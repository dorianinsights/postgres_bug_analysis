version: 2

models:
  - name: wave_categories
    description: >
      Tidy (release-wave, category) fix counts -> ../data/derived/wave_categories.csv,
      aggregated from fct_fixes and conformed to dim_release via release_key.
      Only categories present in a wave are written, so fix_cnt >= 1.
      Grain = (release_key, category).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [release_key, category]
    columns:
      - name: release_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_release')
                field: release_key
      - name: release_dt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "{{ var('test_floor_release_dt') }}"
                max_value: current_date
      - name: category
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('categories')
                field: category
      - name: category_order
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 9
      - name: fix_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: is_out_of_band
        tests:
          - not_null
