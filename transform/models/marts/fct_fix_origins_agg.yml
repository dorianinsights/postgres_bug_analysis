version: 2

models:
  - name: fct_fix_origins_agg
    description: >
      Distinct fixes per release split by origin (pgsql-bugs /
      pgsql-hackers / unknown_or_internal) ->
      ../data/derived/fct_fix_origins_agg.csv. Grain = (release_dt, origin).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [release_dt, origin]
    columns:
      - name: release_dt
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: is_out_of_band
        tests: [not_null]
      - name: origin
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - pgsql-bugs
                  - pgsql-hackers
                  - unknown_or_internal_security
                  - unknown_or_internal_not_security
      - name: fix_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: fix_share
        description: The row's share of its release's fixes (fix_cnt / release total); a ratio typed DECIMAL(7,6), summing to 1 per release.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
