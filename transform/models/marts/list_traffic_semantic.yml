version: 2

# A MetricFlow semantic model over the atomic message grain (fct_messages),
# defining the same measures the materialized fct_list_traffic_{monthly,weekly}_agg
# tables carry -- but computed dynamically at ANY time grain (day/week/month/
# quarter/year) instead of being frozen into two pre-aggregated tables. The
# ratio metric fix_linked_share is computed correctly at whatever grain is
# asked (SUM(num)/SUM(denom)), which a stored per-period ratio cannot be
# re-aggregated to. Consumed by dbt-charts via `type: metricflow` queries.
semantic_models:
  - name: list_messages
    description: One archived mailing-list message; the atomic grain the traffic aggs roll up.
    model: ref('fct_messages')
    defaults:
      agg_time_dimension: sent_day
    entities:
      - name: message
        type: primary
        expr: list_name || '|' || message_id
    dimensions:
      - name: sent_day
        type: time
        expr: sent_dt
        type_params:
          time_granularity: day
      - name: list_name
        type: categorical
    measures:
      - name: message_count
        agg: count
        expr: message_id
      - name: thread_start_count
        agg: sum
        expr: "CASE WHEN is_thread_start THEN 1 ELSE 0 END"
      - name: form_report_count
        agg: sum
        expr: "CASE WHEN is_thread_start AND subject LIKE 'BUG #%' THEN 1 ELSE 0 END"
      - name: fix_linked_message_count
        agg: sum
        expr: "CASE WHEN is_fix_linked THEN 1 ELSE 0 END"
      - name: fix_linked_thread_start_count
        agg: sum
        expr: "CASE WHEN is_thread_start AND is_fix_linked THEN 1 ELSE 0 END"

metrics:
  - name: messages
    type: simple
    label: Messages
    type_params: { measure: message_count }
  - name: thread_starts
    type: simple
    label: Thread starts
    type_params: { measure: thread_start_count }
  - name: form_reports
    type: simple
    label: Form bug reports
    type_params: { measure: form_report_count }
  - name: fix_linked_messages
    type: simple
    label: Fix-linked messages
    type_params: { measure: fix_linked_message_count }
  - name: fix_linked_thread_starts
    type: simple
    label: Fix-linked thread starts
    type_params: { measure: fix_linked_thread_start_count }
  - name: fix_linked_share
    type: ratio
    label: Fix-linked share
    type_params:
      numerator: fix_linked_messages
      denominator: messages
