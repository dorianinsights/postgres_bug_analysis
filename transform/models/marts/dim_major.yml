version: 2

models:
  - name: dim_major
    description: >
      Major-line dimension -> ../data/derived/dim_major.csv. One row per
      PostgreSQL major (its stable branch / release line, e.g. PG18) -- the grain
      above a version. The single home for major-level attributes: major_label,
      stable_branch, and the ~5-year support window (ga_dt, eol_dt, is_supported).
      Conforms to dim_version, fct_commits, and fct_branch_size_weekly on
      dim_major_key. Grain = major.
    columns:
      - name: dim_major_key
        tests: [not_null, unique]
      - name: major
        tests:
          - not_null:
              config:
                where: "major_label NOT IN ('(unknown)', '(not applicable)', 'master')"
          - unique:
              config:
                where: "major_label NOT IN ('(unknown)', '(not applicable)', 'master')"
      - name: major_label
        tests: [not_null, unique]
      - name: stable_branch
        tests: [not_null]
      - name: ga_dt
        description: The major's GA day (its .0 release); past_eternity for the special members.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: eol_dt
        description: >
          End of the ~5-year support window (final minor ~Nov of 2012 + major).
          future_eternity for master (unreleased) and the special members. Not
          FK-tested against dim_date -- the newest major's EOL can fall past the
          calendar spine's end.
        tests: [not_null]
      - name: is_released
        description: >
          True for the five released majors; false for master (the development
          trunk) and the special members. The clean "released majors only"
          filter, replacing the old fct_commits.branch != 'master' string test.
        tests: [not_null]
      - name: lifecycle
        description: >
          released (a shipped major), beta (the in-progress major, branched but
          not GA), or development (master, the trunk). Distinguishes the three
          kinds of non-released line.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["released", "beta", "development", "(unknown)", "(not applicable)"]
      - name: is_supported
        description: Released AND still inside its ~5-year window (CURRENT_DATE <= eol_dt). False for master and specials.
        tests: [not_null]
