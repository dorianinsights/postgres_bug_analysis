version: 2

models:
  - name: fct_release_cycles
    description: >
      Cycle-grain fact -> ../data/derived/fct_release_cycles.csv: one row per
      started release cycle with the early-signal counts (reports/messages/fixes
      over the open cycle's age-window), the like-for-like pace (early vs full
      distinct fixes), and the shipped fix count for closed cycles. Replaces
      int_cycle_signals, git_cycle_pace and fix_projection_cycles. Grain =
      cycle_key.
    columns:
      - name: cycle_key
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_release')
                field: release_key
      - name: window_days
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: is_open_cycle
        tests: [not_null]
      - name: early_report_cnt
        tests: [not_null]
      - name: early_message_cnt
        tests: [not_null]
      - name: early_fix_cnt
        tests: [not_null]
      - name: full_fix_cnt
        tests: [not_null]
