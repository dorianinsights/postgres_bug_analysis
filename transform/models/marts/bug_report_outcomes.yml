version: 2

models:
  - name: bug_report_outcomes
    description: >
      One row per numbered pgsql-bugs report ->
      ../data/derived/bug_report_outcomes.csv: acted-upon flag + outcome
      label, link kind, first linked commit day, report-to-fix latency,
      and the shared classification windows the faces chart (labels from
      the thread_size_windows / latency_windows seeds).
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: (days_to_commit_window IS NOT NULL) = is_acted_upon
    columns:
      - name: bug_number
        tests: [unique, not_null]
      - name: reported_dt
        tests: [not_null]
      - name: is_acted_upon
        tests:
          - not_null
      - name: outcome
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [linked to a fix commit, no linked commit]
      - name: thread_size_window
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('thread_size_windows')
                field: label
      - name: earliest_ship_release_dt
        description: >
          First scheduled minor whose wrap falls strictly after
          reported_dt — the earliest release this report's fix could
          ship in.
        tests: [not_null]
      - name: days_to_commit_window
        description: NULL when the report was never linked to a commit.
        tests:
          - relationships:
              arguments:
                to: ref('latency_windows')
                field: label
