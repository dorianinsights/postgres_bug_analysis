version: 2

models:
  - name: fct_commits
    description: >
      Commit-grain fact -> ../data/derived/fct_commits.csv: FKs into dim_person
      (author + committer) and dim_date (commit day), diff-size measures, and
      origin/plumbing/AI degenerate attributes. Grain = commit_hash.
    columns:
      - name: commit_hash
        description: The commit's SHA-1 hash (40 hex chars).
        tests:
          - not_null
          - unique
      - name: author_dim_person_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_person')
                field: dim_person_key
          - not_unknown_member
      - name: committer_dim_person_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_person')
                field: dim_person_key
          - not_unknown_member
      - name: dim_release_key
        description: >
          The scheduled release this commit shipped in — the first release whose
          content-cutoff wrap falls on/after the commit date, mirroring the
          release cycles. master commits (next-major development, not backpatches)
          and any not-yet-shipped commits resolve to the Not Applicable member, so
          this FK is optional (no not_unknown_member guard).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_release')
                field: dim_release_key
      - name: dim_version_key
        description: >
          The exact minor release this commit shipped in (its release wave x its
          branch's major), resolved once in the fact so consumers no longer parse
          the major out of the branch string. Not Applicable for master and
          not-yet-shipped commits (no shipped version), so this FK is optional
          (no not_unknown_member guard).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_version')
                field: dim_version_key
      - name: dim_major_key
        description: >
          The commit's development line (dim_major) -- its branch, resolved on
          dim_major.stable_branch. master is a real member now, so every commit
          resolves to a real row (never Unknown / Not Applicable); the branch
          string is not stored separately.
        tests:
          - not_null
          - not_unknown_member
          - relationships:
              arguments:
                to: ref('dim_major')
                field: dim_major_key
      - name: commit_ts
        description: The full committer instant (TIMESTAMPTZ) — for latency and within-day ordering.
        tests: [not_null]
      - name: commit_dt
        description: The commit's UTC day as a DATE (from commit_ts; the dim_date FK and the git face's day grouping).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: origin
        tests: [not_null]
      - name: is_plumbing
        tests: [not_null]
      - name: has_ai_credit
        tests: [not_null]
      - name: dominant_subsystem
        description: >
          The area this commit mostly touched -- a weighted vote over its files
          (int_commit_files; most files, then most churn, tests/docs last), the
          same rule as a fix's dominant subsystem. 'other' for an empty commit.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - core_server
                  - client_tools
                  - extensions_contrib
                  - replication_recovery
                  - planner
                  - tests
                  - docs
                  - build_platform
                  - other
      - name: file_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: lines_added_sum
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: lines_deleted_sum
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
