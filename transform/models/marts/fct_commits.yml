version: 2

models:
  - name: fct_commits
    description: >
      Commit-grain fact -> ../data/derived/fct_commits.csv: FKs into dim_person
      (author + committer) and dim_date (commit day), diff-size measures, and
      origin/plumbing/AI degenerate attributes. Grain = (branch, commit_hash).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [branch, commit_hash]
    columns:
      - name: author_dim_person_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_person')
                field: dim_person_key
          - not_unknown_member
      - name: committer_dim_person_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_person')
                field: dim_person_key
          - not_unknown_member
      - name: commit_dt
        description: The commit's UTC day as a DATE (point-of-use day-trunc; the git face groups on it).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: origin
        tests: [not_null]
      - name: is_plumbing
        tests: [not_null]
      - name: has_ai_credit
        tests: [not_null]
      - name: file_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: lines_added_sum
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: lines_deleted_sum
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
