version: 2

models:
  - name: fix_projection_cycles
    description: >
      Every closed cycle replayed at the current cycle's age ->
      ../data/derived/fix_projection_cycles.csv: early bug reports,
      list messages, and committed distinct fixes in the first N days
      (N = the open cycle's age today) beside the wave's final shipped
      fix count. Grain = ships_at_dt.
    columns:
      - name: ships_at_dt
        tests: [unique, not_null]
      - name: shipped_fix_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: early_report_cnt
        tests: [not_null]
      - name: early_message_cnt
        tests: [not_null]
      - name: early_fix_cnt
        tests: [not_null]
