version: 2

models:
  - name: dim_release_cycle
    description: >
      Release-cycle dimension -> ../data/derived/dim_release_cycle.csv: one row
      per development cycle (wrap -> shipped release), including the open and
      near-future cycles. Grain = cycle_key (the shipping release's YYYYMMDD).
    columns:
      - name: cycle_key
        tests: [not_null, unique]
      - name: cycle_start_dt
        tests: [not_null]
      - name: ships_at_dt
        tests: [not_null]
      - name: cycle_start_date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: is_open
        tests: [not_null]
      - name: is_shipped
        tests: [not_null]
