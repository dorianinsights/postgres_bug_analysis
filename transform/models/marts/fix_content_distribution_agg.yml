version: 2

models:
  - name: fix_content_distribution_agg
    description: >
      Distribution of the redesigned content taxonomy over classified fixes: one
      row per category with its fix count, orthogonal-flag counts, and mean
      confidence. Small, diffable data/derived twin — the headline for validating
      the taxonomy (a healthy spread vs the old regex catch-all).
    columns:
      - name: category_content
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('content_categories')
                field: category
      - name: fix_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
