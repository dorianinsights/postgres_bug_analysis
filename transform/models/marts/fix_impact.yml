version: 2

models:
  - name: fix_impact
    description: >
      Impact profile per distinct fix -> ../data/derived/fix_impact.csv:
      change size (files, line churn), CVE severity (worst CVSS v3 base
      score + band), and the outcomes to correlate against — report-to-fix
      latency, backpatch breadth, out-of-band handling. Grain = one distinct
      fix (item_ord).
    columns:
      - name: item_ord
        tests: [not_null, unique]
      - name: wave_dt
        tests: [not_null]
      - name: category
        tests: [not_null]
      - name: is_out_of_band
        tests: [not_null]
      - name: branch_item_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: churn_sum
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: max_cvss_base_score
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 10
      - name: severity_band
        tests:
          - accepted_values:
              arguments:
                values: [NONE, LOW, MEDIUM, HIGH, CRITICAL]
      - name: days_to_fix_min
        description: >
          Report-to-commit days for the fix's fastest linked pgsql-bugs
          report; NULL when no report links to the fix. Can be negative in
          the rare case a commit predates the report it is later tied to
          (inherited from int_bug_outcomes).
