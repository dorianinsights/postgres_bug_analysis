version: 2

models:
  - name: origin_activity_monthly
    description: >
      Monthly master-branch activity split by origin ->
      ../data/derived/origin_activity_monthly.csv: non-plumbing commit
      count, AI-flagged commit count, and distinct cited discussion
      threads. Grain = (month_dt, origin).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [month_dt, origin]
    columns:
      - name: month_dt
        tests: [not_null]
      - name: origin
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - pgsql-bugs
                  - pgsql-hackers
                  - unknown_or_internal_security
                  - unknown_or_internal_not_security
      - name: commit_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: ai_commit_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: cited_thread_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
