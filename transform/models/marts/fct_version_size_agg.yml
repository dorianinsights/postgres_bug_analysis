version: 2

models:
  - name: fct_version_size_agg
    description: >
      Absolute codebase size (total source lines) per released minor version,
      conforming to dim_version on dim_version_key. A per-branch stock (never
      summed across majors). -> ../data/derived/fct_version_size_agg.csv
    columns:
      - name: dim_version_key
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_version')
                field: dim_version_key
      - name: code_lines
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
