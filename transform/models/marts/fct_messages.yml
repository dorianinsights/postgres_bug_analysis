version: 2

models:
  - name: fct_messages
    description: >
      Message-grain fact: FK into dim_person (sender) and dim_date (send
      day), plus thread/fix-link attributes. Factless — the measure is the
      row count. Grain = (list_name, message_id). Deliberately has NO
      data/derived CSV twin (see export_marts_csv) — one row per archived
      message is too heavy to commit; the typed table is the interface.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [list_name, message_id]
    columns:
      - name: sender_dim_person_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_person')
                field: dim_person_key
      - name: dim_bug_key
        description: >
          The corpus bug report this message belongs to (from its "BUG #NNNNN"
          subject); NULL for pgsql-hackers messages and pgsql-bugs messages
          that name no corpus bug.
        tests:
          - relationships:
              arguments:
                to: ref('dim_bug')
                field: dim_bug_key
      - name: sent_dt
        description: The message's UTC send day as a DATE (the period aggregates group on it).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: earliest_ship_release_dt
        description: The day of the next scheduled minor after this message (feeds ship_dim_release_key); NULL when none.
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: ship_dim_release_key
        description: >
          The release the thread accrues toward (from earliest_ship_release_dt);
          NULL for pre-corpus targets that have no dim_release row.
        tests:
          - relationships:
              arguments:
                to: ref('dim_release')
                field: dim_release_key
      - name: is_thread_start
        tests: [not_null]
      - name: is_fix_linked
        tests: [not_null]
