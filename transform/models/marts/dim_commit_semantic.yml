version: 2

# A MetricFlow semantic model over the commit dimension (dim_commit) -- one row
# per commit. Defines the distinct-commit count (a NON-additive measure that a
# stored per-period table cannot re-aggregate), sliceable by any commit attribute
# and, via the shared `commit` entity, joinable to fct_commit_files for churn or
# for slicing by file dimensions. Consumed by dbt-charts via `type: metricflow`.
semantic_models:
  - name: commits
    description: One git commit; the spine for commit-level counts and attributes.
    model: ref('dim_commit')
    defaults:
      agg_time_dimension: commit_day
    entities:
      - name: commit
        type: primary
        expr: dim_commit_key
    dimensions:
      - name: commit_day
        type: time
        expr: commit_dt
        type_params:
          time_granularity: day
      - name: branch_scope
        type: categorical
      - name: is_plumbing
        type: categorical
      - name: origin
        type: categorical
      - name: has_ai_credit
        type: categorical
      - name: dominant_subsystem
        type: categorical
    measures:
      - name: commit_count
        agg: count_distinct
        expr: dim_commit_key

metrics:
  - name: commits
    type: simple
    label: Commits
    type_params: { measure: commit_count }
