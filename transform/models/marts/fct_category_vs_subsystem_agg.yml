version: 2

models:
  - name: fct_category_vs_subsystem_agg
    description: >
      Agreement matrix keyword category x path-derived subsystem ->
      ../data/derived/fct_category_vs_subsystem_agg.csv, over fixes with at least
      one corpus-matched commit.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [category, dominant_subsystem]
    columns:
      - name: fix_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
