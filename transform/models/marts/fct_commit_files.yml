version: 2

models:
  - name: fct_commit_files
    description: >
      Atomic churn fact: one row per file touched by one commit -- the lowest grain
      of the git change stream. Every churn metric rolls up from here dynamically
      (by area, file type, branch scope, author, at any interval), so no metric
      needs a pre-aggregated table; the fct_commit_files_semantic MetricFlow model
      exposes the measures, joined to dim_commit on the commit entity. Conforms to
      dim_commit (dim_commit_key -- commit attributes, keys, branch_scope live
      there) and dim_date (commit_dt). subsystem and file_class
      are file-grain degenerate dimensions. Line counts are NULL for binary files.
      Too many rows for a derived CSV twin (over var(derived_csv_max_rows)); query
      it in the warehouse. Grain = (dim_commit_key, file_path).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [dim_commit_key, file_path]
    columns:
      - name: dim_commit_key
        description: FK to dim_commit -- the commit this file change belongs to.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_commit')
                field: dim_commit_key
      - name: commit_dt
        description: The commit's UTC calendar day (the fact's event date); conforms to dim_date.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: file_path
        tests: [not_null]
      - name: subsystem
        description: The file's directory-based area (subsystem_rules; 'other' when no rule matches).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - core_server
                  - client_tools
                  - extensions_contrib
                  - replication_recovery
                  - planner
                  - tests
                  - docs
                  - build_platform
                  - other
      - name: file_class
        description: The file's extension-based kind (file_class_rules; 'other' for extensionless/long-tail).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - source_c
                  - header
                  - sql
                  - perl
                  - python
                  - grammar
                  - docs
                  - embedded_sql
                  - catalog_data
                  - translations
                  - test_fixtures
                  - build
                  - other
      - name: lines_added
        description: Lines added to this file by this commit; NULL for binary files.
      - name: lines_deleted
        description: Lines deleted from this file by this commit; NULL for binary files.
