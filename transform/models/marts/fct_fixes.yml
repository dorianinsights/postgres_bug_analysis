version: 2

models:
  - name: fct_fixes
    description: >
      Fix-grain fact -> ../data/derived/fct_fixes.csv (supersedes fix_impact
      AND the retired item-grain fix_items): fix identity (summary/full_text/
      cves/category), change size, worst CVE severity, origin, bug linkage, and
      a wave_key FK into dim_release (and a version FK into dim_version). Per-CVE and per-bug detail live in
      bridge_fix_cve / bridge_fix_bug. Grain = item_ord (one distinct fix).
    columns:
      - name: item_ord
        tests: [not_null, unique]
      - name: wave_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_release')
                field: release_key
      # The representative minor of the deduped fix (the fix is backpatched
      # across a wave's branches; this is one member version) -> dim_version.
      - name: version
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_version')
                field: version
      - name: category
        tests: [not_null]
      - name: origin
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - pgsql-bugs
                  - pgsql-hackers
                  - unknown_or_internal_security
                  - unknown_or_internal_not_security
      - name: is_out_of_band
        tests: [not_null]
      - name: branch_item_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: churn_sum
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: max_cvss_base_score
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 10
      - name: bug_link_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: primary_bug_number
        description: The fastest-resolved linked bug; NULL when the fix links to no report.
        tests:
          - relationships:
              arguments:
                to: ref('dim_bug')
                field: bug_number
