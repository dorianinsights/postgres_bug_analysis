version: 2

models:
  - name: fct_fixes
    description: >
      Fix-grain fact -> ../data/derived/fct_fixes.csv (supersedes fix_impact
      AND the retired item-grain fix_items): fix identity (summary/full_text/
      cves/category), change size, worst CVE severity, origin, bug linkage, and
      a dim_release_key FK into dim_release (and a dim_version_key FK into dim_version). Per-CVE and per-bug detail live in
      bridge_fix_cve / bridge_fix_bug. Grain = item_ord (one distinct fix).
    tests:
      # the fact stays at the distinct-fix grain: exactly one row per int_fix_reps
      # row (with item_ord unique here and int_fix_reps.item_ord -> fct_fixes
      # relationships, no fix is lost or duplicated by the bug/CVE joins)
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
            compare_model: ref('int_fix_reps')
      # ... and the per-release count agrees with dim_release.distinct_fix_cnt
      # (full outer join on release_dt, so a release missing on either side fails)
      - dbt_expectations.expect_table_aggregation_to_equal_other_table:
          arguments:
            expression: count(*)
            group_by: [release_dt]
            compare_model: ref('dim_release')
            compare_expression: sum(distinct_fix_cnt)
            compare_group_by: [release_dt]
            compare_row_condition: "status = 'shipped'"
    columns:
      - name: item_ord
        tests: [not_null, unique]
      - name: dim_release_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_release')
                field: dim_release_key
          - not_unknown_member
      - name: release_dt
        description: The release's release day (denormalized from dim_release for date joins).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      # The representative minor of the deduped fix (the fix is backpatched
      # across a release's branches; this is one member version) -> dim_version.
      - name: dim_version_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_version')
                field: dim_version_key
          - not_unknown_member
      - name: category
        description: The fix's content category (int_fix_content_categories, via the content_categories taxonomy).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('content_categories')
                field: category
      - name: is_security_hardening
        description: The fix's essence is closing a security/memory-safety weakness (LLM flag); orthogonal to category and is_cve.
        tests: [not_null]
      - name: is_performance
        description: The fix is primarily a performance improvement (LLM flag); orthogonal to category.
        tests: [not_null]
      - name: origin
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - pgsql-bugs
                  - pgsql-hackers
                  - unknown_or_internal_security
                  - unknown_or_internal_not_security
      - name: is_out_of_band
        tests: [not_null]
      - name: branch_item_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: churn_sum
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: max_cvss_base_score
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 10
      - name: severity_band_order
        description: Ordinal rank of severity_band (NONE=0 … CRITICAL=4) for chart sorting; NULL for non-CVE fixes.
        tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4]
      - name: bug_link_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: primary_dim_bug_key
        description: The fastest-resolved linked bug; dim_bug's Not Applicable member when the fix links to no report.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_bug')
                field: dim_bug_key
