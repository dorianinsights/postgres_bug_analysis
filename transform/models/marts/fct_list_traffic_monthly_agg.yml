version: 2

models:
  - name: fct_list_traffic_monthly_agg
    description: >
      Monthly mailing-list activity per list ->
      ../data/derived/fct_list_traffic_monthly_agg.csv: total messages, new
      threads, BUG # form reports, and the fix-linked subset (recent
      months right-censored). Grain = (month_dt, list_name).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [month_dt, list_name]
      - dbt_utils.expression_is_true:
          arguments:
            expression: fix_linked_message_cnt <= message_cnt
      - dbt_utils.expression_is_true:
          arguments:
            expression: thread_start_cnt <= message_cnt
    columns:
      - name: month_dt
        tests: [not_null]
      - name: month_date_key
        description: First-of-month date_key conforming this aggregate on dim_date.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: list_name
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [pgsql-bugs, pgsql-hackers]
      - name: message_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
