version: 2

models:
  - name: fix_category_agreement_agg
    description: >
      The Phase-1 headline: a confusion matrix of the regex vs local-LLM content
      categories over non-CVE fixes (classify_fixes.py). Grain =
      (category_regex, category_llm); the diagonal (agrees = true) is agreement,
      off-diagonal rows are where the two disagree. Small and diffable — it earns
      a data/derived twin.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [category_regex, category_llm]
    columns:
      - name: category_regex
        tests: [not_null]
      - name: category_llm
        tests: [not_null]
      - name: fix_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
