version: 2

models:
  - name: fix_content_classification
    description: >
      Per-fix content classification (classify_content.py) beside the regex
      category it is slated to replace. Grain = item_ord (classified fixes only).
      Carries the orthogonal is_cve / is_security_hardening / is_performance flags
      and category_regex for the staged-retirement audit. Over the CSV threshold —
      query it in the warehouse; the reviewable summary is fix_content_distribution_agg.
    columns:
      - name: item_ord
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('fct_fixes')
                field: item_ord
      - name: category_content
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('content_categories')
                field: category
