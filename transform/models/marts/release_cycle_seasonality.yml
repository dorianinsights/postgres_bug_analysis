version: 2

models:
  - name: release_cycle_seasonality
    description: >
      One row per closed scheduled release cycle: distinct backpatched fixes in
      the fixed first-N-day window after the wrap (var seasonality_window_days)
      vs the full cycle, tagged by release quarter/month -- for the
      quarterly-seasonality analysis (do fixes arrive front- or back-loaded, and
      does that vary by quarter). Grain = release_dt.
    columns:
      - name: release_dt
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_release')
                field: release_dt
      - name: release_quarter
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
      - name: release_month
        tests: [not_null]
      - name: early_window_days
        tests: [not_null]
      - name: early_fix_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: full_fix_cnt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: early_fix_share
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
