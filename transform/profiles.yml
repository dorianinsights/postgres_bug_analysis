# Local profile, picked up automatically when dbt runs from this directory.
# The .duckdb file is scratch state (gitignored); the durable outputs are the
# external-materialized CSVs in ../data/.
postgres_bug_analysis:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: transform.duckdb
      threads: 4
    # Read-only target for sqlfluff's dbt templater (it only compiles/lints, it
    # never materializes). sqlfluff runs from the REPO ROOT (both the per-edit
    # hook and pre-commit), so the path is expressed relative to there -- the SAME
    # real warehouse the dev target opens from transform/. Opening read-only means
    # linting never takes a write lock, so it cannot race dbt build / dct serve or
    # create a stray root-level transform.duckdb stub. NOTE: in dbt-duckdb 1.11.0
    # the primary connection is opened read_only=False regardless of the read_only
    # field (that field only governs ATTACH), so access_mode READ_ONLY in
    # config_options -- the dict passed straight to duckdb.connect(config=...) --
    # is what actually enforces it. read_only: true is kept for intent + forward
    # compatibility.
    lint:
      type: duckdb
      path: transform/transform.duckdb
      read_only: true
      config_options:
        access_mode: READ_ONLY
      threads: 4
