version: 2

seeds:
  - name: thread_size_windows
    description: >
      Discussion-volume buckets for thread_size_window in
      bug_report_outcomes — bounds and label defined together so they
      cannot drift apart. Contiguous, non-overlapping message-count
      ranges; max_messages NULL = unbounded. The numeric label prefix
      makes a lexical sort the intended display order.
    config:
      column_types:
        label: VARCHAR
        min_messages: INTEGER
        max_messages: INTEGER
    tests:
      # the buckets tile the message-count line: inclusive integer ranges, so
      # the exclusive upper bound is max_messages + 1 and must equal the next
      # min_messages (the open-ended top bucket gets a one-message span)
      - dbt_utils.mutually_exclusive_ranges:
          arguments:
            lower_bound_column: min_messages
            upper_bound_column: "COALESCE(max_messages, min_messages) + 1"
            gaps: not_allowed
    columns:
      - name: label
        tests: [unique, not_null]
      - name: min_messages
        tests: [unique, not_null]
      - name: max_messages
        tests: [unique]
