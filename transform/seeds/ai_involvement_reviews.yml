version: 2

seeds:
  - name: ai_involvement_reviews
    description: >
      The human review of the AI-involvement classifier's output -- every text
      the model tied to an AI in any way, plus every rejected text containing
      an AI-related word (182 rows over the full scan of Sept 2026). Each row
      carries the FINAL label (the reviewer's verdict applied to the model's
      answer: ok / wrong roles / not AI / missed AI) and overrides the model in
      int_commit_ai_labels / int_thread_ai_labels. Population commit is keyed
      by fix_key, population thread by (list_name, root_message_id); the other
      key columns are blank. Hand-curated: edit only through a review pass.
    columns:
      - name: population
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [commit, thread]
      - name: ai_found
        tests: [not_null]
      - name: ai_analyzed
        tests: [not_null]
      - name: ai_authored
        tests: [not_null]
      - name: ai_tooling
        tests: [not_null]
      - name: mentioned_only
        tests: [not_null]
      - name: vendor
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [anthropic, openai, google, microsoft, other, unspecified, none]
      - name: disclosure_form
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [trailer, prose, disclaimer, none]
      - name: verdict
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ok, wrong roles, not AI, missed AI]
    tests:
      # a commit row has a fix_key and no thread key; a thread row the reverse
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(population = 'commit') = (fix_key IS NOT NULL AND list_name IS NULL AND root_message_id IS NULL)"
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [population, fix_key, list_name, root_message_id]
      # a work role or mentioned_only always names a vendor, and no AI means none
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(vendor = 'none') = NOT (ai_found OR ai_analyzed OR ai_authored OR ai_tooling OR mentioned_only)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "NOT (mentioned_only AND (ai_found OR ai_analyzed OR ai_authored OR ai_tooling))"
