name: postgres_bug_analysis
version: "1.0.0"
profile: postgres_bug_analysis

flags:
  send_anonymous_usage_stats: false

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: target
clean-targets: [target]

vars:
  # -- Analysis parameters (change these and the results MEAN something
  # different — treat edits like corpus.py changes: reviewed commits).
  # A wave is out-of-band (emergency re-release) when its largest release
  # has fewer items than this.
  scheduled_wave_min_items: 20
  # Quarterly wave cadence: where the projected next wave is placed.
  wave_cadence_days: 91
  # How many recent cycles the like-for-like pace comparison covers
  # (the open cycle plus N-1 closed comparators).
  pace_comparison_cycles: 3
  # A wave's wrap tag is the latest tag within this many days before it.
  wrap_tag_window_days: 7
  # The fixed "early cycle" window for the quarterly-seasonality view:
  # dim_release.first_window_fix_cnt (via int_release_cycles) counts distinct
  # backpatched fixes in the first N days after the wrap. FIXED on purpose so the
  # metric is stable across builds — unlike dim_release's early_fix_cnt, which
  # tracks the open cycle's moving age (used by the projection).
  seasonality_window_days: 20
  # -- Loose sanity floors shared by the date/major range tests. These are
  # deliberately NOT the corpus bounds (corpus.py owns those; a dbt copy
  # could silently drift) — just "obviously wrong data" backstops.
  test_floor_major: 10
  test_floor_release_dt: "'2017-10-01'"
  test_floor_git_ts: "'2016-10-01'"
  # -- Calendar spine bounds for dim_date. FIXED on purpose so the date
  # dimension builds without depending on any other model: the spine comes from
  # dbt_date.get_base_dates(start, end) over these literals. Unlike the
  # test_floor_* values above these are BARE dates (no embedded quotes) --
  # get_base_dates wraps them in its own cast('...'). end_date is EXCLUSIVE
  # (dbt_date's spine is [start, end)). start sits safely before the earliest
  # corpus row; end runs a couple years past the last scheduled wave.
  # assert_dim_date_covers_corpus fails the build if the corpus ever outgrows
  # this span -- widen the var and rebuild when it does.
  date_spine_start: "2021-09-01"
  date_spine_end: "2029-01-01"
  # -- Build parameter (not an analysis knob). The on-run-end audit exporter
  # (macros/export_marts_csv.sql) writes a diffable data/derived/<mart>.csv
  # only for marts with FEWER than this many rows: bigger tables blow past
  # what a human can review in a diff and bloat the repo, so their typed
  # table in the .duckdb file stays the sole interface (as fct_messages
  # already did). Raise it to re-export a larger mart; git rm the stale CSV
  # of any mart that grows past it.
  derived_csv_max_rows: 1000

# One schema per layer (generate_schema_name.sql uses these names verbatim).
models:
  postgres_bug_analysis:
    raw_git:
      # Python models reading ../.cache/postgres.git directly at build time
      # — the git side has no CSV landing layer; the clone is the raw store.
      +materialized: table
      +schema: raw
    raw_mail:
      # Python models decoding ../.cache/mbox mboxes at build time — the
      # mail side has no CSV landing layer; the mbox cache is the raw store.
      +materialized: table
      +schema: raw
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      # Typed tables — the interface the faces read (dct queries this
      # .duckdb file read-only via the `warehouse` source), and what dbt
      # tests query, so types survive end to end with no sniffing. The
      # on-run-end hook below exports each mart to ../data/derived/*.csv:
      # a write-only, line-diffable audit artifact that is committed and
      # reviewed but never read back by anything.
      +materialized: table
      +schema: marts

seeds:
  postgres_bug_analysis:
    +schema: seeds

# Export every successfully built mart to its diffable CSV twin.
on-run-end:
  - "{{ export_marts_csv(results) }}"
