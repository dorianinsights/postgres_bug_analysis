name: postgres_bug_analysis
version: "1.0.0"
profile: postgres_bug_analysis

flags:
  send_anonymous_usage_stats: false

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: target
clean-targets: [target]

# One schema per layer (generate_schema_name.sql uses these names verbatim).
models:
  postgres_bug_analysis:
    raw_git:
      # Python models reading ../.cache/postgres.git directly at build time
      # — the git side has no CSV landing layer; the clone is the raw store.
      +materialized: table
      +schema: raw
    raw_mail:
      # Python models decoding ../.cache/mbox mboxes at build time — the
      # mail side has no CSV landing layer; the mbox cache is the raw store.
      +materialized: table
      +schema: raw
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      # External models COPY their result to ../data/derived/*.csv — the same files
      # build_datasets.py used to write, so the faces' queries are unchanged.
      # csv_read_options governs the VIEW dbt registers over the written file
      # (which is what dbt tests query): restrict sniffing exactly like the
      # sources do, or "15.10" in a version column re-sniffs as DOUBLE 15.1.
      +materialized: external
      +format: csv
      +schema: marts
      +csv_read_options:
        auto_detect: true
        auto_type_candidates: ["BIGINT", "DATE", "VARCHAR"]

seeds:
  postgres_bug_analysis:
    +schema: seeds
