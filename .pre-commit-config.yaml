# Order matters and mirrors .claude/hooks/ruff-lint.sh: format first (it
# auto-fixes; pre-commit fails the commit when files are modified — re-stage
# and retry), then check (report-only; fix findings or noqa deliberately),
# then pyright (blocking).
#
# One-time setup after cloning / rebuilding the venv:
#   ./venv/bin/pre-commit install
#
# Bypass for emergencies only: git commit --no-verify

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ./venv/bin/ruff format
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: ./venv/bin/ruff check
        language: system
        types: [python]

      - id: pyright
        name: pyright
        entry: ./venv/bin/pyright
        language: system
        types: [python]

      # Unit tests for the pg_analysis package (python/tests). Runs the whole
      # suite (pass_filenames: false) whenever any Python file is staged
      # (types: [python]) — it's fast (~0.1s) and cross-module, so scoping to
      # changed files would miss regressions the edit caused elsewhere.
      - id: pytest
        name: pytest
        entry: ./venv/bin/pytest
        language: system
        types: [python]
        pass_filenames: false

      - id: sqlfluff-lint
        name: sqlfluff lint
        entry: ./venv/bin/sqlfluff lint
        language: system
        types: [sql]

      # dbt-charts board validation, scoped to charts/ so it never runs
      # on the dbt project's model schema .yml files. Triggers only when a charts/
      # board changes (files:), then validates the whole charts/ tree
      # (pass_filenames: false) so cross-board references are checked too.
      # Mirrors .claude/hooks/dct-validate.sh. Needs no database connection.
      - id: dct-validate
        name: dct validate (charts)
        entry: ./venv/bin/dct validate charts
        language: system
        pass_filenames: false
        files: ^charts/.*\.ya?ml$
