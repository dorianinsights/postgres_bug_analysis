# Order matters and mirrors .claude/hooks/ruff-lint.sh: format first (it
# auto-fixes; pre-commit fails the commit when files are modified — re-stage
# and retry), then check (report-only; fix findings or noqa deliberately),
# then pyright (blocking).
#
# One-time setup after cloning / rebuilding the venv:
#   ./venv/bin/pre-commit install
#
# Bypass for emergencies only: git commit --no-verify

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ./venv/bin/ruff format
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: ./venv/bin/ruff check
        language: system
        types: [python]

      - id: pyright
        name: pyright
        entry: ./venv/bin/pyright
        language: system
        types: [python]

      - id: sqlfluff-lint
        name: sqlfluff lint
        entry: ./venv/bin/sqlfluff lint
        language: system
        types: [sql]

      # dbt-charts board validation, scoped to faces/ so it never runs on the
      # dbt project's model schema .yml files. Triggers only when a faces board
      # changes (files:), then validates the whole faces/ tree (pass_filenames:
      # false) so cross-board references are checked too. Mirrors
      # .claude/hooks/dct-validate.sh. Needs no database connection.
      - id: dct-validate
        name: dct validate (faces)
        entry: ./venv/bin/dct validate faces
        language: system
        pass_filenames: false
        files: ^faces/.*\.ya?ml$
