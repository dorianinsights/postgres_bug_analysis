# Repo-wide project + lint / type-check config. The Python side is ONE package,
# python/pg_analysis (the fetch scripts, the corpus definition, the orchestrator,
# the backfills, and the build-time readers the dbt Python models import),
# installed EDITABLE into the venv by requirements.txt (`-e .`) so every import
# is an ordinary absolute one -- no sys.path juggling anywhere -- and the
# console scripts below land in ./venv/bin. It is a working checkout's tool,
# not a distributable: pg_analysis.paths locates the repo from its own file,
# so a non-editable install would find no caches, data, or dbt project.
# Dependencies are pinned in requirements.txt (the one lockfile), not here.
# Mirrors the property_analysis setup: ruff for format+lint and pyright for
# type checking, both enforced twice -- a post-edit hook per file
# (.claude/hooks/) and a blocking git pre-commit gate (.pre-commit-config.yaml).

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-analysis"
version = "0.1.0"
description = "PostgreSQL patch analysis: fetchers, corpus definition, and dbt build-time readers"
requires-python = ">=3.10,<3.14"
dependencies = []  # pinned in requirements.txt; install that, not this, for a working env

[project.scripts]
pg-refresh = "pg_analysis.refresh_data:main"
pg-clone = "pg_analysis.postgres_clone:main"
pg-mail-sync = "pg_analysis.mailing_list_sync:main"
pg-cve-scrape = "pg_analysis.scrape_cve_severity:main"
pg-backfill-ai = "pg_analysis.backfill_ai_involvement:main"
pg-backfill-categories = "pg_analysis.backfill_classifications:main"
pg-embed-fixes = "pg_analysis.embed_fixes:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pyright]
# Strict everywhere (repo decision 2026-08-28) — new files must pass strict.
include = ["."]
exclude = ["venv", "**/__pycache__", "**/.cache", "**/out", "**/target", "**/dbt_packages"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = "venv"
# Resolve `pg_analysis` from python/ (the editable install is what the venv's
# runtime uses; this keeps pyright independent of how setuptools wired the
# editable finder).
extraPaths = ["python"]

[tool.ruff]
target-version = "py312"
# First-party roots (import sorting + first-party classification).
src = ["python"]
extend-exclude = ["venv", "**/.cache", "**/out", "**/target", "**/dbt_packages"]
# Apply excludes even to explicitly-passed paths (the post-edit hook passes
# single files, which would otherwise bypass the exclusion).
force-exclude = true
line-length = 120

[tool.ruff.lint]
# Same rule families as property_analysis: core errors (E, W, F), import
# order (I), bugbear (B), pyupgrade (UP), simplifications (SIM), pandas (PD),
# pytest style (PT), builtin shadowing (A), pylint errors (PLE), raise
# mistakes (RSE), misc footguns (PIE), perf antipatterns (PERF),
# modernizations (FURB), implicit string concat (ISC), comprehension cleanups
# (C4), unused-noqa hygiene (RUF100), naive-datetime guards (DTZ), security
# (S), and the complexity caps C901 / PLR0915 at ruff defaults — never add a
# new noqa for the caps; split the function instead.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PD", "PT",
          "A", "PLE", "RSE", "PIE", "PERF", "FURB", "ISC", "C4", "RUF100",
          "DTZ", "S", "C901", "PLR0915"]
ignore = [
  "E501",  # line length is the formatter's job (line-length 120 above)
  "ISC001", # single-line implicit concat conflicts with the formatter
  "S603",  # subprocess calls use argv lists of known binaries (git), never
  "S607",  # shell=True and never untrusted input
]

# Tests exercise internals and use fixtures/fake secrets, so relax a few
# security/style rules that only make sense for production code.
[tool.ruff.lint.per-file-ignores]
"python/tests/**" = [
  "S101",  # asserts ARE the point in tests
  "S105",  # test fixtures use fake/hardcoded "passwords"
  "S106",
]

# Black-compatible defaults (double quotes, 4-space indent).
[tool.ruff.format]
docstring-code-format = false

[tool.pytest.ini_options]
# The tests import the installed (editable) pg_analysis package, exactly as
# the dbt Python models and the console scripts do -- no pythonpath entry.
testpaths = ["python/tests"]
addopts = "-q"
