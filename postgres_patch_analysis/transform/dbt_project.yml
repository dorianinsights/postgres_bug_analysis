name: postgres_patch_analysis
version: "1.0.0"
profile: postgres_patch_analysis

flags:
  send_anonymous_usage_stats: false

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: target
clean-targets: [target]

models:
  postgres_patch_analysis:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      # External models COPY their result to ../data/derived/*.csv — the same files
      # build_datasets.py used to write, so the faces' queries are unchanged.
      # csv_read_options governs the VIEW dbt registers over the written file
      # (which is what dbt tests query): restrict sniffing exactly like the
      # sources do, or "15.10" in a version column re-sniffs as DOUBLE 15.1.
      +materialized: external
      +format: csv
      +csv_read_options:
        auto_detect: true
        auto_type_candidates: ["BIGINT", "DATE", "VARCHAR"]
