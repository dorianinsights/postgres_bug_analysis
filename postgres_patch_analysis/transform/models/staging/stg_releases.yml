version: 2

models:
  - name: stg_releases
    description: One minor release, typed. Grain = version.
    columns:
      - name: version
        tests:
          - unique
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^\d+\.\d+$'
      - name: major
        tests:
          - not_null
          # The pipeline's version handling assumes one-part majors (PG 10+).
          - dbt_utils.accepted_range:
              arguments:
                min_value: 10
      - name: minor
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: release_dt
        tests:
          - not_null
          # Floor: PG 10 GA (2017-10) is the earliest release the pipeline
          # can represent; ceiling: releases are historical facts.
          - dbt_utils.accepted_range:
              arguments:
                min_value: "'2017-10-01'"
                max_value: current_date
      - name: n_items
        tests:
          - not_null
          # A release with zero parsed changelog items means the parse broke.
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
