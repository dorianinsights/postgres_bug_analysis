version: 2

models:
  - name: stg_release_items
    description: One changelog item, typed. Grain = (version, item_index).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [version, item_index]
    columns:
      - name: version
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_releases')
                field: version
      - name: major
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 10
      - name: release_dt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "'2017-10-01'"
                max_value: current_date
      - name: item_index
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: summary
        tests: [not_null]
      - name: full_text
        tests: [not_null]
      - name: cves
        tests:
          # NULL when the item has no CVEs (no empty strings in staging);
          # when present, semicolon-joined ids with no stray separators.
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^CVE-\d{4}-\d+(;CVE-\d{4}-\d+)*$'
