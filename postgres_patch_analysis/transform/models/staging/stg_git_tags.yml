version: 2

models:
  - name: stg_git_tags
    description: One minor-release tag (wrap moment). Grain = tag.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [major, minor]
    columns:
      - name: tag
        tests:
          - unique
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^REL_\d+_\d+$'
      - name: major
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 10
      - name: minor
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: tag_ts
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "'2016-10-01'"
                max_value: current_date + 2
