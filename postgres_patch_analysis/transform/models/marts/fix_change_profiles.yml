version: 2

models:
  - name: fix_change_profiles
    description: >
      One row per distinct fix -> ../data/derived/fix_change_profiles.csv:
      representative-commit change size, test/docs involvement, and the
      path-derived dominant subsystem alongside the keyword category.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [version, item_index]
    columns:
      - name: category
        tests: [not_null]
      - name: n_annotated_commits
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
