version: 2

models:
  - name: wave_summary
    description: >
      One same-day release wave -> ../data/derived/wave_summary.csv. Distinct
      fix count (backpatched duplicates collapsed across branches), CVE
      count, security count, out-of-band + partial-window flags.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: security_fixes <= distinct_fixes
    columns:
      - name: wave_date
        tests:
          - unique
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "'2017-10-01'"
                max_value: current_date
      - name: versions
        tests: [not_null]
      - name: n_releases
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: distinct_fixes
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: distinct_cves
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: security_fixes
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: out_of_band
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: partial_window
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
