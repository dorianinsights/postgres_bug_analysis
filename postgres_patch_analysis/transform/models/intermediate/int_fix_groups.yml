version: 2

models:
  - name: int_fix_groups
    description: >
      item_ord -> group_ord (the component's lowest item_ord) from the
      connected-components dedup. Every fix item appears exactly once.
    tests:
      # group_ord is the MIN item_ord of the component, so it can never
      # exceed any member's own ordinal.
      - dbt_utils.expression_is_true:
          arguments:
            expression: group_ord <= item_ord
    columns:
      - name: item_ord
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_fix_items')
                field: item_ord
      - name: group_ord
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_fix_items')
                field: item_ord
