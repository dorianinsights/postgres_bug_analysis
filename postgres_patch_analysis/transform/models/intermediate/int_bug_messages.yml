version: 2

models:
  - name: int_bug_messages
    description: >
      pgsql-bugs messages tagged with the bug number their subject carries
      (NULL for free-form posts). Grain = message_id.
    columns:
      - name: message_id
        tests: [unique, not_null]
      - name: sent_dt
        tests: [not_null]
      - name: bug_number
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: is_root
        tests: [not_null]
