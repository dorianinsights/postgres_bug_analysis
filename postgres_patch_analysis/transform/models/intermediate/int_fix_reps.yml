version: 2

models:
  - name: int_fix_reps
    description: >
      One representative item per distinct fix, categorized.
      Grain = item_ord (= its group's group_ord).
    tests:
      # An item carrying any CVE must land in the CVE bucket — the
      # categorization's first rule, encoded as an invariant.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "cves = '' OR category = 'Security (CVE)'"
    columns:
      - name: item_ord
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_fix_groups')
                field: group_ord
      - name: wave_date
        tests: [not_null]
      - name: summary
        tests: [not_null]
      - name: full_text
        tests: [not_null]
      - name: cves
        tests: [not_null]
      - name: category
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('categories')
                field: category
