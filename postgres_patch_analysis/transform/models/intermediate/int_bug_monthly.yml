version: 2

models:
  - name: int_bug_monthly
    description: >
      Monthly pgsql-bugs report volume vs acted-upon rate. Grain =
      report_month_dt. Recent months are right-censored.
    columns:
      - name: report_month_dt
        tests: [unique, not_null]
      - name: n_reports
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: pct_acted_upon
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
