_schema_version: "0.6.0"  # written automatically by dct migrate
title: "PostgreSQL Fix Velocity — Changelog"
notes: >
  Every minor release of the corpus majors (PG14 onward, the upper bound
  discovered from the clone), parsed from the official
  release notes: fix volume per quarterly release, fix categories,
  security fixes, contributors, and next-release projection scenarios.
  Data are produced by the transform/ dbt project (release notes parsed from
  the clone's SGML at build time).

style:
  charts:
    min_height: 380
    max_height: 380
    bar: { stack: zero }

queries:
  latest_release:
    notes: The most recent release's headline numbers.
    source: warehouse
    sql: |
      SELECT release_dt AS release_dt, versions, distinct_fix_cnt, security_fix_cnt, distinct_cve_cnt
      FROM {{ ref('dim_release') }}
      WHERE status = 'shipped'
      ORDER BY 1 DESC
      LIMIT 1

  upcoming_release:
    notes: >
      The upcoming (open) release's headline numbers SO FAR, to sit beneath the
      latest-release KPIs for comparison. Fixes so far is early_fix_cnt — distinct
      fixes already committed to the stable branches this cycle. Security fixes and
      CVEs arrive embargoed on wrap day (they only reach public git then), so they
      are 0 by construction until the release wraps.
    source: warehouse
    sql: |
      SELECT
        release_dt AS release_dt,
        versions,
        early_fix_cnt AS distinct_fix_cnt,
        0 AS security_fix_cnt,
        0 AS distinct_cve_cnt
      FROM {{ ref('dim_release') }}
      WHERE status = 'open'

  releases_by_branch:
    notes: >
      Fix items per scheduled minor release, one series per major version.
      Out-of-band emergency re-releases are excluded via dim_version.is_out_of_band
      (a release-group property, not a per-version item-count threshold). Shipped
      releases only -- item_cnt is the release-notes item count, which does not
      exist for the still-accumulating upcoming release.
    source: warehouse
    sql: |
      SELECT
        dv.release_dt AS date,
        dm.major_label AS branch,
        dv.item_cnt AS n_items
      FROM {{ ref('dim_version') }} AS dv
      INNER JOIN {{ ref('dim_major') }} AS dm ON dv.dim_major_key = dm.dim_major_key
      WHERE dv.minor > 0 AND NOT dv.is_out_of_band
      ORDER BY 1, dv.major

  fct_release_categories_agg:
    notes: >
      Distinct fixes per full-quarter release by category (backpatched
      duplicates collapsed across branches; out-of-band releases excluded).
    source: warehouse
    sql: |
      SELECT release_dt AS release_dt, category, category_order, fix_cnt
      FROM {{ ref('fct_release_categories_agg') }}
      WHERE NOT is_out_of_band
      ORDER BY 1, 3

  oob_categories:
    notes: The out-of-band emergency releases' fixes by category.
    source: warehouse
    sql: |
      -- categorical x: an ISO-prefixed label sorts chronologically, and the
      -- suffix keeps dct from date-parsing it onto a (sparse) temporal axis —
      -- only 3 emergencies, so adjacent labelled bars beat 3 scattered ones
      SELECT STRFTIME(release_dt, '%Y-%m') || ' re-release' AS release, category, category_order, fix_cnt
      FROM {{ ref('fct_release_categories_agg') }}
      WHERE is_out_of_band
      ORDER BY 1, 3

  security_by_release:
    notes: >
      CVE-bearing fixes per scheduled release, split by CVSS v3 severity band.
      Security is CVE-anchored now that it is a flag rather than a category
      (is_security_hardening is tracked separately on fct_fixes). Fixes whose CVE
      has no published score (long-EOL majors) fall in the UNSCORED band.
    source: warehouse
    sql: |
      SELECT
        release_dt AS release_dt,
        COALESCE(severity_band, 'UNSCORED') AS band,
        COALESCE(severity_band_order, -1) AS band_order,
        COUNT(*) AS fix_cnt
      FROM {{ ref('fct_fixes') }}
      WHERE NOT is_out_of_band AND cves IS NOT null
      GROUP BY ALL
      ORDER BY 1, 3

  contributors_by_release:
    notes: >
      Distinct credited contributors per scheduled release, split into names
      appearing for the first time in this corpus vs returning names.
    source: warehouse
    sql: |
      SELECT
        wc.release_dt AS release_dt,
        CASE WHEN wc.is_first_release THEN 'first-time' ELSE 'returning' END AS cohort,
        COUNT(DISTINCT wc.contributor) AS contributors
      FROM {{ ref('fct_release_contributors_agg') }} AS wc
      WHERE NOT wc.is_out_of_band
      GROUP BY 1, 2
      ORDER BY 1, 2 DESC

  release_trend:
    notes: >
      Least-squares trendlines over full-quarter release totals (the partial
      first release excluded): one fit over all releases, one excluding the latest
      release as a sensitivity check.
    source: warehouse
    sql: |
      WITH fullq AS (
        SELECT release_dt AS release_dt,
               ROW_NUMBER() OVER (ORDER BY release_dt) - 1 AS slot,
               distinct_fix_cnt
        FROM {{ ref('dim_release') }}
        WHERE NOT is_out_of_band AND NOT is_partial_window AND status = 'shipped'
      ),
      fit_all AS (
        SELECT REGR_SLOPE(distinct_fix_cnt, slot) AS b, REGR_INTERCEPT(distinct_fix_cnt, slot) AS a FROM fullq
      ),
      fit_ex AS (
        SELECT REGR_SLOPE(distinct_fix_cnt, slot) AS b, REGR_INTERCEPT(distinct_fix_cnt, slot) AS a
        FROM fullq WHERE slot < (SELECT MAX(slot) FROM fullq)
      )
      SELECT fullq.release_dt,
             fit_all.a + fit_all.b * fullq.slot AS trend_all,
             fit_ex.a + fit_ex.b * fullq.slot AS trend_excl_latest
      FROM fullq, fit_all, fit_ex
      ORDER BY 1

  security_trend:
    notes: Same two trendlines fitted to the security-fix totals per release.
    source: warehouse
    sql: |
      WITH fullq AS (
        SELECT release_dt AS release_dt,
               ROW_NUMBER() OVER (ORDER BY release_dt) - 1 AS slot,
               security_fix_cnt
        FROM {{ ref('dim_release') }}
        WHERE NOT is_out_of_band AND NOT is_partial_window AND status = 'shipped'
      ),
      fit_all AS (
        SELECT REGR_SLOPE(security_fix_cnt, slot) AS b, REGR_INTERCEPT(security_fix_cnt, slot) AS a FROM fullq
      ),
      fit_ex AS (
        SELECT REGR_SLOPE(security_fix_cnt, slot) AS b, REGR_INTERCEPT(security_fix_cnt, slot) AS a
        FROM fullq WHERE slot < (SELECT MAX(slot) FROM fullq)
      )
      SELECT fullq.release_dt,
             fit_all.a + fit_all.b * fullq.slot AS trend_all,
             fit_ex.a + fit_ex.b * fullq.slot AS trend_excl_latest
      FROM fullq, fit_all, fit_ex
      ORDER BY 1

  branch_trend:
    notes: >
      Pooled trendlines over scheduled per-release fix counts (all branches
      together; the corpus's partial-window first release excluded via
      dim_release.is_partial_window, not by name), against calendar time. The
      regression's day index counts from the earliest included release, so
      there is no epoch literal to drift when the corpus floor moves.
    source: warehouse
    sql: |
      WITH sched AS (
        SELECT
          CAST(dv.release_dt AS DATE) AS date,
          dv.item_cnt AS n_items,
          DATE_DIFF('day', MIN(CAST(dv.release_dt AS DATE)) OVER (), CAST(dv.release_dt AS DATE)) AS t
        FROM {{ ref('dim_version') }} AS dv
        INNER JOIN {{ ref('dim_release') }} AS dr ON dv.dim_release_key = dr.dim_release_key
        WHERE dv.minor > 0 AND NOT dv.is_out_of_band AND NOT dr.is_partial_window
      ),
      fit_all AS (SELECT REGR_SLOPE(n_items, t) AS b, REGR_INTERCEPT(n_items, t) AS a FROM sched),
      fit_ex AS (
        SELECT REGR_SLOPE(n_items, t) AS b, REGR_INTERCEPT(n_items, t) AS a
        FROM sched WHERE sched.date < (SELECT MAX(date) FROM sched)
      )
      SELECT DISTINCT sched.date,
             fit_all.a + fit_all.b * sched.t AS trend_all,
             fit_ex.a + fit_ex.b * sched.t AS trend_excl_latest
      FROM sched, fit_all, fit_ex
      ORDER BY 1

  release_totals:
    notes: Distinct fixes per full-quarter release (the projection base series).
    source: warehouse
    sql: |
      SELECT release_dt AS release_dt, distinct_fix_cnt
      FROM {{ ref('dim_release') }}
      WHERE NOT is_out_of_band AND status = 'shipped'
      ORDER BY 1

  projections:
    notes: >
      The four series scenarios for the open release (fct_fix_projections,
      method_family = series: reversion / trend / regime repeat / escalation).
    source: warehouse
    sql: |
      SELECT prj.release_dt AS projected_dt, prj.method_label AS scenario, prj.projected_fix_cnt AS distinct_fix_cnt, prj.assumption
      FROM {{ ref('fct_fix_projections') }} AS prj
      INNER JOIN {{ ref('dim_release') }} AS rel ON prj.dim_release_key = rel.dim_release_key
      WHERE rel.status = 'open' AND prj.method_family = 'series'
      -- method_order is not in the select list, so it stays named
      ORDER BY prj.method_order

  release_table:
    notes: All releases with headline numbers, newest first.
    source: warehouse
    sql: |
      SELECT release_dt AS release_dt, versions, distinct_fix_cnt, security_fix_cnt, distinct_cve_cnt,
             CASE WHEN is_out_of_band THEN 'yes' ELSE '' END AS is_out_of_band
      FROM {{ ref('dim_release') }}
      WHERE status = 'shipped'
      ORDER BY 1 DESC

charts:
  kpi_fixes:
    type: kpi
    query: latest_release
    value: distinct_fix_cnt
    label: "Distinct fixes, latest release"

  kpi_security:
    type: kpi
    query: latest_release
    value: security_fix_cnt
    label: "Security fixes, latest release"

  kpi_cves:
    type: kpi
    query: latest_release
    value: distinct_cve_cnt
    label: "CVEs closed, latest release"

  kpi_upcoming_fixes:
    type: kpi
    query: upcoming_release
    value: distinct_fix_cnt
    label: "Distinct fixes so far, next release"

  kpi_upcoming_security:
    type: kpi
    query: upcoming_release
    value: security_fix_cnt
    label: "Security fixes so far, next release (embargoed until wrap)"

  kpi_upcoming_cves:
    type: kpi
    query: upcoming_release
    value: distinct_cve_cnt
    label: "CVEs closed so far, next release (embargoed until wrap)"

  fixes_by_branch:
    type: line
    query: releases_by_branch
    title: "Fixes per scheduled minor release, by major version"
    subtitle: "A fix backpatched to all branches appears on each line; shipped releases only (the upcoming release has no changelog yet)"
    x: date
    y: n_items
    color: branch
    y_label: "changelog items"
    layers:
      - type: line
        query: branch_trend
        x: date
        y: trend_all
        label: "pooled trend"
        style: { marks: { line: { stroke: { color: "#8a8a8a", dasharray: "6 5", width: 1.5 } } } }
      - type: line
        query: branch_trend
        x: date
        y: trend_excl_latest
        label: "trend excluding latest release"
        style: { marks: { line: { stroke: { color: "#c0392b", dasharray: "3 5", width: 1.5 } } } }

  category_mix:
    type: bar
    query: fct_release_categories_agg
    title: "Category mix per full-quarter release"
    subtitle: "Distinct fixes; backpatched duplicates collapsed across branches"
    x: release_dt
    y: fix_cnt
    color: category
    layers:
      - type: line
        query: release_trend
        x: release_dt
        y: trend_all
        label: "linear trend (full-quarter releases)"
        style: { marks: { line: { stroke: { color: "#8a8a8a", dasharray: "6 5", width: 1.5 } } } }
      - type: line
        query: release_trend
        x: release_dt
        y: trend_excl_latest
        label: "trend excluding Aug '26"
        style: { marks: { line: { stroke: { color: "#c0392b", dasharray: "3 5", width: 1.5 } } } }

  category_share:
    type: bar
    query: fct_release_categories_agg
    title: "Same data as shares of each release"
    subtitle: "100% stacked"
    x: release_dt
    y: fix_cnt
    color: category
    # no axis_y format: normalize already labels the axis in percent, and an
    # authored percent format leaks into the hover's raw count column ("2000%")
    style: { stack: normalize }

  oob_releases:
    type: bar
    query: oob_categories
    title: "The out-of-band emergency releases"
    subtitle: "Re-releases shipped one or two weeks after a scheduled release"
    x: release
    y: fix_cnt
    color: category
    height: 340

  security:
    type: bar
    query: security_by_release
    title: "The security hockey stick"
    subtitle: "CVE-bearing fixes per scheduled release, by CVSS v3 severity band"
    x: release_dt
    y: fix_cnt
    color: band
    height: 340
    layers:
      - type: line
        query: security_trend
        x: release_dt
        y: trend_all
        label: "linear trend (full-quarter releases)"
        style: { marks: { line: { stroke: { color: "#8a8a8a", dasharray: "6 5", width: 1.5 } } } }
      - type: line
        query: security_trend
        x: release_dt
        y: trend_excl_latest
        label: "trend excluding Aug '26"
        style: { marks: { line: { stroke: { color: "#c0392b", dasharray: "3 5", width: 1.5 } } } }

  contributors:
    type: bar
    query: contributors_by_release
    title: "Contributors per release: first-time vs returning"
    subtitle: "Names credited in the release notes; first-time = new to this 2022+ corpus"
    x: release_dt
    y: contributors
    color: cohort

  projection:
    type: line
    query: release_totals
    title: "Next-release projection scenarios"
    subtitle: "Historical distinct fixes per full-quarter release, with four scenarios for the next release"
    x: release_dt
    y: distinct_fix_cnt
    y_label: "distinct fixes"
    layers:
      - type: scatter
        query: projections
        x: projected_dt
        y: distinct_fix_cnt
        color: scenario
        label: "Scenario"
      - type: line
        query: release_trend
        x: release_dt
        y: trend_all
        label: ""
        style: { marks: { line: { stroke: { color: "#8a8a8a", dasharray: "6 5", width: 1.5 } } } }

  scenario_table:
    type: table
    query: projections
    title: "Scenario assumptions"
    # the auto header "Distinct Fix Cnt" truncates in its narrow numeric column
    style: { columns: { distinct_fix_cnt: { label: "fixes" } } }

  release_table:
    type: table
    query: release_table
    title: "All release releases"

rows:
  - cols: [kpi_fixes, kpi_security, kpi_cves]
  - cols: [kpi_upcoming_fixes, kpi_upcoming_security, kpi_upcoming_cves]
  - fixes_by_branch
  - category_mix
  - category_share
  - cols: [oob_releases, security]
  - contributors
  - projection
  - scenario_table
  - release_table
