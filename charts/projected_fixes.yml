_schema_version: "0.6.0"  # written automatically by dct migrate
# Forward-looking view: what the next scheduled minor is on track to
# contain, from the early-cycle signals and their historical scaling. The
# estimates are deliberately naive linear scalings (fct_fix_projections'
# signal family) — transparent bands, not fitted models — and the same
# fact replays every method for every shipped release, so the face
# scores them.
title: "Projected Upcoming Fix Counts"
notes: >
  How many fixes to expect in the next scheduled minor release: live
  accrual counters since the last wrap (the content cutoff), four
  signal estimates (three early signals times their historical median
  shipped-per-early ratios, plus the per-origin committed scaling, from
  every closed cycle replayed at today's cycle age), the ratio history
  that shows how stable each scaling factor has been, and a backtest:
  every method replayed for every shipped release from the releases
  before it, against what that release actually shipped. Demand-side
  estimators (reports, messages) assume the historical signal-to-fix
  conversion; the supply-side ones (committed pace, by origin) react to
  the commit stream. Everything here is measured at the open cycle's
  CURRENT age, so the estimates, the backtest and the scorecard all
  move day by day -- read the scorecard as "how each method would have
  done at this point in the cycle", not as a fixed ranking.

style:
  charts:
    min_height: 340
    max_height: 340

queries:
  next_wrap:
    notes: Days until the next scheduled wrap (the content cutoff).
    source: warehouse
    sql: |
      SELECT
        MIN(wrap_dt) - CURRENT_DATE AS days_to_wrap,
        MIN(release_dt) AS release_dt
      FROM {{ ref('dim_release') }}
      WHERE status IN ('open', 'future')

  next_minor_reports:
    notes: Bug reports that can only ship in the next minor.
    source: warehouse
    sql: |
      SELECT
        COUNT(*) AS report_cnt,
        COUNT(*) FILTER (WHERE is_acted_upon) AS acted_cnt
      FROM {{ ref('dim_bug') }}
      WHERE earliest_ship_release_dt > CURRENT_DATE

  next_minor_messages:
    notes: List messages accrued toward the next minor (both lists).
    source: warehouse
    sql: |
      SELECT
        COUNT(*) AS message_cnt,
        COUNT(*) FILTER (WHERE is_fix_linked) AS fix_linked_cnt
      FROM {{ ref('fct_messages') }}
      WHERE earliest_ship_release_dt > CURRENT_DATE

  next_minor_fixes:
    notes: Distinct fixes already committed in the open cycle.
    source: warehouse
    sql: |
      SELECT early_fix_cnt AS fix_cnt
      FROM {{ ref('dim_release') }}
      WHERE status = 'open'

  blended_estimate:
    notes: The equal-weight blend of the three single-signal estimates, for the open release.
    source: warehouse
    sql: |
      SELECT prj.projected_fix_cnt
      FROM {{ ref('fct_fix_projections') }} AS prj
      INNER JOIN {{ ref('dim_release') }} AS rel ON prj.dim_release_key = rel.dim_release_key
      WHERE rel.status = 'open' AND prj.projection_method = 'blended'

  estimates:
    notes: >
      The open release's signal estimates (each early signal times its
      ratio, plus the per-origin scaling) and the reference points (blend,
      seasonal baseline); the label carries the ratio applied.
    source: warehouse
    sql: |
      SELECT
        CASE
          WHEN prj.scale_factor IS NOT NULL THEN prj.method_label || ' x ' || ROUND(prj.scale_factor, 3)
          WHEN prj.projection_method = 'seasonal_baseline' THEN prj.method_label || ' (' || STRFTIME(prj.release_dt, '%b') || ' median)'
          ELSE prj.method_label
        END AS estimator,
        prj.method_order AS estimator_order,
        prj.projected_fix_cnt
      FROM {{ ref('fct_fix_projections') }} AS prj
      INNER JOIN {{ ref('dim_release') }} AS rel ON prj.dim_release_key = rel.dim_release_key
      WHERE rel.status = 'open' AND prj.method_family IN ('signal', 'reference')
      ORDER BY 2

  backtest:
    notes: >
      The signal estimators and the blend (the series scenarios are on the
      changelog face; the scorecard below covers every method) replayed for
      every shipped full-quarter release from the releases before it
      (fct_fix_projections), against what the release actually shipped
      (dim_release): projected minus actual, so zero is a perfect call.
    source: warehouse
    sql: |
      SELECT prj.release_dt, prj.method_label AS method, prj.projected_fix_cnt - rel.distinct_fix_cnt AS error
      FROM {{ ref('fct_fix_projections') }} AS prj
      INNER JOIN {{ ref('dim_release') }} AS rel ON prj.dim_release_key = rel.dim_release_key
      WHERE rel.status = 'shipped' AND (prj.method_family = 'signal' OR prj.projection_method = 'blended')
      ORDER BY 1, prj.method_order

  method_scorecard:
    notes: >
      Every method's backtest over the shipped releases it could be replayed
      for: mean error (bias, negative = under-called) and mean absolute error.
      The signal methods are replayed at today's cycle age, so their rows
      re-rank as the cycle ages; the series and seasonal rows are stable.
    source: warehouse
    sql: |
      SELECT
        prj.method_label AS method,
        prj.method_family AS family,
        COUNT(*) AS releases,
        ROUND(AVG(prj.projected_fix_cnt - rel.distinct_fix_cnt), 1) AS bias,
        ROUND(AVG(ABS(prj.projected_fix_cnt - rel.distinct_fix_cnt)), 1) AS mean_abs_error
      FROM {{ ref('fct_fix_projections') }} AS prj
      INNER JOIN {{ ref('dim_release') }} AS rel ON prj.dim_release_key = rel.dim_release_key
      WHERE rel.status = 'shipped'
      GROUP BY 1, 2
      ORDER BY 5

  ratio_history:
    notes: >
      Each closed cycle's shipped-per-early-signal ratios at today's
      cycle age — how stable each estimator's scaling factor has been.
    source: warehouse
    sql: |
      SELECT release_dt AS ships_at_dt, 'per bug report' AS estimator, ROUND(fix_per_early_report, 2) AS ratio
      FROM {{ ref('dim_release') }}
      WHERE NOT is_out_of_band AND NOT is_partial_window AND fix_per_early_report IS NOT NULL
      UNION ALL
      SELECT release_dt AS ships_at_dt, 'per 100 list messages', ROUND(fix_per_early_message * 100, 2)
      FROM {{ ref('dim_release') }}
      WHERE NOT is_out_of_band AND NOT is_partial_window AND fix_per_early_message IS NOT NULL
      UNION ALL
      SELECT release_dt AS ships_at_dt, 'per committed fix', ROUND(fix_per_early_fix, 2)
      FROM {{ ref('dim_release') }}
      WHERE NOT is_out_of_band AND NOT is_partial_window AND fix_per_early_fix IS NOT NULL
      ORDER BY 1, 2

  pace_history:
    notes: >
      Early committed fixes (at today's cycle age) vs the release's final
      shipped count, per cycle — the open cycle's early bar is the one
      being projected.
    source: warehouse
    sql: |
      SELECT STRFTIME(release_dt, '%b %y') AS release, EPOCH(release_dt)::BIGINT AS release_seq, 'early committed (at this cycle age)' AS series, early_fix_cnt AS fixes
      FROM {{ ref('dim_release') }}
      WHERE NOT is_out_of_band AND NOT is_partial_window AND distinct_fix_cnt IS NOT NULL
      UNION ALL
      SELECT STRFTIME(release_dt, '%b %y') AS release, EPOCH(release_dt)::BIGINT AS release_seq, 'shipped in the release' AS series, distinct_fix_cnt
      FROM {{ ref('dim_release') }}
      WHERE NOT is_out_of_band AND NOT is_partial_window AND distinct_fix_cnt IS NOT NULL
      UNION ALL
      -- the open cycle: early pace so far, plus a zero 'shipped' row so
      -- every release has two rows (the chart sort SUMS release_seq per release —
      -- unequal row counts scramble the order)
      SELECT STRFTIME(dr.release_dt, '%b %y') AS release, EPOCH(dr.release_dt)::BIGINT AS release_seq, ser.series, CASE WHEN ser.series LIKE 'early%' THEN dr.early_fix_cnt ELSE 0 END
      FROM {{ ref('dim_release') }} AS dr
      CROSS JOIN (SELECT UNNEST(['early committed (at this cycle age)', 'shipped in the release']) AS series) AS ser
      WHERE dr.status = 'open'
      ORDER BY 2, 3

charts:
  kpi_wrap:
    type: kpi
    query: next_wrap
    value: days_to_wrap
    label: "Days until the next wrap (content cutoff)"

  kpi_reports:
    type: kpi
    query: next_minor_reports
    value: report_cnt
    label: "Bug reports accrued toward the next minor"
    support:
      value: acted_cnt
      label: "already linked to a fix commit"

  kpi_messages:
    type: kpi
    query: next_minor_messages
    value: message_cnt
    label: "List messages accrued toward the next minor"
    support:
      value: fix_linked_cnt
      label: "in fix-bound threads so far"

  kpi_fixes:
    type: kpi
    query: next_minor_fixes
    value: fix_cnt
    label: "Distinct fixes already committed this cycle"

  kpi_blend:
    type: kpi
    query: blended_estimate
    value: projected_fix_cnt
    label: "Blended estimate for the next minor's fixes"

  estimates:
    type: bar
    query: estimates
    title: "Signal estimates for the next minor"
    subtitle: "Each early signal times its historical median ratio, plus the blend and the seasonal floor; the spread IS the message — supply-side pace says a big release, but see the scorecard for how often it has been right"
    x: estimator
    y: projected_fix_cnt
    # the one authored sort: a single-series HORIZONTAL bar defaults to
    # value-descending order; every other categorical axis keeps the query's ORDER BY
    sort: { by: estimator_order, order: asc }
    height: 320

  ratio_history:
    type: line
    query: ratio_history
    title: "How each estimator's ratio has behaved"
    subtitle: "Shipped fixes per early signal, per closed cycle at today's cycle age; Aug 26 is the supply-surge outlier"
    x: ships_at_dt
    y: ratio
    color: estimator

  pace_history:
    type: bar
    query: pace_history
    title: "Early committed fixes vs final shipped, per cycle"
    subtitle: "At today's cycle age; the rightmost early bar (the open cycle) is the highest ever observed"
    x: release
    y: fixes
    color: series
    style: { stack: none, orientation: vertical }

  backtest:
    type: line
    query: backtest
    title: "Backtest: each estimator's error per shipped release"
    subtitle: "Projected minus actual, replayed from the releases before each one at today's cycle age; zero is a perfect call; the first two points rest on one or two history releases"
    x: release_dt
    y: error
    color: method

  scorecard:
    type: table
    query: method_scorecard
    title: "Method scorecard over the shipped releases"
    # bias can be a fraction (0.7): the default compact format renders it "700m"
    style:
      columns:
        releases: { format: integer }
        bias: { format: number_full }
        mean_abs_error: { label: "mean abs error", format: number_full }

rows:
  - cols: [kpi_wrap, kpi_reports, kpi_messages, kpi_fixes]
  - cols: [kpi_blend]
  - estimates
  - pace_history
  - ratio_history
  - backtest
  - scorecard
