_schema_version: "0.6.0"  # written automatically by dct migrate
# one color per origin on every chart of this board: dct 0.6 shares a
# category scale across charts that bind the same color: field, but a chart
# with layers: (fix_commit_origins) does not take part, so without the pin the
# layered chart assigned unsourced/embargoed the opposite colors
style:
  charts:
    min_height: 360
    max_height: 360
    bar: { stack: zero, orientation: vertical }
    category_colors:
      origin:
        values:
          pgsql-hackers: category[1]
          pgsql-bugs: category[2]
          unsourced: category[3]
          embargoed security: category[4]
      # fix_counts colors bars by calendar year (query labels them CYYYYY; dct
      # disqualifies a bare "2020" as a temporal value and won't seat a pin on
      # it). Each year gets a DISTINCT qualitative hue from the categorical
      # palette so the boundary between one year's block of quarters and the
      # next is obvious; the slots are chosen (and checked in the render) so no
      # two adjacent years read as a similar hue. Legend order is pinned
      # chronologically on the chart (style.legend.values). Add a free slot for
      # a new release year.
      release_year:
        values:
          "CY2020": category[1]
          "CY2021": category[5]
          "CY2022": category[3]
          "CY2023": category[4]
          "CY2024": category[6]
          "CY2025": category[2]
          "CY2026": category[7]
title: "PostgreSQL Fix Analysis"
notes: >
  Source attribution for fixes and development activity: each fix and
  master-branch commit is traced through its Discussion: trailers to
  pgsql-bugs (or a Bug: # trailer), pgsql-hackers, or
  unknown/other/internal when there is no public trail. Built to ground
  projections of how bug-report volume translates into fix volume. Data
  from the transform/ dbt project (fct_fix_origins_agg -- documented and
  committed fixes per release by origin, the open release's committed-so-far
  count included -- and fct_origin_activity_monthly_agg). The lists
  themselves are on the Email List Analysis face.

queries:

  fix_count:
    source: warehouse
    sql: |
      SELECT
        STRFTIME(release_dt, '%b %y') AS release,
        EPOCH(release_dt)::BIGINT AS release_seq,
        'CY' || STRFTIME(release_dt, '%Y') AS release_year,
        SUM(fix_cnt) AS fix_cnt
      FROM {{ ref('fct_fix_origins_agg') }}
      WHERE status = 'shipped' AND NOT is_out_of_band AND NOT is_partial_window
      GROUP BY 1, 2, 3
      ORDER BY 2

  fix_cve_split:
    notes: >
      The same documented fixes as fix_count, but each release split into the
      CVE-bearing subset (security_fix_cnt summed over origins) and the
      remainder that names no CVE, long-form for the stacked bar. cve_pct rides
      on both rows (the per-release CVE share) so the support strip can read it.
      The stacked total equals the "Fixes by release" chart above. Shipped
      releases only; out-of-band and partial post-GA releases excluded.
    source: warehouse
    sql: |
      WITH per_release AS (
        SELECT
          release_dt,
          SUM(fix_cnt) AS total_fixes,
          SUM(security_fix_cnt) AS cve_fixes
        FROM {{ ref('fct_fix_origins_agg') }}
        WHERE status = 'shipped' AND NOT is_out_of_band AND NOT is_partial_window
        GROUP BY release_dt
      )

      SELECT
        STRFTIME(release_dt, '%b %y') AS release,
        EPOCH(release_dt)::BIGINT AS release_seq,
        'with CVE' AS security_class,
        cve_fixes AS fix_cnt,
        cve_fixes::DOUBLE / NULLIF(total_fixes, 0) AS cve_pct
      FROM per_release
      UNION ALL
      SELECT
        STRFTIME(release_dt, '%b %y') AS release,
        EPOCH(release_dt)::BIGINT AS release_seq,
        'no CVE' AS security_class,
        total_fixes - cve_fixes AS fix_cnt,
        cve_fixes::DOUBLE / NULLIF(total_fixes, 0) AS cve_pct
      FROM per_release
      ORDER BY 2, 3

  fix_cve_pct:
    notes: The per-release CVE share (CVE-bearing fixes / total documented fixes), one row per release for the dual-axis line.
    source: warehouse
    sql: |
      SELECT
        STRFTIME(release_dt, '%b %y') AS release,
        EPOCH(release_dt)::BIGINT AS release_seq,
        SUM(security_fix_cnt)::DOUBLE / NULLIF(SUM(fix_cnt), 0) AS cve_pct
      FROM {{ ref('fct_fix_origins_agg') }}
      WHERE status = 'shipped' AND NOT is_out_of_band AND NOT is_partial_window
      GROUP BY 1, 2
      ORDER BY 2

  fix_origins_count:
    notes: >
      DOCUMENTED fixes per shipped release by origin: a fix is one release-notes
      item, deduplicated across the branches it was backpatched to (fct_fixes).
      Shipped releases only -- the open release has no notes yet (its committed
      fixes are the fix_commit_origins chart below). Every release carries all
      four origins (zero-filled upstream) so each stack has the same series.
      Out-of-band emergency releases excluded. committed_fix_cnt and rate ride along for the hover:
      the commits behind each bar and the share of them the notes documented.
      security_fix_cnt (the CVE-bearing subset of fix_cnt, all origins) totals
      per release into the Security support strip below the axis.
    source: warehouse
    sql: |
      SELECT
        STRFTIME(release_dt, '%b %y') AS release,
        EPOCH(release_dt)::BIGINT AS release_seq,
        CASE origin
          WHEN 'unknown_or_internal_security' THEN 'embargoed security'
          WHEN 'unknown_or_internal_not_security' THEN 'unsourced'
          ELSE origin
        END AS origin,
        security_fix_cnt,
        fix_cnt,
        committed_fix_cnt,
        documentation_rate AS rate
      FROM {{ ref('fct_fix_origins_agg') }}
      WHERE status = 'shipped' AND NOT is_out_of_band AND NOT is_partial_window
      ORDER BY 2, 3

  fix_commit_origins:
    notes: >
      COMMITTED fixes per release by origin, the same measure for every bar: a
      fix is one distinct non-housekeeping stable-branch commit subject,
      deduplicated across the branches it was backpatched to
      (dim_commit.fix_key -> int_committed_fixes), counted in the release it
      shipped in by git tag ancestry. The open release counts the fixes landed
      since the wrap SO FAR (same rule, not yet tagged) -- right-censored, and
      with no security yet because embargoed work reaches git only on wrap day.
      Roughly twice the documented chart above: the notes fold several commits
      into one item and document only 40-60% of subjects. release_seq is the
      chart's sort key (the x-axis order).
    source: warehouse
    sql: |
      SELECT
        STRFTIME(release_dt, '%b %y') || CASE WHEN status = 'open' THEN ' (so far)' ELSE '' END AS release,
        EPOCH(release_dt)::BIGINT AS release_seq,
        CASE origin
          WHEN 'unknown_or_internal_security' THEN 'embargoed security'
          WHEN 'unknown_or_internal_not_security' THEN 'unsourced'
          ELSE origin
        END AS origin,
        -- named for the y-axis title, which dct composes from the base and layer y columns
        committed_fix_cnt AS fix_commits,
        -- the open release's value again, NULL elsewhere: the dashed overlay layer's y
        CASE WHEN status = 'open' THEN committed_fix_cnt END AS so_far,
        fix_cnt AS documented_fix_cnt,
        documentation_rate AS rate
      FROM {{ ref('fct_fix_origins_agg') }}
      WHERE NOT is_out_of_band AND NOT is_partial_window
      ORDER BY 2, 3

  fix_origin_shares:
    notes: >
      The documented fixes per shipped release by origin, as counts; the share
      chart normalizes them (stack: normalize), so its hover shows each
      origin's share AND its count, with the release total. Shipped releases
      only, like fix_origins_count, but without the commit columns that would
      crowd the hover.
    source: warehouse
    sql: |
      SELECT
        STRFTIME(release_dt, '%b %y') AS release,
        EPOCH(release_dt)::BIGINT AS release_seq,
        CASE origin
          WHEN 'unknown_or_internal_security' THEN 'embargoed security'
          WHEN 'unknown_or_internal_not_security' THEN 'unsourced'
          ELSE origin
        END AS origin,
        COALESCE(fix_cnt, 0) AS fix_cnt
      FROM {{ ref('fct_fix_origins_agg') }}
      WHERE status = 'shipped' AND NOT is_out_of_band AND NOT is_partial_window
      ORDER BY 2, 3

  ai_commits:
    notes: Master commits disclosing AI involvement (reviewed labels) per month by origin.
    source: warehouse
    sql: |
      SELECT
        month_dt,
        CASE origin
          WHEN 'unknown_or_internal_security' THEN 'embargoed security'
          WHEN 'unknown_or_internal_not_security' THEN 'unsourced'
          ELSE origin
        END AS origin,
        ai_commit_cnt
      FROM {{ ref('fct_origin_activity_monthly_agg') }}
      -- from the first month with a disclosed AI involvement
      WHERE month_dt >= (SELECT MIN(month_dt) FROM {{ ref('fct_origin_activity_monthly_agg') }} WHERE ai_commit_cnt > 0)
      ORDER BY 1, 2

charts:

  fix_counts:
    type: bar
    query: fix_count
    title: "Fixes by release"
    subtitle: "Documented fixes. a fix = one release-notes item, deduplicated across backpatched branches. Shipped releases only; out-of-band and partial post-GA releases excluded"
    x: release
    y: fix_cnt
    # color one bar per calendar year so the year reads at a glance across the
    # quarterly x labels; release_year is its own category scale (the board's
    # origin colors don't apply to this single-series chart)
    color: release_year
    # pin the legend to chronological order -- the emitter otherwise lists the
    # color-scale domain in an arbitrary order; values resolve by rendered text
    style:
      legend:
        values: [CY2020, CY2021, CY2022, CY2023, CY2024, CY2025, CY2026]
      axis_y:
        mirror: true

  fix_cve_split:
    type: bar
    query: fix_cve_split
    title: "Fixes by release: CVE split and share"
    subtitle: "Documented fixes split by CVE status (left, same total as above); line = CVE share of the release (right). Out-of-band and partial post-GA excluded"
    x: release
    y: fix_cnt
    color: security_class
    # dual axis: the stacked bar (counts) on the left, a line for the CVE share
    # on its own right axis. A layered chart doesn't take part in the board's
    # category_colors, so the two bar series are colored with an inline palette
    # (blue = no CVE bulk, category[4] maroon = with CVE, the board's security hue).
    layers:
      - type: line
        query: fix_cve_pct
        y: cve_pct
        label: "CVE share"
        axis_y: { position: right, title: "CVE share", labels: { format: ".0%" } }
        style: { marks: { line: { stroke: { color: "dbt-grays.ink", width: 2 } } } }
    # support strip (top to bottom): total fixes, fixes without a CVE, fixes
    # with one (per series), and the CVE share. The first authored entry sits at
    # the top. Total = aggregate: sum of the two series; cve_pct is constant per
    # release, so aggregate: max reads it back as that one value. Font 8 keeps
    # the three-digit / percent cells legible.
    support_table:
      - { aggregate: sum, source: fix_cnt, format: integer, label: "Total" }
      - { per_series: fix_cnt }
      - { aggregate: max, source: cve_pct, format: percent, label: "CVE %" }
    style:
      color:
        categorical:
          palette: ["category[1]", "category[4]"]
      legend:
        values: ["with CVE", "no CVE"]
      support_table: { position: bottom, font: { size: 8 } }

  fix_origin_counts:
    type: bar
    query: fix_origins_count
    title: "Fixes by release by origin"
    subtitle: "Documented fixes by source: a fix = one release-notes item, deduplicated across backpatched branches. Shipped releases only; out-of-band and partial post-GA releases excluded"
    x: release
    y: fix_cnt
    color: origin
    # support_table is a LIST of entries; each is source: / aggregate:+source: /
    # per_series:. The query has one row per (release, origin), so aggregate: sum
    # folds security_fix_cnt to one value per release (the x group).
    support_table:
      - aggregate: sum
        source: security_fix_cnt
        format: integer
        label: "Security"
    # smaller strip font so the two-digit counts (e.g. 14, 29) don't collide in
    # the narrow per-release bands; a 1px divider rule separates the strip from
    # the axis above it
    style:
      support_table: { position: bottom, font: { size: 10 }, divider: { width: 1 } }

  fix_commit_origins:
    type: bar
    query: fix_commit_origins
    title: "Fix commits per release"
    subtitle: "Committed fixes by source: a fix = one distinct fix-commit subject, deduplicated across backpatched branches, in the release it shipped in. Dashed bar = the next release so far (no security until wrap)"
    x: release
    y: fix_commits
    color: origin
    # the open release's bar is the same measure, still accumulating: mark it
    # with a dashed outline -- a bar layer on the same query whose y (so_far)
    # is NULL on every shipped row, so it draws only that bar (bar charts take
    # no per-row opacity encoding)
    layers:
      - type: bar
        y: so_far
        color: origin
        style:
          marks:
            bar:
              border: { color: "#333333", width: 2, dash_array: [6, 4] }

  fix_origin_share:
    type: bar
    query: fix_origin_shares
    title: "Fix origin share per release"
    subtitle: "Same documented fixes as shares; shipped releases only, out-of-band and partial post-GA excluded — pgsql-bugs supplies a quarter to a third"
    x: release
    y: fix_cnt
    color: origin
    # no axis_y format: normalize already labels the axis in percent, and an
    # authored percent format leaks into the hover's raw count column ("2000%")
    style: { stack: normalize }

  ai_commits:
    type: area
    query: ai_commits
    title: "AI-flagged commits per month, by origin"
    subtitle: "Master commits whose message discloses AI involvement (a vendor and a work role); stacked, so the top edge is the monthly total"
    x: month_dt
    y: ai_commit_cnt
    color: origin
    # stacked (not the overlapping default) so the upper contour reads as
    # the total AI-flagged count per month
    style: { stack: zero }
    height: 340

rows:
  - fix_counts
  - fix_cve_split
  - fix_origin_counts
  - fix_commit_origins
  - fix_origin_share
  - ai_commits
