_schema_version: "0.6.0"  # written automatically by dct migrate
# The mailing lists themselves: how much traffic pgsql-bugs and pgsql-hackers
# carry, how much of it turns into committed work, what becomes of the threads
# people start, and which threads commits cite. Fix attribution BY source
# stays on the Fix Origins face; bug-report volume and outcomes on the Bug
# Reports face.
#
# Monthly series use areas/lines — bars would label all ~70 months.
title: "PostgreSQL Mailing Lists"
notes: >
  Email-list analysis of pgsql-bugs and pgsql-hackers: monthly and weekly
  traffic vs the fix-linked subset (messages whose thread a commit eventually
  cites), the fix-linked share, new pgsql-hackers threads by what they led
  to, and the discussion threads cited by master commits. Data from the
  transform/ dbt project (fct_messages, fct_threads and
  fct_origin_activity_monthly_agg; the fix-linked share is computed from the
  message grain at query time).

style:
  charts:
    min_height: 340
    max_height: 340
    bar: { stack: zero }

queries:

  monthly_traffic:
    notes: >
      Monthly messages per list over the whole archive: all traffic and the
      fix-linked subset (messages whose thread a commit eventually cites) as
      two measures per list; the chart draws one series per measure x list
      (dct 0.6 multi-y with color). The last point is the CURRENT month,
      still filling.
    source: warehouse
    sql: |
      SELECT
        DATE_TRUNC('month', sent_dt)::DATE AS month_dt,
        list_name,
        COUNT(*) AS "all",
        COUNT(*) FILTER (WHERE is_fix_linked) AS "fix-linked"
      FROM {{ ref('fct_messages') }}
      GROUP BY ALL
      ORDER BY 1, 2

  monthly_linked_share:
    notes: >
      Share of each month's messages that belong to commit-cited threads.
      The sag in recent months is right-censoring, not less fix work --
      their threads haven't been cited YET. A non-additive ratio, so it is
      computed from the atomic message grain at the month, never re-aggregated
      from a stored per-period value. Complete months only.
    source: warehouse
    sql: |
      SELECT
        DATE_TRUNC('month', sent_dt)::DATE AS month_dt,
        list_name,
        COUNT(*) FILTER (WHERE is_fix_linked) / COUNT(*)::DOUBLE AS fix_linked_share
      FROM {{ ref('fct_messages') }}
      WHERE sent_dt < DATE_TRUNC('month', CURRENT_DATE)
      GROUP BY 1, 2
      ORDER BY 1, 2

  hackers_threads:
    notes: >
      New pgsql-hackers threads per month (fct_threads: root with no reply
      header) by what became of them -- cited by a backpatched stable-branch
      fix, by beta stabilization, by trunk feature work, or not cited (yet).
      One outcome per thread, ranked stable > beta > trunk. Complete months
      only. Recent months are right-censored: threads take a while to be
      cited, see the median latency KPI beside the chart.
    source: warehouse
    sql: |
      SELECT
        DATE_TRUNC('month', started_dt)::DATE AS month_dt,
        outcome,
        COUNT(*) AS thread_cnt
      FROM {{ ref('fct_threads') }}
      WHERE list_name = 'pgsql-hackers' AND is_new_thread
        AND DATE_TRUNC('month', started_dt) < DATE_TRUNC('month', CURRENT_DATE)
      GROUP BY 1, 2
      ORDER BY 1, 2

  hackers_cite_latency:
    notes: >
      Median days from a new pgsql-hackers thread's start to the first commit
      citing it, over cited threads -- the horizon within which the outcome
      split above is roughly settled.
    source: warehouse
    sql: |
      SELECT
        MEDIAN(days_to_first_cite)::INTEGER AS median_days,
        COUNT(*) AS cited_threads
      FROM {{ ref('fct_threads') }}
      WHERE list_name = 'pgsql-hackers' AND is_new_thread AND is_cited

  hackers_cited_share:
    notes: >
      Of the new pgsql-hackers threads started in the last complete calendar
      year (old enough to be settled), the share cited by any commit, and by a
      backpatched fix.
    source: warehouse
    sql: |
      SELECT
        ROUND(AVG(is_cited::INTEGER), 3) AS cited_share,
        ROUND(AVG(is_cited_by_stable::INTEGER), 3) AS fix_share,
        COUNT(*) AS threads
      FROM {{ ref('fct_threads') }}
      WHERE list_name = 'pgsql-hackers' AND is_new_thread
        AND started_dt >= DATE_TRUNC('year', CURRENT_DATE) - INTERVAL 1 YEAR
        AND started_dt < DATE_TRUNC('year', CURRENT_DATE)

  recent_weekly_traffic:
    notes: >
      The same two measures per list per week over the last three rolling
      months -- the near-term zoom of monthly_traffic. The last point is the
      CURRENT week, still filling.
    source: warehouse
    sql: |
      SELECT
        DATE_TRUNC('week', sent_dt)::DATE AS week_dt,
        list_name,
        COUNT(*) AS "all",
        COUNT(*) FILTER (WHERE is_fix_linked) AS "fix-linked"
      FROM {{ ref('fct_messages') }}
      WHERE sent_dt >= DATE_TRUNC('week', CURRENT_DATE - INTERVAL 3 MONTH) + INTERVAL 7 DAY
      GROUP BY ALL
      ORDER BY 1, 2

  recent_weekly_share:
    notes: >
      Fix-linked share per week over the last three rolling months.
      Heavily right-censored -- these threads have had little time to be
      cited by commits. Computed from the atomic message grain at the week,
      like monthly_linked_share. Complete weeks only.
    source: warehouse
    sql: |
      SELECT
        DATE_TRUNC('week', sent_dt)::DATE AS week_dt,
        list_name,
        COUNT(*) FILTER (WHERE is_fix_linked) / COUNT(*)::DOUBLE AS fix_linked_share
      FROM {{ ref('fct_messages') }}
      WHERE sent_dt >= DATE_TRUNC('week', CURRENT_DATE - INTERVAL 3 MONTH) + INTERVAL 7 DAY
        AND sent_dt < DATE_TRUNC('week', CURRENT_DATE)
      GROUP BY 1, 2
      ORDER BY 1, 2

  cited_threads:
    notes: Distinct discussion threads cited by master commits, per month by source.
    source: warehouse
    sql: |
      SELECT
        month_dt,
        CASE origin
          WHEN 'unknown_or_internal_security' THEN 'embargoed security'
          WHEN 'unknown_or_internal_not_security' THEN 'unsourced'
          ELSE origin
        END AS origin,
        cited_thread_cnt
      FROM {{ ref('fct_origin_activity_monthly_agg') }}
      ORDER BY 1, 2

  ai_threads:
    notes: >
      Threads whose first message discloses AI involvement (a vendor and a work
      role; reviewed local-LLM labels on fct_threads), per month, split by what
      the AI did. A thread with two roles counts in both.
    source: warehouse
    sql: |
      WITH roles AS (
        SELECT started_dt, list_name, root_message_id, 'found the bug' AS role FROM {{ ref('fct_threads') }} WHERE has_ai_involvement AND ai_found
        UNION ALL
        SELECT started_dt, list_name, root_message_id, 'analyzed it' FROM {{ ref('fct_threads') }} WHERE has_ai_involvement AND ai_analyzed
        UNION ALL
        SELECT started_dt, list_name, root_message_id, 'wrote the code' FROM {{ ref('fct_threads') }} WHERE has_ai_involvement AND ai_authored
        UNION ALL
        SELECT started_dt, list_name, root_message_id, 'built a tool' FROM {{ ref('fct_threads') }} WHERE has_ai_involvement AND ai_tooling
      )
      SELECT
        DATE_TRUNC('month', started_dt)::DATE AS month_dt,
        role,
        COUNT(*) AS threads
      FROM roles
      WHERE started_dt >= DATE '2025-01-01'
      GROUP BY 1, 2
      ORDER BY 1, 2

  ai_threads_by_list:
    notes: AI-involved threads per month by list, with the share of all new threads that month.
    source: warehouse
    sql: |
      SELECT
        DATE_TRUNC('month', started_dt)::DATE AS month_dt,
        list_name,
        COUNT(*) FILTER (WHERE has_ai_involvement) AS ai_threads,
        ROUND(COUNT(*) FILTER (WHERE has_ai_involvement) * 1.0 / COUNT(*), 4) AS ai_share
      FROM {{ ref('fct_threads') }}
      WHERE started_dt >= DATE '2025-01-01'
      GROUP BY 1, 2
      ORDER BY 1, 2

  ai_thread_lines:
    notes: The AI-involved threads with their roles, vendor and the model's evidence, newest first.
    source: warehouse
    sql: |
      SELECT
        started_dt,
        list_name,
        subject,
        CONCAT_WS(' + ',
          CASE WHEN ai_found THEN 'found' END,
          CASE WHEN ai_analyzed THEN 'analyzed' END,
          CASE WHEN ai_authored THEN 'authored' END,
          CASE WHEN ai_tooling THEN 'tooling' END) AS roles,
        ai_vendor AS vendor,
        ai_disclosure_form AS form,
        ai_label_source AS label_source,
        is_acted_upon
      FROM {{ ref('fct_threads') }}
      WHERE has_ai_involvement
      -- list + subject break same-day ties so the table's page order is deterministic
      ORDER BY 1 DESC, 2, 3

charts:

  monthly_traffic:
    type: line
    query: monthly_traffic
    title: "Monthly list traffic vs fix-linked traffic"
    subtitle: "Messages per month, whole archive; fix-linked = the thread is eventually cited by a commit (recent months right-censored). The last point is the current month, still filling — a partial count, not a drop"
    x: month_dt
    y: [all, fix-linked]
    color: list_name
    height: 380
  monthly_linked_share:
    type: line
    query: monthly_linked_share
    title: "Fix-linked share of monthly traffic"
    subtitle: "Percent of each month's messages in commit-cited threads; the recent sag is right-censoring, not less fix work"
    x: month_dt
    y: fix_linked_share
    color: list_name
    style:
      axis_y:
        labels:
          format: ".1%"

  hackers_threads:
    type: area
    query: hackers_threads
    title: "New pgsql-hackers threads per month, by outcome"
    subtitle: "Threads started, stacked by what they led to: a backpatched fix, beta stabilization, trunk feature work, or no citing commit (yet). Recent months right-censored"
    x: month_dt
    y: thread_cnt
    color: outcome
    style: { stack: zero }

  hackers_cite_latency:
    type: kpi
    query: hackers_cite_latency
    label: "Median days: thread start to first citing commit"
    value: median_days

  hackers_cited_share:
    type: kpi
    query: hackers_cited_share
    label: "Last year's new threads cited by a commit"
    value: cited_share
    style: { value: { format: ".0%" } }

  hackers_fix_share:
    type: kpi
    query: hackers_cited_share
    label: "Last year's new threads cited by a backpatched fix"
    value: fix_share
    style: { value: { format: ".0%" } }

  recent_weekly_traffic:
    type: line
    query: recent_weekly_traffic
    title: "Weekly list traffic, last three months"
    subtitle: "Near-term zoom: messages per week vs the fix-linked subset. The last point is the current week, still filling — a partial count, not a drop"
    x: week_dt
    y: [all, fix-linked]
    color: list_name
  recent_weekly_share:
    type: line
    query: recent_weekly_share
    title: "Fix-linked share of weekly traffic, last three months"
    subtitle: "Heavily right-censored — recent threads have had little time to be cited"
    x: week_dt
    y: fix_linked_share
    color: list_name
    style:
      axis_y:
        labels:
          format: ".1%"

  cited_threads:
    type: area
    query: cited_threads
    title: "Cited discussion threads per month, by source"
    subtitle: "Distinct threads referenced by master commits' Discussion: trailers (UTC months)"
    x: month_dt
    y: cited_thread_cnt
    color: origin

  ai_threads:
    type: bar
    query: ai_threads
    title: "Threads disclosing AI involvement, by role"
    subtitle: "First message names an AI tool and what it did; reviewed by hand. A thread can carry several roles"
    x: month_dt
    y: threads
    color: role

  ai_threads_by_list:
    type: bar
    query: ai_threads_by_list
    title: "AI-involved threads per month, by list"
    subtitle: "Count of new threads whose first message discloses AI involvement"
    x: month_dt
    y: ai_threads
    color: list_name

  ai_thread_table:
    type: table
    query: ai_thread_lines
    title: "AI-involved threads"

rows:
  - monthly_traffic
  - monthly_linked_share
  - recent_weekly_traffic
  - recent_weekly_share
  - hackers_threads
  - cols: [hackers_cite_latency, hackers_cited_share, hackers_fix_share]
  - cited_threads
  - cols: [ai_threads, ai_threads_by_list]
  - ai_thread_table
