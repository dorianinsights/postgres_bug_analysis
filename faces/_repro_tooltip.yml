title: "Normalize Tooltip Repro"
queries:
  segments:
    type: values
    columns: [month, segment, amount]
    values:
      - ["Jan", "alpha", 45]
      - ["Jan", "beta", 20]
      - ["Jan", "gamma", 3]
      - ["Feb", "alpha", 50]
      - ["Feb", "beta", 28]
      - ["Feb", "gamma", 4]

charts:
  share:
    type: bar
    query: segments
    title: "100% stacked over raw counts"
    subtitle: "stack: normalize + axis_y format .0% — hover a bar"
    x: month
    y: amount
    color: segment
    style:
      orientation: vertical
      stack: normalize
      axis_y:
        labels:
          format: ".0%"
    height: 400

rows:
  - share
