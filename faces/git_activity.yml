title: "PostgreSQL Fix Velocity — Git Commits"
description: >
  Commit-level view of the PostgreSQL stable branches (majors 15-18) plus
  master: quarterly backpatch volume, AI-tool-credited fixes, and the pace of
  the currently open release cycle. Data files are produced by
  scrape_git_commits.py + the transform/ dbt project.

queries:
  quarterly_distinct:
    description: >
      Distinct fix commits across all stable branches per quarter (subjects
      deduplicated across branches; release plumbing excluded). The current
      quarter is partial.
    source: warehouse
    sql: |
      SELECT
        DATE_TRUNC('quarter', commit_dt)::DATE AS quarter,
        'distinct fixes' AS series,
        COUNT(DISTINCT LOWER(TRIM(subject))) AS distinct_fix_cnt
      FROM fct_commits
      WHERE branch != 'master' AND NOT is_plumbing
      GROUP BY 1
      ORDER BY 1

  quarterly_by_branch:
    description: >
      Fix commits per stable branch per quarter (each branch counts its own
      backpatches; plumbing excluded).
    source: warehouse
    sql: |
      SELECT
        DATE_TRUNC('quarter', commit_dt)::DATE AS quarter,
        branch,
        COUNT(*) AS fix_commits
      FROM fct_commits
      WHERE branch != 'master' AND NOT is_plumbing
      GROUP BY 1, 2
      ORDER BY 1, 2

  ai_credited:
    description: >
      Distinct commits whose message credits an AI tool (Claude, ChatGPT,
      Copilot, ...), per quarter, across stable branches and master.
    source: warehouse
    sql: |
      SELECT
        DATE_TRUNC('quarter', commit_dt)::DATE AS quarter,
        'AI-credited commits' AS series,
        COUNT(DISTINCT LOWER(TRIM(subject))) AS ai_credited_commits
      FROM fct_commits
      WHERE ai_credit IS NOT NULL
      GROUP BY 1
      ORDER BY 1

  ai_credit_lines:
    description: The AI-credited fix commits with their credit lines, newest first.
    source: warehouse
    sql: |
      SELECT
        MIN(commit_dt) AS commit_dt,
        subject,
        MIN(ai_credit) AS credit_line
      FROM fct_commits
      WHERE ai_credit IS NOT NULL
      GROUP BY 2
      ORDER BY 1 DESC

  cycle_pace:
    description: >
      Like-for-like release-cycle pace: distinct stable-branch fixes committed
      in the first N days after each scheduled wrap, where N is the age of the
      currently open cycle, next to each closed cycle's full total.
    source: warehouse
    sql: |
      -- label leads with the ISO date so the band's alphabetical order IS
      -- chronological (the trailing word keeps dct from date-parsing it)
      SELECT STRFTIME(cycle_start_dt, '%Y-%m-%d wrap') AS cycle, 'first ' || window_days || ' days' AS pace_window, early_distinct_fix_cnt AS fixes
      FROM git_cycle_pace
      UNION ALL
      SELECT STRFTIME(cycle_start_dt, '%Y-%m-%d wrap') AS cycle, 'full cycle' AS pace_window, full_distinct_fix_cnt AS fixes
      FROM git_cycle_pace
      WHERE NOT is_open_cycle
      ORDER BY 1, 2

charts:
  quarterly_distinct:
    type: bar
    query: quarterly_distinct
    title: "Distinct backpatched fixes per quarter"
    subtitle: "Across REL_15..18_STABLE, deduplicated by commit subject; current quarter partial"
    x: quarter
    y: distinct_fix_cnt
    color: series
    height: 380

  quarterly_by_branch:
    type: line
    query: quarterly_by_branch
    title: "Fix commits per stable branch per quarter"
    subtitle: "Newer branches receive more backpatches; every branch jumps in Q3 2026"
    x: quarter
    y: fix_commits
    color: branch
    height: 380

  ai_credited:
    type: bar
    query: ai_credited
    title: "Commits crediting an AI tool"
    subtitle: "Zero before 2026; accelerating since the Aug 2026 wrap"
    x: quarter
    y: ai_credited_commits
    color: series
    height: 340

  cycle_pace:
    type: bar
    query: cycle_pace
    title: "Release-cycle pace, like for like"
    subtitle: "Fixes queued in each cycle's first N days (N = the open cycle's age) vs its full total"
    x: cycle
    y: fixes
    color: pace_window
    style: { stack: none }
    height: 340

  ai_credit_table:
    type: table
    query: ai_credit_lines
    title: "AI-credited fix commits"

rows:
  - quarterly_distinct
  - quarterly_by_branch
  - cols: [ai_credited, cycle_pace]
  - ai_credit_table
