# Where PostgreSQL's fixes and development discussions actually come
# from: filed pgsql-bugs reports vs pgsql-hackers threads vs work with no
# public trail (embargoed security, uningested lists, no trailer).
#
# Wave bars use short "Mon YY" labels on a categorical axis with an
# explicit chronological sort key (temporal bar axes label every bar with
# wide two-line labels that collide at narrow widths). Monthly series use
# areas — bars would label all ~58 months.
title: "PostgreSQL Fix Origins"
description: >
  Source attribution for fixes and development activity: each fix and
  master-branch commit is traced through its Discussion: trailers to
  pgsql-bugs (or a Bug: # trailer), pgsql-hackers, or
  unknown/other/internal when there is no public trail. Built to ground
  projections of how bug-report volume translates into fix volume. Data
  from the transform/ dbt project (fct_fix_origins_agg,
  fct_origin_activity_monthly_agg).

queries:

  fix_origin_shares:
    ignore: ["WARN-MISSING-JOIN-PREDICATE"]  # the zero-fill spine is a deliberate cross join
    description: >
      True per-wave origin shares (fractions summing to 1) so the percent
      format is honest in the axis AND the tooltip's value/Total rows —
      feeding counts through stack:normalize left the tooltip's raw rows
      percent-formatted ("2000%").
    source: warehouse
    sql: |
      WITH waves AS (
        SELECT DISTINCT wave_dt FROM fct_fix_origins_agg WHERE NOT is_out_of_band
      ),
      origins AS (
        SELECT DISTINCT origin FROM fct_fix_origins_agg
      )
      SELECT
        STRFTIME(wvs.wave_dt, '%b %y') AS wave,
        EPOCH(wvs.wave_dt)::BIGINT AS wave_seq,
        CASE org.origin
          WHEN 'unknown_or_internal_security' THEN 'embargoed security'
          WHEN 'unknown_or_internal_not_security' THEN 'unsourced'
          ELSE org.origin
        END AS origin,
        ROUND(
          COALESCE(fxo.fix_cnt, 0)
          * 1.0 / SUM(COALESCE(fxo.fix_cnt, 0)) OVER (PARTITION BY wvs.wave_dt),
          4
        ) AS fix_share
      FROM waves AS wvs
      CROSS JOIN origins AS org
      LEFT JOIN fct_fix_origins_agg AS fxo
        ON fxo.wave_dt = wvs.wave_dt AND fxo.origin = org.origin
      UNION ALL
      -- the in-progress next wave's origin shares (see fct_fix_origins_agg below)
      SELECT
        (SELECT STRFTIME(MIN(ships_at_dt), '%b %y') || ' (in progress)' FROM fct_pending_fix_origins_agg),
        (SELECT EPOCH(MIN(ships_at_dt))::BIGINT FROM fct_pending_fix_origins_agg),
        labels.origin,
        ROUND(
          COALESCE(pnd.fix_cnt, 0)
          * 1.0 / (SELECT SUM(fix_cnt) FROM fct_pending_fix_origins_agg),
          4
        )
      FROM (SELECT UNNEST(['pgsql-bugs', 'pgsql-hackers', 'embargoed security', 'unsourced']) AS origin) AS labels
      LEFT JOIN (
        SELECT
          CASE origin WHEN 'unknown_or_internal' THEN 'unsourced' ELSE origin END AS origin,
          fix_cnt
        FROM fct_pending_fix_origins_agg
      ) AS pnd ON pnd.origin = labels.origin
      ORDER BY 2, 3

  fct_fix_origins_agg:
    ignore: ["WARN-MISSING-JOIN-PREDICATE"]  # the zero-fill spine is a deliberate cross join
    description: >
      Distinct fixes per scheduled wave by origin (out-of-band emergency
      waves excluded — their tiny totals distort the shares). Short "Mon
      YY" labels ride a categorical axis; wave_seq is the chronological
      sort key.
    source: warehouse
    sql: |
      -- zero-filled: every wave carries every origin so the chart sort
      -- (which SUMS wave_seq over each wave's rows) stays chronological
      -- regardless of how many origins a wave actually has
      WITH waves AS (
        SELECT DISTINCT wave_dt FROM fct_fix_origins_agg WHERE NOT is_out_of_band
      ),
      origins AS (
        SELECT DISTINCT origin FROM fct_fix_origins_agg
      )
      SELECT
        STRFTIME(wvs.wave_dt, '%b %y') AS wave,
        EPOCH(wvs.wave_dt)::BIGINT AS wave_seq,
        CASE org.origin
          WHEN 'unknown_or_internal_security' THEN 'embargoed security'
          WHEN 'unknown_or_internal_not_security' THEN 'unsourced'
          ELSE org.origin
        END AS origin,
        COALESCE(fxo.fix_cnt, 0) AS fix_cnt
      FROM waves AS wvs
      CROSS JOIN origins AS org
      LEFT JOIN fct_fix_origins_agg AS fxo
        ON fxo.wave_dt = wvs.wave_dt AND fxo.origin = org.origin
      UNION ALL
      -- the in-progress next wave: fixes already committed toward the next
      -- minor (fct_pending_fix_origins_agg), zero-filled over the same four display
      -- labels so the categorical sort (which SUMS wave_seq per wave) keeps
      -- it last. 'embargoed security' is 0 by construction — that work only
      -- reaches public git on wrap day.
      SELECT
        (SELECT STRFTIME(MIN(ships_at_dt), '%b %y') || ' (in progress)' FROM fct_pending_fix_origins_agg),
        (SELECT EPOCH(MIN(ships_at_dt))::BIGINT FROM fct_pending_fix_origins_agg),
        labels.origin,
        COALESCE(pnd.fix_cnt, 0)
      FROM (SELECT UNNEST(['pgsql-bugs', 'pgsql-hackers', 'embargoed security', 'unsourced']) AS origin) AS labels
      LEFT JOIN (
        SELECT
          CASE origin WHEN 'unknown_or_internal' THEN 'unsourced' ELSE origin END AS origin,
          fix_cnt
        FROM fct_pending_fix_origins_agg
      ) AS pnd ON pnd.origin = labels.origin
      ORDER BY 2, 3

  cited_threads:
    description: Distinct discussion threads cited by master commits, per month by source.
    source: warehouse
    sql: |
      SELECT
        month_dt,
        CASE origin
          WHEN 'unknown_or_internal_security' THEN 'embargoed security'
          WHEN 'unknown_or_internal_not_security' THEN 'unsourced'
          ELSE origin
        END AS origin,
        cited_thread_cnt
      FROM fct_origin_activity_monthly_agg
      ORDER BY 1, 2

  ai_commits:
    description: AI-flagged master commits per month by origin.
    source: warehouse
    sql: |
      SELECT
        month_dt,
        CASE origin
          WHEN 'unknown_or_internal_security' THEN 'embargoed security'
          WHEN 'unknown_or_internal_not_security' THEN 'unsourced'
          ELSE origin
        END AS origin,
        ai_commit_cnt
      FROM fct_origin_activity_monthly_agg
      WHERE month_dt >= DATE '2026-01-01'
      ORDER BY 1, 2

  monthly_traffic:
    description: >
      Monthly messages per list over the whole archive, split into all
      traffic vs the fix-linked subset (messages whose thread a commit
      eventually cites). Complete months only.
    source: warehouse
    sql: |
      SELECT month_dt, list_name || ' (all)' AS series, message_cnt AS messages
      FROM fct_list_traffic_monthly_agg
      WHERE month_dt < DATE_TRUNC('month', CURRENT_DATE)
      UNION ALL
      SELECT month_dt, list_name || ' (fix-linked)' AS series, fix_linked_message_cnt
      FROM fct_list_traffic_monthly_agg
      WHERE month_dt < DATE_TRUNC('month', CURRENT_DATE)
      ORDER BY 1, 2

  monthly_linked_share:
    description: >
      Share of each month's messages that belong to commit-cited threads.
      The sag in recent months is right-censoring, not less fix work —
      their threads haven't been cited YET.
    source: warehouse
    sql: |
      SELECT
        month_dt,
        list_name,
        ROUND(fix_linked_message_cnt * 1.0 / message_cnt, 3) AS fix_linked_share
      FROM fct_list_traffic_monthly_agg
      WHERE month_dt < DATE_TRUNC('month', CURRENT_DATE)
      ORDER BY 1, 2

  recent_weekly_traffic:
    description: >
      The same traffic split per week over the last three rolling months,
      complete weeks only — the near-term zoom of monthly_traffic.
    source: warehouse
    sql: |
      SELECT week_dt, list_name || ' (all)' AS series, message_cnt AS messages
      FROM fct_list_traffic_weekly_agg
      WHERE week_dt >= DATE_TRUNC('week', CURRENT_DATE - INTERVAL 3 MONTH) + INTERVAL 7 DAY
        AND week_dt < DATE_TRUNC('week', CURRENT_DATE)
      UNION ALL
      SELECT week_dt, list_name || ' (fix-linked)' AS series, fix_linked_message_cnt
      FROM fct_list_traffic_weekly_agg
      WHERE week_dt >= DATE_TRUNC('week', CURRENT_DATE - INTERVAL 3 MONTH) + INTERVAL 7 DAY
        AND week_dt < DATE_TRUNC('week', CURRENT_DATE)
      ORDER BY 1, 2

  recent_weekly_share:
    description: >
      Fix-linked share per week over the last three rolling months.
      Heavily right-censored — these threads have had little time to be
      cited by commits.
    source: warehouse
    sql: |
      SELECT
        week_dt,
        list_name,
        ROUND(fix_linked_message_cnt * 1.0 / message_cnt, 3) AS fix_linked_share
      FROM fct_list_traffic_weekly_agg
      WHERE week_dt >= DATE_TRUNC('week', CURRENT_DATE - INTERVAL 3 MONTH) + INTERVAL 7 DAY
        AND week_dt < DATE_TRUNC('week', CURRENT_DATE)
      ORDER BY 1, 2

charts:

  fix_origin_counts:
    type: bar
    query: fct_fix_origins_agg
    title: "Fix origins per wave"
    subtitle: "Distinct fixes by source; out-of-band waves excluded. The rightmost '(in progress)' bar is the next minor's fixes committed so far — right-censored and with no security yet (embargoed until wrap)"
    x: wave
    y: fix_cnt
    color: origin
    sort: { by: wave_seq, order: asc }
    # string x would auto-flip horizontal; these are time series, keep vertical
    style: { stack: zero, orientation: vertical }
    height: 360

  fix_origin_share:
    type: bar
    query: fix_origin_shares
    title: "Fix origin share per wave"
    subtitle: "Same data as shares; out-of-band waves excluded — pgsql-bugs supplies a quarter to a third. The '(in progress)' bar skews to pgsql-hackers because embargoed security work has not landed yet"
    x: wave
    y: fix_share
    color: origin
    sort: { by: wave_seq, order: asc }
    style:
      orientation: vertical
      # true fractions stacked to 1.0 (NOT stack:normalize over counts,
      # which percent-formats the tooltip's raw rows)
      stack: zero
      axis_y:
        labels:
          format: ".0%"
    height: 360

  cited_threads:
    type: area
    query: cited_threads
    title: "Cited discussion threads per month, by source"
    subtitle: "Distinct threads referenced by master commits' Discussion: trailers (UTC months)"
    x: month_dt
    y: cited_thread_cnt
    color: origin
    height: 340

  ai_commits:
    type: area
    query: ai_commits
    title: "AI-flagged commits per month, by origin"
    subtitle: "Master commits crediting an AI tool; stacked, so the top edge is the monthly total"
    x: month_dt
    y: ai_commit_cnt
    color: origin
    # stacked (not the overlapping default) so the upper contour reads as
    # the total AI-flagged count per month
    style: { stack: zero }
    height: 340

  monthly_traffic:
    type: line
    query: monthly_traffic
    title: "Monthly list traffic vs fix-linked traffic"
    subtitle: "Messages per month, whole archive; fix-linked = the thread is eventually cited by a commit (recent months right-censored)"
    x: month_dt
    y: messages
    color: series
    height: 380

  monthly_linked_share:
    type: line
    query: monthly_linked_share
    title: "Fix-linked share of monthly traffic"
    subtitle: "Percent of each month's messages in commit-cited threads; the recent sag is right-censoring, not less fix work"
    x: month_dt
    y: fix_linked_share
    color: list_name
    style:
      axis_y:
        labels:
          format: ".0%"
    height: 340

  recent_weekly_traffic:
    type: line
    query: recent_weekly_traffic
    title: "Weekly list traffic, last three months"
    subtitle: "Near-term zoom: messages per complete week vs the fix-linked subset"
    x: week_dt
    y: messages
    color: series
    height: 340

  recent_weekly_share:
    type: line
    query: recent_weekly_share
    title: "Fix-linked share of weekly traffic, last three months"
    subtitle: "Heavily right-censored — recent threads have had little time to be cited"
    x: week_dt
    y: fix_linked_share
    color: list_name
    style:
      axis_y:
        labels:
          format: ".0%"
    height: 340

rows:
  - fix_origin_counts
  - fix_origin_share
  - monthly_traffic
  - monthly_linked_share
  - recent_weekly_traffic
  - recent_weekly_share
  - cited_threads
  - ai_commits
