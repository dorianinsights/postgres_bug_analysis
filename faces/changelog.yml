title: "PostgreSQL Fix Velocity — Changelog"
description: >
  Every minor release of PostgreSQL majors 15-18, scraped from the official
  release notes: fix volume per quarterly release wave, fix categories,
  security fixes, contributors, and next-wave projection scenarios.
  Data files are produced by scrape_release_notes_sgml.py + the transform/
  dbt project.

# NOTE on the *_pad queries and invisible scatter layers: dataface 0.4.0
# renders bars on a temporal x-axis centered on their date with the scale
# domain spanning exactly min..max, so the first/last bars overhang the axis
# ends. Each bar chart therefore carries a zero-opacity scatter layer with two
# points 45 days beyond the data ends — layer x-values extend the base x-scale,
# padding the domain so every bar sits inside. (Padding rows in the bar query
# itself suppresses all x-axis labels in 0.4.0; the layer route keeps them.)

queries:
  latest_wave:
    description: The most recent release wave's headline numbers.
    source: warehouse
    sql: |
      SELECT wave_dt, versions, distinct_fix_cnt, security_fix_cnt, distinct_cve_cnt
      FROM wave_summary
      ORDER BY 1 DESC
      LIMIT 1

  releases_by_branch:
    description: >
      Fix items per scheduled minor release, one series per major version.
      Out-of-band emergency re-releases (< 20 items) are excluded.
    source: ../data/raw/releases.csv
    sql: |
      SELECT
        date,
        'PG' || major AS branch,
        n_items
      FROM releases
      WHERE minor > 0 AND n_items >= 20
      -- major (the tiebreak) is not in the select list, so it stays named
      ORDER BY 1, major

  wave_categories:
    description: >
      Distinct fixes per full-quarter wave by category (backpatched
      duplicates collapsed across branches; out-of-band waves excluded).
    source: warehouse
    sql: |
      SELECT wave_dt, category, category_order, fix_cnt
      FROM wave_categories
      WHERE NOT is_out_of_band
      ORDER BY 1, 3

  wave_category_shares:
    description: >
      Per-wave category shares as true fractions (sum to 1 per wave) so
      the percent format is honest in axis and tooltip alike.
    source: warehouse
    sql: |
      SELECT
        wave_dt,
        category,
        category_order,
        ROUND(fix_cnt * 1.0 / SUM(fix_cnt) OVER (PARTITION BY wave_dt), 4) AS fix_share
      FROM wave_categories
      WHERE NOT is_out_of_band
      ORDER BY 1, 3

  wave_pad:
    description: Invisible x-domain padding points for the scheduled-wave bar charts.
    source: warehouse
    sql: |
      SELECT MIN(wave_dt) - 45 AS wave_dt, 'Other functionality' AS category, 0 AS pad_zero
      FROM wave_categories WHERE NOT is_out_of_band
      UNION ALL
      SELECT MAX(wave_dt) + 45, 'Other functionality', 0
      FROM wave_categories WHERE NOT is_out_of_band

  oob_categories:
    description: The out-of-band emergency waves' fixes by category.
    source: warehouse
    sql: |
      SELECT wave_dt, category, category_order, fix_cnt
      FROM wave_categories
      WHERE is_out_of_band
      ORDER BY 1, 3

  oob_pad:
    description: Invisible x-domain padding points for the out-of-band bar chart.
    source: warehouse
    sql: |
      SELECT MIN(wave_dt) - 45 AS wave_dt, 'Crash & corruption' AS category, 0 AS pad_zero
      FROM wave_categories WHERE is_out_of_band
      UNION ALL
      SELECT MAX(wave_dt) + 45, 'Crash & corruption', 0
      FROM wave_categories WHERE is_out_of_band

  security_pad:
    description: Invisible x-domain padding points for the security bar chart.
    source: warehouse
    sql: |
      SELECT MIN(wave_dt) - 45 AS wave_dt, 'Security (CVE)' AS category, 0 AS pad_zero
      FROM wave_categories WHERE NOT is_out_of_band
      UNION ALL
      SELECT MAX(wave_dt) + 45, 'Security (CVE)', 0
      FROM wave_categories WHERE NOT is_out_of_band

  security_by_wave:
    description: >
      Security fixes per scheduled wave, split into CVE-tagged and
      uncredited hardening.
    source: warehouse
    sql: |
      SELECT wave_dt, category, category_order, fix_cnt
      FROM wave_categories
      WHERE NOT is_out_of_band
        AND category IN ('Security (CVE)', 'Security hardening (no CVE)')
      ORDER BY 1, 3

  contributors_by_wave:
    description: >
      Distinct credited contributors per scheduled wave, split into names
      appearing for the first time in this corpus vs returning names.
    source: warehouse
    sql: |
      SELECT
        wc.wave_dt,
        CASE WHEN wc.is_first_wave THEN 'first-time' ELSE 'returning' END AS cohort,
        COUNT(DISTINCT wc.contributor) AS contributors
      FROM wave_contributors AS wc
      WHERE NOT wc.is_out_of_band
      GROUP BY 1, 2
      ORDER BY 1, 2 DESC

  contrib_pad:
    description: Invisible x-domain padding points for the contributors bar chart.
    source: warehouse
    sql: |
      SELECT MIN(wave_dt) - 45 AS wave_dt, 'returning' AS cohort, 0 AS pad_zero
      FROM wave_categories WHERE NOT is_out_of_band
      UNION ALL
      SELECT MAX(wave_dt) + 45, 'returning', 0
      FROM wave_categories WHERE NOT is_out_of_band

  wave_trend:
    ignore: ["WARN-MISSING-JOIN-PREDICATE"]
    description: >
      Least-squares trendlines over full-quarter wave totals (the partial
      first wave excluded): one fit over all waves, one excluding the latest
      wave as a sensitivity check.
    source: warehouse
    sql: |
      WITH fullq AS (
        SELECT wave_dt,
               ROW_NUMBER() OVER (ORDER BY wave_dt) - 1 AS slot,
               distinct_fix_cnt
        FROM wave_summary
        WHERE NOT is_out_of_band AND NOT is_partial_window
      ),
      fit_all AS (
        SELECT REGR_SLOPE(distinct_fix_cnt, slot) AS b, REGR_INTERCEPT(distinct_fix_cnt, slot) AS a FROM fullq
      ),
      fit_ex AS (
        SELECT REGR_SLOPE(distinct_fix_cnt, slot) AS b, REGR_INTERCEPT(distinct_fix_cnt, slot) AS a
        FROM fullq WHERE slot < (SELECT MAX(slot) FROM fullq)
      )
      SELECT fullq.wave_dt,
             fit_all.a + fit_all.b * fullq.slot AS trend_all,
             fit_ex.a + fit_ex.b * fullq.slot AS trend_excl_latest
      FROM fullq, fit_all, fit_ex
      ORDER BY 1

  security_trend:
    ignore: ["WARN-MISSING-JOIN-PREDICATE"]
    description: Same two trendlines fitted to the security-fix totals per wave.
    source: warehouse
    sql: |
      WITH fullq AS (
        SELECT wave_dt,
               ROW_NUMBER() OVER (ORDER BY wave_dt) - 1 AS slot,
               security_fix_cnt
        FROM wave_summary
        WHERE NOT is_out_of_band AND NOT is_partial_window
      ),
      fit_all AS (
        SELECT REGR_SLOPE(security_fix_cnt, slot) AS b, REGR_INTERCEPT(security_fix_cnt, slot) AS a FROM fullq
      ),
      fit_ex AS (
        SELECT REGR_SLOPE(security_fix_cnt, slot) AS b, REGR_INTERCEPT(security_fix_cnt, slot) AS a
        FROM fullq WHERE slot < (SELECT MAX(slot) FROM fullq)
      )
      SELECT fullq.wave_dt,
             fit_all.a + fit_all.b * fullq.slot AS trend_all,
             fit_ex.a + fit_ex.b * fullq.slot AS trend_excl_latest
      FROM fullq, fit_all, fit_ex
      ORDER BY 1

  branch_trend:
    ignore: ["WARN-MISSING-JOIN-PREDICATE"]
    description: >
      Pooled trendlines over scheduled per-release fix counts (all branches
      together; 15.1's partial window excluded), against calendar time.
    source: ../data/raw/releases.csv
    sql: |
      WITH sched AS (
        SELECT CAST(date AS DATE) AS date, n_items,
               DATE_DIFF('day', DATE '2022-01-01', CAST(date AS DATE)) AS t
        FROM releases
        WHERE minor > 0 AND n_items >= 20 AND NOT (major = 15 AND minor = 1)
      ),
      fit_all AS (SELECT REGR_SLOPE(n_items, t) AS b, REGR_INTERCEPT(n_items, t) AS a FROM sched),
      fit_ex AS (
        SELECT REGR_SLOPE(n_items, t) AS b, REGR_INTERCEPT(n_items, t) AS a
        FROM sched WHERE sched.date < (SELECT MAX(date) FROM sched)
      )
      SELECT DISTINCT sched.date,
             fit_all.a + fit_all.b * sched.t AS trend_all,
             fit_ex.a + fit_ex.b * sched.t AS trend_excl_latest
      FROM sched, fit_all, fit_ex
      ORDER BY 1

  wave_totals:
    description: Distinct fixes per full-quarter wave (the projection base series).
    source: warehouse
    sql: |
      SELECT wave_dt, distinct_fix_cnt
      FROM wave_summary
      WHERE NOT is_out_of_band
      ORDER BY 1

  projections:
    description: Next-wave scenario projections derived from the wave series.
    source: warehouse
    sql: |
      SELECT projected_dt, scenario, distinct_fix_cnt, assumption
      FROM projections
      -- scenario_order is not in the select list, so it stays named
      ORDER BY scenario_order

  wave_table:
    description: All waves with headline numbers, newest first.
    source: warehouse
    sql: |
      SELECT wave_dt, versions, distinct_fix_cnt, security_fix_cnt, distinct_cve_cnt,
             CASE WHEN is_out_of_band THEN 'yes' ELSE '' END AS is_out_of_band
      FROM wave_summary
      ORDER BY 1 DESC

charts:
  kpi_fixes:
    type: kpi
    query: latest_wave
    value: distinct_fix_cnt
    label: "Distinct fixes, latest wave"

  kpi_security:
    type: kpi
    query: latest_wave
    value: security_fix_cnt
    label: "Security fixes, latest wave"

  kpi_cves:
    type: kpi
    query: latest_wave
    value: distinct_cve_cnt
    label: "CVEs closed, latest wave"

  fixes_by_branch:
    type: line
    query: releases_by_branch
    title: "Fixes per scheduled minor release, by major version"
    subtitle: "A fix backpatched to all branches appears on each line"
    x: date
    y: n_items
    color: branch
    y_label: "changelog items"
    height: 380
    layers:
      - type: line
        query: branch_trend
        x: date
        y: trend_all
        label: "pooled trend"
        style: { marks: { line: { stroke: { color: "#8a8a8a", dasharray: "6 5", width: 1.5 } } } }
      - type: line
        query: branch_trend
        x: date
        y: trend_excl_latest
        label: "trend excluding Aug '26"
        style: { marks: { line: { stroke: { color: "#c0392b", dasharray: "3 5", width: 1.5 } } } }

  category_mix:
    type: bar
    query: wave_categories
    title: "Category mix per full-quarter wave"
    subtitle: "Distinct fixes; backpatched duplicates collapsed across branches"
    x: wave_dt
    y: fix_cnt
    color: category
    style: { stack: zero }
    height: 380
    layers:
      - type: scatter
        query: wave_pad
        x: wave_dt
        y: pad_zero
        color: category
        style: { marks: { point: { opacity: 0 } } }
      - type: line
        query: wave_trend
        x: wave_dt
        y: trend_all
        label: "linear trend (full-quarter waves)"
        style: { marks: { line: { stroke: { color: "#8a8a8a", dasharray: "6 5", width: 1.5 } } } }
      - type: line
        query: wave_trend
        x: wave_dt
        y: trend_excl_latest
        label: "trend excluding Aug '26"
        style: { marks: { line: { stroke: { color: "#c0392b", dasharray: "3 5", width: 1.5 } } } }

  category_share:
    type: bar
    query: wave_category_shares
    title: "Same data as shares of each wave"
    subtitle: "100% stacked"
    x: wave_dt
    y: fix_share
    color: category
    style:
      # true fractions stacked to 1.0 (NOT stack:normalize over counts,
      # which percent-formats the tooltip's raw rows)
      stack: zero
      axis_y:
        labels:
          format: ".0%"
    height: 380
    layers:
      - type: scatter
        query: wave_pad
        x: wave_dt
        y: pad_zero
        color: category
        style: { marks: { point: { opacity: 0 } } }

  oob_waves:
    type: bar
    query: oob_categories
    title: "The out-of-band emergency waves"
    subtitle: "Re-releases shipped one or two weeks after a scheduled wave"
    x: wave_dt
    y: fix_cnt
    color: category
    style: { stack: zero }
    height: 340
    layers:
      - type: scatter
        query: oob_pad
        x: wave_dt
        y: pad_zero
        color: category
        style: { marks: { point: { opacity: 0 } } }

  security:
    type: bar
    query: security_by_wave
    title: "The security hockey stick"
    subtitle: "CVE-tagged fixes plus uncredited hardening, per scheduled wave"
    x: wave_dt
    y: fix_cnt
    color: category
    style: { stack: zero }
    height: 340
    layers:
      - type: scatter
        query: security_pad
        x: wave_dt
        y: pad_zero
        color: category
        style: { marks: { point: { opacity: 0 } } }
      - type: line
        query: security_trend
        x: wave_dt
        y: trend_all
        label: "linear trend (full-quarter waves)"
        style: { marks: { line: { stroke: { color: "#8a8a8a", dasharray: "6 5", width: 1.5 } } } }
      - type: line
        query: security_trend
        x: wave_dt
        y: trend_excl_latest
        label: "trend excluding Aug '26"
        style: { marks: { line: { stroke: { color: "#c0392b", dasharray: "3 5", width: 1.5 } } } }

  contributors:
    type: bar
    query: contributors_by_wave
    title: "Contributors per wave: first-time vs returning"
    subtitle: "Names credited in the release notes; first-time = new to this 2022+ corpus"
    x: wave_dt
    y: contributors
    color: cohort
    style: { stack: zero }
    height: 380
    layers:
      - type: scatter
        query: contrib_pad
        x: wave_dt
        y: pad_zero
        color: cohort
        style: { marks: { point: { opacity: 0 } } }

  projection:
    type: line
    query: wave_totals
    title: "Next-wave projection scenarios"
    subtitle: "Historical distinct fixes per full-quarter wave, with four scenarios for the next wave"
    x: wave_dt
    y: distinct_fix_cnt
    y_label: "distinct fixes"
    height: 380
    layers:
      - type: scatter
        query: projections
        x: projected_dt
        y: distinct_fix_cnt
        color: scenario
        label: "Scenario"
      - type: line
        query: wave_trend
        x: wave_dt
        y: trend_all
        label: ""
        style: { marks: { line: { stroke: { color: "#8a8a8a", dasharray: "6 5", width: 1.5 } } } }

  scenario_table:
    type: table
    query: projections
    title: "Scenario assumptions"

  wave_table:
    type: table
    query: wave_table
    title: "All release waves"

rows:
  - cols: [kpi_fixes, kpi_security, kpi_cves]
  - fixes_by_branch
  - category_mix
  - category_share
  - cols: [oob_waves, security]
  - contributors
  - projection
  - scenario_table
  - wave_table
